<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>星映 · 选择目录</title>
  <script src="../assets/android-preload.js"></script>
  <link rel="stylesheet" href="../assets/theme.css?v=starlight-5" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0f1d; color: #e8ecf7; font: 15px/1.5 system-ui, "Noto Sans SC", sans-serif; }
    header { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 13px 16px; background: #0b0f1de8; backdrop-filter: blur(10px); border-bottom: 1px solid #1e2740; }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .grow { flex: 1 1 200px; }
    input[type="search"] { width: 100%; padding: 10px 13px; border-radius: 11px; border: 1px solid #253055;
      background: #131a2c; color: inherit; font-size: 14px; outline: none; }
    input[type="search"]:focus { border-color: #4b6bff; }
    button { padding: 9px 13px; border-radius: 11px; border: 1px solid #2b3757; background: #172038; color: inherit; font-size: 14px; cursor: pointer; }
    button.primary { background: #2f4bff; border-color: #2f4bff; }
    button.ghost { background: transparent; }
    main { padding: 14px 16px 90px; }
    #crumbs { font-size: 12px; color: #8492b3; margin: 0 0 10px; word-break: break-all; }
    #status { color: #93a0bd; font-size: 13px; margin: 0 0 10px; white-space: pre-wrap; }
    #error { color: #ff9aa8; font-size: 13px; margin: 0 0 10px; white-space: pre-wrap; }
    #list { display: grid; gap: 8px; }
    .row { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 12px;
      background: #121a2c; border: 1px solid #1d2740; cursor: pointer; }
    .row:active { background: #18223a; }
    .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: #1b2440; color: #8fa6ff; }
    .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .go { color: #6f7d9c; font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<header>
  <button id="back" class="ghost" type="button">返回</button>
  <h1>选择收藏目录</h1>
  <div class="grow"><input id="search" type="search" placeholder="在当前目录里搜索文件夹…" autocomplete="off" /></div>
  <button id="use" class="primary" type="button">使用此目录</button>
</header>
<main>
  <p id="crumbs"></p>
  <p id="status">正在读取…</p>
  <p id="error" hidden></p>
  <div id="list"></div>
</main>
<script src="../assets/root-pref.js?v=1"></script>
<script src="pick.js?v=1"></script>
</body>
</html>
