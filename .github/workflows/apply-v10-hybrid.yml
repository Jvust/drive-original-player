name: Apply V10 Hybrid Upgrade

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-v10-hybrid.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild patch and apply V10
        shell: bash
        run: |
          set -euo pipefail
          cat .v10-patch/part*.b64 | base64 -d > /tmp/v10.patch
          git apply --check /tmp/v10.patch
          git apply /tmp/v10.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Upgrade player to V10 hybrid hot-switch"
          git push
