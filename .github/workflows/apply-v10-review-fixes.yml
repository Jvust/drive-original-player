name: Apply verified V10 review fixes

on:
  push:
    paths:
      - ".github/workflows/apply-v10-review-fixes.yml"
      - ".github/scripts/apply_v10_review_fixes.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        run: python .github/scripts/apply_v10_review_fixes.py

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline script found")
          Path("/tmp/player-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/player-inline.js
          node --check sw.js
          git diff --check
          grep -q "isMediaSensitiveForTreeScan" index.html
          grep -q "canUsePrimeFetchResponse" sw.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Fix media-sensitive scan and prime Range guard"
          git push origin HEAD:main
