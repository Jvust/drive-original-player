name: DeepSeek V4-Pro Code Review

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deepseek-code-review.yml"
      - ".github/scripts/deepseek_review.py"

permissions:
  contents: read

jobs:
  deepseek-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout current player
        uses: actions/checkout@v4

      - name: Verify DeepSeek secret
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY is configured."

      - name: Review V10 core with DeepSeek V4-Pro
        shell: bash
        run: python .github/scripts/deepseek_review.py

      - name: Upload DeepSeek review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-v10-code-review-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            deepseek-review.json
            deepseek-review.md
            deepseek-review-error.json
