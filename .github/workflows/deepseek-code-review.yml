name: DeepSeek V4-Pro Code Review

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deepseek-code-review.yml"

permissions:
  contents: read

jobs:
  deepseek-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout current player
        uses: actions/checkout@v4

      - name: Verify DeepSeek secret
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY is configured."

      - name: Review V10 player with DeepSeek V4-Pro
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          API_URL = "https://api.deepseek.com/chat/completions"
          MODEL = "deepseek-v4-pro"
          FILES = ["index.html", "sw.js", "gallery/index.html", "gallery/sw.js"]

          source_parts = []
          for name in FILES:
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"Required file is missing: {name}")
              text = path.read_text(encoding="utf-8")
              source_parts.append(f"\n\n===== FILE: {name} =====\n{text}")

          system = r'''
          You are a senior Chromium media-pipeline, Service Worker, JavaScript, WebGPU, MSE/MP4, and Google Drive HTTP Range reviewer.

          Review the supplied production source for REAL defects only. Do not rewrite the project for style and do not recommend broad architectural churn unless a concrete defect requires it.

          Product constraints you must preserve:
          - This is a static GitHub Pages Google Drive original-file player/gallery.
          - Media must remain original bytes; no quality-reducing transcoding.
          - Playback uses Google Drive byte-range streaming through a Service Worker.
          - Mobile/tablet smooth native video playback is a priority; WebGPU enhancement must never make mobile playback worse.
          - V10 deliberately uses a two-video hot-standby strategy, decoded-first-frame readiness, same-folder early discovery, a WebGPU visual bridge, and adjacent prefix preloading.
          - Seek Rescue exists for structurally difficult MP4 files; ordinary seek must remain native whenever healthy.
          - Recursive folder scanning must not block current playback.
          - Background image switching and Gallery preloading must yield to active media work.
          - Preserve existing UX and avoid unnecessary dependencies.

          Attack these areas in priority order:
          1. next-video hot switch latency and any false-ready state;
          2. Service Worker Range correctness, cache correctness, auth persistence, abort/race behavior;
          3. seek stalls, especially non-interleaved MP4 and scrub-prime interactions;
          4. duplicate network work or bandwidth contention among current video, hot standby, prefix prime, tree scan, gallery/background;
          5. WebGPU/native-video handoff races, stale-frame exposure, dropped-frame risks;
          6. lifecycle/race bugs when users rapidly switch files, seek, fullscreen, or reopen the page;
          7. memory leaks, detached video/canvas objects, unbounded caches/listeners/timers;
          8. gallery regression risks.

          Be skeptical: if something is merely theoretical, label confidence low. Prefer a small number of high-confidence findings over a long speculative list.

          Return exactly one JSON object with this shape:
          {
            "verdict": "PASS|PASS_WITH_FIXES|NEEDS_FIXES",
            "summary": "short technical summary",
            "findings": [
              {
                "severity": "critical|high|medium|low",
                "confidence": "high|medium|low",
                "file": "exact file path",
                "line_hint": "function/constant/event name or nearby code phrase",
                "title": "concise defect title",
                "evidence": "what the code actually does and why this is a defect",
                "user_impact": "observable consequence",
                "minimal_fix": "smallest safe change",
                "test_plan": "specific reproduction/verification steps"
              }
            ],
            "hot_switch_assessment": "specific assessment",
            "seek_assessment": "specific assessment",
            "service_worker_assessment": "specific assessment",
            "do_not_change": ["things that are already correct and should be preserved"]
          }
          Do not include markdown fences or commentary outside the JSON object.
          '''.strip()

          user = "Review the current V10 source below. Base every finding on the supplied code.\n" + "".join(source_parts)

          body = {
              "model": MODEL,
              "messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": user},
              ],
              "thinking": {"type": "enabled"},
              "reasoning_effort": "max",
              "response_format": {"type": "json_object"},
              "max_tokens": 20000,
              "stream": False,
          }

          api_key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          req = urllib.request.Request(
              API_URL,
              data=json.dumps(body, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )

          last_error = None
          envelope = None
          for attempt in range(1, 3):
              try:
                  started = time.perf_counter()
                  with urllib.request.urlopen(req, timeout=600) as response:
                      envelope = json.loads(response.read().decode("utf-8"))
                  latency = time.perf_counter() - started
                  print(f"DeepSeek completed in {latency:.1f}s on attempt {attempt}.")
                  break
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  last_error = f"HTTP {exc.code}: {detail[:1200]}"
                  if exc.code not in {429, 500, 502, 503, 504} or attempt == 2:
                      break
                  time.sleep(3)
              except urllib.error.URLError as exc:
                  last_error = f"Connection error: {exc}"
                  if attempt == 2:
                      break
                  time.sleep(3)

          if envelope is None:
              raise SystemExit(f"DeepSeek request failed: {last_error}")

          choices = envelope.get("choices")
          if not isinstance(choices, list) or not choices:
              raise SystemExit("DeepSeek returned no choices")
          message = choices[0].get("message", {})
          content = message.get("content")
          if not isinstance(content, str) or not content.strip():
              raise SystemExit("DeepSeek returned empty final content")

          try:
              report = json.loads(content)
          except json.JSONDecodeError as exc:
              Path("deepseek-review-raw.txt").write_text(content, encoding="utf-8")
              raise SystemExit(f"DeepSeek final content was not valid JSON: {exc}")

          Path("deepseek-review.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          usage = envelope.get("usage", {}) if isinstance(envelope, dict) else {}
          verdict = report.get("verdict", "UNKNOWN")
          summary = report.get("summary", "")
          findings = report.get("findings", []) if isinstance(report.get("findings"), list) else []

          md = [
              "# DeepSeek V4-Pro V10 Code Review",
              "",
              f"**Verdict:** {verdict}",
              "",
              summary,
              "",
              f"**Findings:** {len(findings)}",
              "",
          ]
          for i, item in enumerate(findings, 1):
              if not isinstance(item, dict):
                  continue
              md.extend([
                  f"## {i}. [{item.get('severity','?').upper()}] {item.get('title','Untitled')}",
                  f"- Confidence: {item.get('confidence','?')}",
                  f"- File: `{item.get('file','?')}`",
                  f"- Location: `{item.get('line_hint','?')}`",
                  f"- Evidence: {item.get('evidence','')}",
                  f"- User impact: {item.get('user_impact','')}",
                  f"- Minimal fix: {item.get('minimal_fix','')}",
                  f"- Test: {item.get('test_plan','')}",
                  "",
              ])

          md.extend([
              "## Focus assessments",
              f"- Hot switch: {report.get('hot_switch_assessment','')}",
              f"- Seek: {report.get('seek_assessment','')}",
              f"- Service Worker: {report.get('service_worker_assessment','')}",
              "",
              "## Usage",
              f"- Prompt tokens: {usage.get('prompt_tokens', 'n/a')}",
              f"- Completion tokens: {usage.get('completion_tokens', 'n/a')}",
              f"- Total tokens: {usage.get('total_tokens', 'n/a')}",
              "",
              "> The API key and DeepSeek reasoning_content are intentionally not persisted.",
          ])

          Path("deepseek-review.md").write_text("\n".join(md), encoding="utf-8")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(md))
          PY

      - name: Upload DeepSeek review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-v10-code-review-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            deepseek-review.json
            deepseek-review.md
            deepseek-review-raw.txt
