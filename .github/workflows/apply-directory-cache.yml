name: Verify directory-cache repair candidate
on:
  push:
    branches: ['fix/shared-directory-cache-20260928']
    paths: ['.github/scripts/apply_directory_cache.py', '.github/workflows/apply-directory-cache.yml', 'assets/**', 'tests/**']
permissions:
  contents: write
concurrency:
  group: directory-cache-repair-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/shared-directory-cache-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact hash-checked source edits
        run: python .github/scripts/apply_directory_cache.py
      - name: Verify syntax and run regression tests
        run: |
          set -euo pipefail
          for source in assets/player.js assets/gallery.js assets/media-index.js assets/navigation.js assets/worker-client.js gallery/sw.js; do node --check "$source"; done
          node --test tests/*.test.cjs
          git diff --check
          git diff --stat
      - name: Store verified candidate Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          from pathlib import Path
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def request(path, data=None):
              req = urllib.request.Request(api + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}, data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req, timeout=30) as res: return json.load(res)
          parent = os.environ['GITHUB_SHA']
          tree = request('/git/commits/' + parent)['tree']['sha']
          entries = []
          for name in ['assets/player.js', 'assets/gallery.js', 'index.html', 'gallery/index.html', '.github/workflows/navigation-tests.yml']:
              raw = Path(name).read_bytes()
              sha = request('/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})['sha']
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
              print('VERIFIED_FILE', name, len(raw), sha)
          for name in ['.github/scripts/apply_directory_cache.py', '.github/workflows/apply-directory-cache.yml']:
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
          candidate_tree = request('/git/trees', {'base_tree': tree, 'tree': entries})['sha']
          commit = request('/git/commits', {'message': 'fix: reuse durable directory snapshots across image and video views', 'tree': candidate_tree, 'parents': [parent]})['sha']
          print('VERIFIED_CANDIDATE_COMMIT=' + commit)
          print('No branch was updated; main is unchanged.')
          PY
