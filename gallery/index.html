<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Drive Original Gallery</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b0b0b; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 58px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(21,21,21,.96);
      border-bottom: 1px solid #242424;
      backdrop-filter: blur(10px);
    }

    .brand { font-size: 16px; font-weight: 700; }
    #status { color: #aaa; font-size: 13px; }

    main { padding: 18px; max-width: 1600px; margin: 0 auto; }

    #welcome {
      min-height: calc(100vh - 94px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #bbb;
    }

    #welcome h1 { color: #fff; margin: 0 0 10px; font-size: 26px; }
    #welcome p { line-height: 1.7; margin: 0 0 22px; }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
      background: #fff;
      color: #111;
    }

    #gallery { display: none; }

    .gallery-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 16px;
    }

    .gallery-head h1 { font-size: 20px; margin: 0; }
    #count { color: #999; font-size: 13px; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background: #181818;
      cursor: pointer;
      border: 1px solid #202020;
    }

    .card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .2s ease, opacity .2s ease;
      opacity: 0;
    }

    .card img.loaded { opacity: 1; }
    .card:hover img { transform: scale(1.025); }

    .card .fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      color: #777;
      font-size: 12px;
      word-break: break-all;
    }

    .card .label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 22px 8px 7px;
      background: linear-gradient(transparent, rgba(0,0,0,.78));
      color: #eee;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    #error {
      color: #ff8e8e;
      white-space: pre-wrap;
      line-height: 1.6;
      margin-top: 16px;
      max-width: 760px;
    }

    /* 原图查看器 */
    #viewer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }

    #viewer.open { display: block; }

    .viewer-top {
      position: absolute;
      z-index: 110;
      top: 0;
      left: 0;
      right: 0;
      min-height: 56px;
      padding: env(safe-area-inset-top, 0) 12px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(rgba(0,0,0,.76), transparent);
      pointer-events: none;
    }

    .viewer-top .meta {
      min-width: 0;
      flex: 1;
      text-align: center;
      text-shadow: 0 1px 3px #000;
    }

    #viewerName {
      font-size: 13px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #viewerCounter { margin-top: 3px; color: #aaa; font-size: 12px; }

    .icon-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(30,30,30,.72);
      font-size: 23px;
      line-height: 42px;
      pointer-events: auto;
    }

    #imageStage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #viewerImage {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: center center;
      transition: transform .14s ease;
    }

    #viewerLoading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #aaa;
      font-size: 13px;
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      z-index: 110;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 58px;
      padding: 0;
      border-radius: 10px;
      color: #fff;
      background: rgba(30,30,30,.58);
      font-size: 30px;
    }

    #prevBtn { left: 12px; }
    #nextBtn { right: 12px; }

    @media (max-width: 700px) {
      main { padding: 10px; }
      #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
      .card { border-radius: 5px; }
      .card .label { display: none; }
      .nav-btn { width: 40px; height: 52px; opacity: .72; }
      #prevBtn { left: 6px; }
      #nextBtn { right: 6px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Drive Original Gallery</div>
    <div id="status">准备中</div>
  </header>

  <main>
    <section id="welcome">
      <h1>Drive Original Gallery</h1>
      <p id="welcomeText">正在读取 Google Drive 图片…</p>
      <button id="authBtn" style="display:none" onclick="authorizeDrive()">首次授权 Google Drive</button>
      <div id="error"></div>
    </section>

    <section id="gallery">
      <div class="gallery-head">
        <h1>原图相册</h1>
        <div id="count"></div>
      </div>
      <div id="grid"></div>
    </section>
  </main>

  <div id="viewer" aria-hidden="true">
    <div class="viewer-top">
      <button class="icon-btn" onclick="closeViewer()" aria-label="关闭">×</button>
      <div class="meta">
        <div id="viewerName"></div>
        <div id="viewerCounter"></div>
      </div>
      <button class="icon-btn" onclick="toggleZoom()" aria-label="缩放">＋</button>
    </div>

    <button id="prevBtn" class="nav-btn" onclick="showPrev()" aria-label="上一张">‹</button>
    <button id="nextBtn" class="nav-btn" onclick="showNext()" aria-label="下一张">›</button>

    <div id="imageStage">
      <div id="viewerLoading">正在加载原图…</div>
      <img id="viewerImage" alt="原图" draggable="false" />
    </div>
  </div>

<script>
const OAUTH_BRIDGE =
  "https://drive-oauth-bridge.143322378jb.workers.dev";

const SESSION_KEY =
  "drive_oauth_session";

let serviceWorkerReady = false;
let currentAccessToken = null;
let driveIds = [];
let resourceKeys = {};
let galleryFiles = [];
let currentIndex = 0;
let zoomScale = 1;
let tokenRefreshRunning = false;
let touchStartX = 0;
let touchStartY = 0;
let touchStartDistance = 0;
let pinchStartScale = 1;

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function showError(text) {
  document.getElementById("error").textContent = text || "";
}

function parseDriveState() {
  const params = new URLSearchParams(window.location.search);
  const rawState = params.get("state");

  if (!rawState) return null;

  try {
    const state = JSON.parse(rawState);

    if (
      state.action === "open" &&
      Array.isArray(state.ids) &&
      state.ids.length > 0
    ) {
      return {
        ids: state.ids,
        resourceKeys: state.resourceKeys || {}
      };
    }
  } catch (error) {
    console.error("Drive state 解析失败:", error);
  }

  return null;
}

async function getBridgeAccessToken() {
  const session = localStorage.getItem(SESSION_KEY);
  if (!session) return null;

  try {
    const response = await fetch(
      OAUTH_BRIDGE + "/token",
      {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + session
        },
        cache: "no-store"
      }
    );

    if (!response.ok) {
      if (response.status === 401) {
        localStorage.removeItem(SESSION_KEY);
      }
      return null;
    }

    const data = await response.json();
    return data.access_token || null;
  } catch (error) {
    console.error("获取 Access Token 失败:", error);
    return null;
  }
}

function authorizeDrive() {
  window.location.href = OAUTH_BRIDGE + "/auth";
}

async function initServiceWorker() {
  if (!("serviceWorker" in navigator)) {
    throw new Error("当前浏览器不支持 Service Worker。");
  }

  const registration = await navigator.serviceWorker.register(
    "./sw.js",
    { scope: "./" }
  );

  await navigator.serviceWorker.ready;
  serviceWorkerReady = true;

  // clients.claim() 通常会很快接管当前页，留一点时间。
  await new Promise(resolve => setTimeout(resolve, 150));

  return registration;
}

async function sendTokenToWorker(token) {
  if (!serviceWorkerReady || !token) return;

  const registration = await navigator.serviceWorker.ready;
  const worker =
    navigator.serviceWorker.controller ||
    registration.active ||
    registration.waiting;

  if (!worker) return;

  worker.postMessage({
    type: "SET_TOKEN",
    token: token
  });
}

async function refreshWorkerAccessToken() {
  if (tokenRefreshRunning || !serviceWorkerReady) return;

  tokenRefreshRunning = true;

  try {
    const token = await getBridgeAccessToken();
    if (!token) return;

    currentAccessToken = token;
    await sendTokenToWorker(token);
    console.log("Gallery Access Token 已自动刷新");
  } catch (error) {
    console.error("Gallery Token 自动刷新失败:", error);
  } finally {
    tokenRefreshRunning = false;
  }
}

function fileResourceKey(fileId) {
  return resourceKeys && resourceKeys[fileId]
    ? resourceKeys[fileId]
    : null;
}

async function fetchFileMetadata(fileId) {
  const fields = [
    "id",
    "name",
    "mimeType",
    "size",
    "thumbnailLink",
    "capabilities",
    "imageMediaMetadata"
  ].join(",");

  const url =
    "https://www.googleapis.com/drive/v3/files/" +
    encodeURIComponent(fileId) +
    "?supportsAllDrives=true&fields=" +
    encodeURIComponent(fields);

  const headers = {
    "Authorization": "Bearer " + currentAccessToken
  };

  const key = fileResourceKey(fileId);
  if (key) {
    headers["X-Goog-Drive-Resource-Keys"] =
      fileId + "/" + key;
  }

  const response = await fetch(url, { headers });

  if (!response.ok) {
    throw new Error(
      "读取图片信息失败：" +
      fileId +
      " (HTTP " +
      response.status +
      ")"
    );
  }

  const file = await response.json();
  file.resourceKey = key;
  return file;
}

async function loadMetadataWithConcurrency(ids, limit = 6) {
  const results = new Array(ids.length);
  let cursor = 0;

  async function worker() {
    while (true) {
      const index = cursor++;
      if (index >= ids.length) return;

      try {
        results[index] = await fetchFileMetadata(ids[index]);
      } catch (error) {
        console.error(error);
        results[index] = null;
      }
    }
  }

  const workers = [];
  for (let i = 0; i < Math.min(limit, ids.length); i++) {
    workers.push(worker());
  }

  await Promise.all(workers);
  return results.filter(Boolean);
}

function originalUrl(file, retryValue = null) {
  const params = new URLSearchParams();

  if (file.resourceKey) {
    params.set("resourceKey", file.resourceKey);
  }

  if (retryValue !== null) {
    params.set("retry", String(retryValue));
  }

  const query = params.toString();

  return (
    "./media/" +
    encodeURIComponent(file.id) +
    (query ? "?" + query : "")
  );
}

function renderGallery() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  galleryFiles.forEach((file, index) => {
    const card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", "打开 " + file.name);

    const fallback = document.createElement("div");
    fallback.className = "fallback";
    fallback.textContent = file.name || "Image";

    const img = document.createElement("img");
    img.alt = file.name || "Google Drive image";
    img.loading = "lazy";
    img.decoding = "async";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = file.name || "Image";

    let triedOriginalFallback = false;

    img.onload = () => img.classList.add("loaded");
    img.onerror = () => {
      if (!triedOriginalFallback) {
        triedOriginalFallback = true;
        img.src = originalUrl(file);
      }
    };

    if (file.thumbnailLink) {
      img.src = file.thumbnailLink;
    } else {
      triedOriginalFallback = true;
      img.src = originalUrl(file);
    }

    card.appendChild(fallback);
    card.appendChild(img);
    card.appendChild(label);

    card.addEventListener("click", () => openViewer(index));
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openViewer(index);
      }
    });

    grid.appendChild(card);
  });

  document.getElementById("count").textContent =
    galleryFiles.length + " 张图片";

  document.getElementById("welcome").style.display = "none";
  document.getElementById("gallery").style.display = "block";
}

function resetZoom() {
  zoomScale = 1;
  const img = document.getElementById("viewerImage");
  img.style.transform = "scale(1)";
}

function applyZoom() {
  const img = document.getElementById("viewerImage");
  img.style.transform = `scale(${zoomScale})`;
}

function toggleZoom() {
  zoomScale = zoomScale > 1 ? 1 : 2.5;
  applyZoom();
}

async function showViewerImage(index) {
  if (!galleryFiles.length) return;

  currentIndex =
    (index + galleryFiles.length) % galleryFiles.length;

  const file = galleryFiles[currentIndex];
  const img = document.getElementById("viewerImage");
  const loading = document.getElementById("viewerLoading");

  resetZoom();
  loading.style.display = "block";
  img.style.visibility = "hidden";
  img.dataset.retry = "0";

  document.getElementById("viewerName").textContent =
    file.name || "Google Drive Image";

  document.getElementById("viewerCounter").textContent =
    (currentIndex + 1) + " / " + galleryFiles.length;

  img.onload = () => {
    loading.style.display = "none";
    img.style.visibility = "visible";
  };

  img.onerror = async () => {
    const retry = Number(img.dataset.retry || "0");

    if (retry < 1) {
      img.dataset.retry = "1";
      await refreshWorkerAccessToken();
      img.src = originalUrl(file, Date.now());
      return;
    }

    loading.textContent = "原图加载失败，请重新打开相册后再试。";
  };

  img.src = originalUrl(file);

  // 预加载相邻两张原图，让左右切换更顺畅。
  if (galleryFiles.length > 1) {
    const prev = galleryFiles[(currentIndex - 1 + galleryFiles.length) % galleryFiles.length];
    const next = galleryFiles[(currentIndex + 1) % galleryFiles.length];
    const p1 = new Image();
    const p2 = new Image();
    p1.src = originalUrl(prev);
    p2.src = originalUrl(next);
  }
}

function openViewer(index) {
  const viewer = document.getElementById("viewer");
  viewer.classList.add("open");
  viewer.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  showViewerImage(index);
}

function closeViewer() {
  const viewer = document.getElementById("viewer");
  viewer.classList.remove("open");
  viewer.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";

  const img = document.getElementById("viewerImage");
  img.removeAttribute("src");
  resetZoom();
}

function showPrev() {
  showViewerImage(currentIndex - 1);
}

function showNext() {
  showViewerImage(currentIndex + 1);
}

function touchDistance(touches) {
  if (touches.length < 2) return 0;
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

const viewer = document.getElementById("viewer");

viewer.addEventListener("touchstart", event => {
  if (event.touches.length === 1) {
    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;
  } else if (event.touches.length === 2) {
    touchStartDistance = touchDistance(event.touches);
    pinchStartScale = zoomScale;
  }
}, { passive: true });

viewer.addEventListener("touchmove", event => {
  if (event.touches.length === 2 && touchStartDistance > 0) {
    event.preventDefault();
    const distance = touchDistance(event.touches);
    const factor = distance / touchStartDistance;
    zoomScale = Math.min(5, Math.max(1, pinchStartScale * factor));
    applyZoom();
  }
}, { passive: false });

viewer.addEventListener("touchend", event => {
  if (event.changedTouches.length !== 1 || zoomScale > 1.05) return;

  const endX = event.changedTouches[0].clientX;
  const endY = event.changedTouches[0].clientY;
  const dx = endX - touchStartX;
  const dy = endY - touchStartY;

  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.2) {
    if (dx < 0) showNext();
    else showPrev();
  }
}, { passive: true });

let lastTap = 0;
viewer.addEventListener("click", event => {
  if (event.target !== document.getElementById("viewerImage")) return;
  const now = Date.now();
  if (now - lastTap < 320) toggleZoom();
  lastTap = now;
});

document.addEventListener("keydown", event => {
  if (!document.getElementById("viewer").classList.contains("open")) return;

  if (event.key === "ArrowLeft") showPrev();
  else if (event.key === "ArrowRight") showNext();
  else if (event.key === "Escape") closeViewer();
  else if (event.key === "+" || event.key === "=") toggleZoom();
});

window.addEventListener("load", async () => {
  try {
    await initServiceWorker();

    const state = parseDriveState();

    if (!state) {
      setStatus("等待 Google Drive");
      document.getElementById("welcomeText").innerHTML =
        "请回到 Google Drive，多选图片后使用<br>打开方式 → Drive Original Player。";
      return;
    }

    driveIds = state.ids;
    resourceKeys = state.resourceKeys || {};

    setStatus("正在授权");
    currentAccessToken = await getBridgeAccessToken();

    if (!currentAccessToken) {
      setStatus("需要首次授权");
      document.getElementById("welcomeText").textContent =
        "当前浏览器还没有长期授权。";
      document.getElementById("authBtn").style.display = "inline-block";
      return;
    }

    await sendTokenToWorker(currentAccessToken);

    setStatus("正在读取图片");
    const metadata = await loadMetadataWithConcurrency(driveIds, 6);

    galleryFiles = metadata.filter(file =>
      file.mimeType && file.mimeType.startsWith("image/")
    );

    if (!galleryFiles.length) {
      throw new Error("本次从 Google Drive 打开的文件中没有可显示的图片。");
    }

    renderGallery();
    setStatus("Original · " + galleryFiles.length);
  } catch (error) {
    console.error(error);
    setStatus("读取失败");
    showError(error.message || String(error));
  }
});

// 与视频播放器一样：定期刷新短期 Access Token。
setInterval(
  refreshWorkerAccessToken,
  30 * 60 * 1000
);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    refreshWorkerAccessToken();
  }
});

window.addEventListener("focus", refreshWorkerAccessToken);
</script>
</body>
</html>
