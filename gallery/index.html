<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Drive Original Gallery</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b0b0b; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 20;
      height: 58px; padding: 0 18px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(21,21,21,.96); border-bottom: 1px solid #242424;
      backdrop-filter: blur(10px);
    }
    .brand { font-size: 16px; font-weight: 700; }
    #status { color: #aaa; font-size: 13px; }
    main { padding: 18px; max-width: 1600px; margin: 0 auto; }

    #welcome {
      min-height: calc(100vh - 94px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; color: #bbb;
    }
    #welcome h1 { color: #fff; margin: 0 0 10px; font-size: 26px; }
    #welcome p { line-height: 1.7; margin: 0 0 22px; }
    button { border: 0; border-radius: 9px; padding: 11px 18px; cursor: pointer; font-size: 14px; background: #fff; color: #111; }
    #error { color: #ff8e8e; white-space: pre-wrap; line-height: 1.6; margin-top: 16px; max-width: 760px; }

    #gallery { display: none; }
    .gallery-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
    .gallery-head h1 { font-size: 20px; margin: 0; }
    #count { color: #999; font-size: 13px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

    .card {
      position: relative; overflow: hidden; aspect-ratio: 1 / 1; border-radius: 10px;
      background: #181818; cursor: pointer; border: 1px solid #202020;
    }
    .card img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .2s ease, opacity .2s ease; opacity: 0; }
    .card img.loaded { opacity: 1; }
    .card:hover img { transform: scale(1.025); }
    .card .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; color: #777; font-size: 12px; word-break: break-all; }
    .card .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 7px; background: linear-gradient(transparent, rgba(0,0,0,.78)); color: #eee; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

    #viewer { position: fixed; inset: 0; z-index: 100; display: none; background: #000; overflow: hidden; touch-action: none; }
    #viewer.open { display: block; }
    .viewer-top {
      position: absolute; z-index: 110; top: 0; left: 0; right: 0; min-height: 56px;
      padding: env(safe-area-inset-top, 0) 12px 0; display: flex; align-items: center; gap: 12px;
      background: linear-gradient(rgba(0,0,0,.76), transparent); pointer-events: none;
    }
    .viewer-top .meta { min-width: 0; flex: 1; text-align: center; text-shadow: 0 1px 3px #000; }
    #viewerName { font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #viewerCounter { margin-top: 3px; color: #aaa; font-size: 12px; }
    .icon-btn { width: 42px; height: 42px; padding: 0; border-radius: 50%; color: #fff; background: rgba(30,30,30,.72); font-size: 23px; line-height: 42px; pointer-events: auto; }

    #imageStage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
    #viewerImage {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: center center;
      transform: translate3d(0, 0, 0) scale(1);
      transition: transform .14s ease-out;
      will-change: transform;
      cursor: zoom-in;
    }
    #viewerImage.zoomed { cursor: grab; }
    #viewerImage.dragging { cursor: grabbing; transition: none; }
    #viewerLoading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #aaa; font-size: 13px; pointer-events: none; }
    .nav-btn { position: absolute; z-index: 110; top: 50%; transform: translateY(-50%); width: 46px; height: 58px; padding: 0; border-radius: 10px; color: #fff; background: rgba(30,30,30,.58); font-size: 30px; }
    #prevBtn { left: 12px; } #nextBtn { right: 12px; }

    @media (max-width: 700px) {
      main { padding: 10px; }
      #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
      .card { border-radius: 5px; }
      .card .label { display: none; }
      .nav-btn { width: 40px; height: 52px; opacity: .72; }
      #prevBtn { left: 6px; } #nextBtn { right: 6px; }
    }
  </style>
</head>
<body>
  <header><div class="brand">Drive Original Gallery</div><div id="status">准备中</div></header>
  <main>
    <section id="welcome">
      <h1>Drive Original Gallery</h1>
      <p id="welcomeText">正在读取 Google Drive 图片…</p>
      <button id="authBtn" style="display:none" onclick="authorizeDrive()">首次授权 Google Drive</button>
      <div id="error"></div>
    </section>
    <section id="gallery">
      <div class="gallery-head"><h1>当前文件夹 · 原图相册</h1><div id="count"></div></div>
      <div id="grid"></div>
    </section>
  </main>

  <div id="viewer" aria-hidden="true">
    <div class="viewer-top">
      <button class="icon-btn" onclick="closeViewer()" aria-label="关闭">×</button>
      <div class="meta"><div id="viewerName"></div><div id="viewerCounter"></div></div>
      <button class="icon-btn" onclick="toggleZoom()" aria-label="缩放">＋</button>
    </div>
    <button id="prevBtn" class="nav-btn" onclick="showPrev()" aria-label="上一张">‹</button>
    <button id="nextBtn" class="nav-btn" onclick="showNext()" aria-label="下一张">›</button>
    <div id="imageStage"><div id="viewerLoading">正在加载原图…</div><img id="viewerImage" alt="原图" draggable="false" /></div>
  </div>

<script>
const OAUTH_BRIDGE = "https://drive-oauth-bridge.143322378jb.workers.dev";
const SESSION_KEY = "drive_oauth_session";
let serviceWorkerReady = false;
let currentAccessToken = null;
let driveIds = [];
let resourceKeys = {};
let galleryFiles = [];
let currentIndex = 0;
let zoomScale = 1;
let panX = 0;
let panY = 0;
let tokenRefreshRunning = false;

let touchStartX = 0;
let touchStartY = 0;
let touchStartDistance = 0;
let pinchStartScale = 1;
let pinchStartPanX = 0;
let pinchStartPanY = 0;
let pinchStartCenterX = 0;
let pinchStartCenterY = 0;

let panStartX = 0;
let panStartY = 0;
let panStartOffsetX = 0;
let panStartOffsetY = 0;
let isTouchPanning = false;

let mouseDragging = false;
let mouseStartX = 0;
let mouseStartY = 0;
let mouseStartPanX = 0;
let mouseStartPanY = 0;

let nextOriginalPreloader = null;

function setStatus(text) { document.getElementById("status").textContent = text; }
function showError(text) { document.getElementById("error").textContent = text || ""; }

function parseDriveState() {
  const rawState = new URLSearchParams(window.location.search).get("state");
  if (!rawState) return null;
  try {
    const state = JSON.parse(rawState);
    if (state.action === "open" && Array.isArray(state.ids) && state.ids.length) {
      return { ids: state.ids, resourceKeys: state.resourceKeys || {} };
    }
  } catch (error) { console.error("Drive state 解析失败:", error); }
  return null;
}

async function getBridgeAccessToken() {
  const session = localStorage.getItem(SESSION_KEY);
  if (!session) return null;
  try {
    const response = await fetch(OAUTH_BRIDGE + "/token", {
      method: "GET", headers: { "Authorization": "Bearer " + session }, cache: "no-store"
    });
    if (!response.ok) {
      if (response.status === 401) localStorage.removeItem(SESSION_KEY);
      return null;
    }
    const data = await response.json();
    return data.access_token || null;
  } catch (error) { console.error("获取 Access Token 失败:", error); return null; }
}

function authorizeDrive() { window.location.href = OAUTH_BRIDGE + "/auth"; }

async function initServiceWorker() {
  if (!("serviceWorker" in navigator)) throw new Error("当前浏览器不支持 Service Worker。");
  await navigator.serviceWorker.register("./sw.js", { scope: "./" });
  await navigator.serviceWorker.ready;
  serviceWorkerReady = true;
  await new Promise(resolve => setTimeout(resolve, 120));
}

async function sendTokenToWorker(token) {
  if (!serviceWorkerReady || !token) return;
  const registration = await navigator.serviceWorker.ready;
  const worker = navigator.serviceWorker.controller || registration.active || registration.waiting;
  if (worker) worker.postMessage({ type: "SET_TOKEN", token });
}

async function refreshWorkerAccessToken() {
  if (tokenRefreshRunning || !serviceWorkerReady) return;
  tokenRefreshRunning = true;
  try {
    const token = await getBridgeAccessToken();
    if (!token) return;
    currentAccessToken = token;
    await sendTokenToWorker(token);
  } finally { tokenRefreshRunning = false; }
}

function fileResourceKey(fileId) { return resourceKeys && resourceKeys[fileId] ? resourceKeys[fileId] : null; }

async function fetchFileMetadata(fileId) {
  const fields = ["id","name","mimeType","size","thumbnailLink","capabilities","imageMediaMetadata","parents","driveId","resourceKey"].join(",");
  const url = "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(fileId) + "?supportsAllDrives=true&fields=" + encodeURIComponent(fields);
  const headers = { "Authorization": "Bearer " + currentAccessToken };
  const key = fileResourceKey(fileId);
  if (key) headers["X-Goog-Drive-Resource-Keys"] = fileId + "/" + key;
  const response = await fetch(url, { headers, cache: "no-store" });
  if (!response.ok) throw new Error("读取图片信息失败：HTTP " + response.status);
  const file = await response.json();
  file.resourceKey = file.resourceKey || key || null;
  return file;
}

function escapeDriveQueryValue(value) {
  return String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function isImageFile(file) {
  if (!file) return false;
  if (file.mimeType && file.mimeType.startsWith("image/")) return true;
  return /\.(jpg|jpeg|png|webp|gif|bmp|avif)$/i.test(file.name || "");
}

async function listImagesInFolder(parentId, driveId = null) {
  const allFiles = [];
  let pageToken = null;
  do {
    const params = new URLSearchParams({
      q: "'" + escapeDriveQueryValue(parentId) + "' in parents and trashed = false",
      spaces: "drive", pageSize: "1000", orderBy: "name", supportsAllDrives: "true", includeItemsFromAllDrives: "true",
      fields: "nextPageToken,files(id,name,mimeType,size,thumbnailLink,capabilities,imageMediaMetadata,resourceKey,parents,driveId)"
    });
    if (driveId) { params.set("corpora", "drive"); params.set("driveId", driveId); }
    else params.set("corpora", "user");
    if (pageToken) params.set("pageToken", pageToken);

    const response = await fetch("https://www.googleapis.com/drive/v3/files?" + params.toString(), {
      headers: { "Authorization": "Bearer " + currentAccessToken }, cache: "no-store"
    });
    if (!response.ok) throw new Error("读取当前文件夹图片失败：HTTP " + response.status);
    const data = await response.json();
    for (const file of (data.files || []).filter(isImageFile)) {
      file.resourceKey = file.resourceKey || fileResourceKey(file.id) || null;
      allFiles.push(file);
    }
    pageToken = data.nextPageToken || null;
  } while (pageToken);

  const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
  allFiles.sort((a,b) => collator.compare(a.name || "", b.name || ""));
  return allFiles;
}

function originalUrl(file, retryValue = null) {
  const params = new URLSearchParams();
  if (file.resourceKey) params.set("resourceKey", file.resourceKey);
  if (retryValue !== null) params.set("retry", String(retryValue));
  const query = params.toString();
  return "./media/" + encodeURIComponent(file.id) + (query ? "?" + query : "");
}

function renderGallery() {
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  galleryFiles.forEach((file, index) => {
    const card = document.createElement("div"); card.className = "card"; card.tabIndex = 0;
    const fallback = document.createElement("div"); fallback.className = "fallback"; fallback.textContent = file.name || "Image";
    const img = document.createElement("img"); img.alt = file.name || "Google Drive image"; img.loading = "lazy"; img.decoding = "async";
    const label = document.createElement("div"); label.className = "label"; label.textContent = file.name || "Image";
    let triedOriginal = false;
    img.onload = () => img.classList.add("loaded");
    img.onerror = () => { if (!triedOriginal) { triedOriginal = true; img.src = originalUrl(file); } };
    if (file.thumbnailLink) img.src = file.thumbnailLink; else { triedOriginal = true; img.src = originalUrl(file); }
    card.append(fallback, img, label);
    card.addEventListener("click", () => openViewer(index));
    card.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openViewer(index); } });
    grid.appendChild(card);
  });
  document.getElementById("count").textContent = galleryFiles.length + " 张图片";
  document.getElementById("welcome").style.display = "none";
  document.getElementById("gallery").style.display = "block";
}

function getImageStageCenter() {
  const rect = document.getElementById("imageStage").getBoundingClientRect();
  return {
    x: rect.left + rect.width / 2,
    y: rect.top + rect.height / 2,
    width: rect.width,
    height: rect.height
  };
}

function clampPan() {
  const img = document.getElementById("viewerImage");
  const stage = document.getElementById("imageStage");
  if (!img || !stage) return;

  const stageRect = stage.getBoundingClientRect();

  // offsetWidth/offsetHeight 是未经过 transform 的布局尺寸。
  const scaledWidth = img.offsetWidth * zoomScale;
  const scaledHeight = img.offsetHeight * zoomScale;

  const maxX = Math.max(0, (scaledWidth - stageRect.width) / 2);
  const maxY = Math.max(0, (scaledHeight - stageRect.height) / 2);

  panX = Math.max(-maxX, Math.min(maxX, panX));
  panY = Math.max(-maxY, Math.min(maxY, panY));
}

function applyZoom({ animate = false } = {}) {
  const img = document.getElementById("viewerImage");
  if (!img) return;

  clampPan();

  img.style.transition = animate
    ? "transform .14s ease-out"
    : "none";

  img.style.transform =
    `translate3d(${panX}px, ${panY}px, 0) scale(${zoomScale})`;

  img.classList.toggle("zoomed", zoomScale > 1.001);
}

function resetZoom({ animate = false } = {}) {
  zoomScale = 1;
  panX = 0;
  panY = 0;
  applyZoom({ animate });
}

/*
 * 围绕指定屏幕坐标缩放。
 * 这样双击/双指缩放时，被手指指着的内容会尽量留在原位置，
 * 而不是永远从图片中心放大。
 */
function zoomAt(clientX, clientY, targetScale, { animate = false } = {}) {
  const oldScale = zoomScale;
  const newScale = Math.max(1, Math.min(6, targetScale));
  const center = getImageStageCenter();

  if (Math.abs(newScale - oldScale) < 0.0001) return;

  const ratio = newScale / oldScale;

  panX =
    clientX - center.x -
    ratio * (clientX - center.x - panX);

  panY =
    clientY - center.y -
    ratio * (clientY - center.y - panY);

  zoomScale = newScale;

  if (zoomScale <= 1.001) {
    panX = 0;
    panY = 0;
  }

  applyZoom({ animate });
}

function toggleZoomAt(clientX, clientY) {
  if (zoomScale > 1.05) {
    resetZoom({ animate: true });
  } else {
    zoomAt(clientX, clientY, 2.5, { animate: true });
  }
}

function toggleZoom() {
  const center = getImageStageCenter();
  toggleZoomAt(center.x, center.y);
}

/* 只预加载下一张原图，不批量下载整个相册。 */
function preloadNextOriginal(index) {
  if (galleryFiles.length < 2) return;
  const nextIndex = (index + 1) % galleryFiles.length;
  const nextFile = galleryFiles[nextIndex];
  nextOriginalPreloader = new Image();
  nextOriginalPreloader.decoding = "async";
  nextOriginalPreloader.src = originalUrl(nextFile);
}

async function showViewerImage(index) {
  if (!galleryFiles.length) return;
  currentIndex = (index + galleryFiles.length) % galleryFiles.length;
  const file = galleryFiles[currentIndex];
  const img = document.getElementById("viewerImage");
  const loading = document.getElementById("viewerLoading");
  resetZoom(); loading.style.display = "block"; loading.textContent = "正在加载原图…"; img.style.visibility = "hidden"; img.dataset.retry = "0";
  document.getElementById("viewerName").textContent = file.name || "Google Drive Image";
  document.getElementById("viewerCounter").textContent = (currentIndex + 1) + " / " + galleryFiles.length;
  img.onload = () => {
    loading.style.display = "none";
    img.style.visibility = "visible";
    /* 当前原图显示成功后，立刻预加载下一张原图。 */
    preloadNextOriginal(currentIndex);
  };
  img.onerror = async () => {
    const retry = Number(img.dataset.retry || "0");
    if (retry < 1) {
      img.dataset.retry = "1";
      await refreshWorkerAccessToken();
      img.src = originalUrl(file, Date.now());
      return;
    }
    loading.textContent = "原图加载失败，请重新打开相册后再试。";
  };
  img.src = originalUrl(file);
}

function openViewer(index) { const viewer = document.getElementById("viewer"); viewer.classList.add("open"); viewer.setAttribute("aria-hidden","false"); document.body.style.overflow = "hidden"; showViewerImage(index); }
function closeViewer() { const viewer = document.getElementById("viewer"); viewer.classList.remove("open"); viewer.setAttribute("aria-hidden","true"); document.body.style.overflow = ""; document.getElementById("viewerImage").removeAttribute("src"); resetZoom(); }
function showPrev() { showViewerImage(currentIndex - 1); }
function showNext() { showViewerImage(currentIndex + 1); }

function touchDistance(touches) {
  if (touches.length < 2) return 0;
  return Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
}

function touchCenter(touches) {
  return {
    x: (touches[0].clientX + touches[1].clientX) / 2,
    y: (touches[0].clientY + touches[1].clientY) / 2
  };
}

const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");

/*
 * 手机：
 * - 单指，未放大：保留左右滑动切图。
 * - 单指，已放大：拖动查看任意区域。
 * - 双指：围绕两指中心缩放，同时允许两指一起平移。
 */
viewer.addEventListener("touchstart", event => {
  const img = document.getElementById("viewerImage");
  img.style.transition = "none";

  if (event.touches.length === 1) {
    const t = event.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;

    if (zoomScale > 1.001) {
      isTouchPanning = true;
      panStartX = t.clientX;
      panStartY = t.clientY;
      panStartOffsetX = panX;
      panStartOffsetY = panY;
      img.classList.add("dragging");
    }
  } else if (event.touches.length === 2) {
    event.preventDefault();

    isTouchPanning = false;
    touchStartDistance = touchDistance(event.touches);
    pinchStartScale = zoomScale;
    pinchStartPanX = panX;
    pinchStartPanY = panY;

    const c = touchCenter(event.touches);
    pinchStartCenterX = c.x;
    pinchStartCenterY = c.y;

    img.classList.add("dragging");
  }
}, { passive: false });

viewer.addEventListener("touchmove", event => {
  if (event.touches.length === 2 && touchStartDistance > 0) {
    event.preventDefault();

    const distance = touchDistance(event.touches);
    const centerNow = touchCenter(event.touches);
    const centerBase = getImageStageCenter();

    const newScale = Math.max(
      1,
      Math.min(
        6,
        pinchStartScale * (distance / touchStartDistance)
      )
    );

    const ratio = newScale / pinchStartScale;

    /*
     * 初始两指中心对应的图像点，在新的两指中心下保持一致。
     * 因此既能“从手指位置放大”，也能在捏合时同步移动图片。
     */
    panX =
      centerNow.x - centerBase.x -
      ratio * (
        pinchStartCenterX -
        centerBase.x -
        pinchStartPanX
      );

    panY =
      centerNow.y - centerBase.y -
      ratio * (
        pinchStartCenterY -
        centerBase.y -
        pinchStartPanY
      );

    zoomScale = newScale;

    if (zoomScale <= 1.001) {
      zoomScale = 1;
      panX = 0;
      panY = 0;
    }

    applyZoom();
    return;
  }

  if (
    event.touches.length === 1 &&
    isTouchPanning &&
    zoomScale > 1.001
  ) {
    event.preventDefault();

    const t = event.touches[0];

    panX =
      panStartOffsetX +
      (t.clientX - panStartX);

    panY =
      panStartOffsetY +
      (t.clientY - panStartY);

    applyZoom();
  }
}, { passive: false });

viewer.addEventListener("touchend", event => {
  const img = document.getElementById("viewerImage");

  // 如果从双指变成单指，立即把剩下的手指接成拖动。
  if (event.touches.length === 1 && zoomScale > 1.001) {
    const t = event.touches[0];
    isTouchPanning = true;
    panStartX = t.clientX;
    panStartY = t.clientY;
    panStartOffsetX = panX;
    panStartOffsetY = panY;
    touchStartDistance = 0;
    return;
  }

  if (event.touches.length === 0) {
    img.classList.remove("dragging");
    img.style.transition = "transform .14s ease-out";

    const wasPanning = isTouchPanning;
    isTouchPanning = false;
    touchStartDistance = 0;

    if (zoomScale <= 1.001) {
      zoomScale = 1;
      panX = 0;
      panY = 0;
      applyZoom();

      // 只有未放大状态才把单指横滑解释为上一张/下一张。
      if (!wasPanning && event.changedTouches.length === 1) {
        const dx =
          event.changedTouches[0].clientX -
          touchStartX;

        const dy =
          event.changedTouches[0].clientY -
          touchStartY;

        if (
          Math.abs(dx) > 55 &&
          Math.abs(dx) > Math.abs(dy) * 1.2
        ) {
          if (dx < 0) showNext();
          else showPrev();
        }
      }
    } else {
      clampPan();
      applyZoom({ animate: true });
    }
  }
}, { passive: true });

viewer.addEventListener("touchcancel", () => {
  isTouchPanning = false;
  touchStartDistance = 0;
  viewerImage.classList.remove("dragging");
  clampPan();
  applyZoom({ animate: true });
}, { passive: true });

/*
 * 双击/双击触摸：从点击的位置放大，而不是从中心放大。
 */
let lastTap = 0;
let lastTapX = 0;
let lastTapY = 0;

viewer.addEventListener("click", event => {
  if (event.target !== document.getElementById("viewerImage")) return;

  const now = Date.now();

  if (
    now - lastTap < 320 &&
    Math.hypot(
      event.clientX - lastTapX,
      event.clientY - lastTapY
    ) < 60
  ) {
    toggleZoomAt(
      event.clientX,
      event.clientY
    );
    lastTap = 0;
    return;
  }

  lastTap = now;
  lastTapX = event.clientX;
  lastTapY = event.clientY;
});

/*
 * 电脑：滚轮以鼠标位置为中心缩放。
 */
viewer.addEventListener("wheel", event => {
  if (!document.getElementById("viewer").classList.contains("open")) return;

  event.preventDefault();

  const factor =
    Math.exp(-event.deltaY * 0.0015);

  zoomAt(
    event.clientX,
    event.clientY,
    zoomScale * factor
  );
}, { passive: false });

/*
 * 电脑：放大后按住图片任意拖动。
 */
viewerImage.addEventListener("mousedown", event => {
  if (event.button !== 0 || zoomScale <= 1.001) return;

  event.preventDefault();

  mouseDragging = true;
  mouseStartX = event.clientX;
  mouseStartY = event.clientY;
  mouseStartPanX = panX;
  mouseStartPanY = panY;

  viewerImage.classList.add("dragging");
});

window.addEventListener("mousemove", event => {
  if (!mouseDragging) return;

  panX =
    mouseStartPanX +
    (event.clientX - mouseStartX);

  panY =
    mouseStartPanY +
    (event.clientY - mouseStartY);

  applyZoom();
});

window.addEventListener("mouseup", () => {
  if (!mouseDragging) return;

  mouseDragging = false;
  viewerImage.classList.remove("dragging");

  clampPan();
  applyZoom({ animate: true });
});

window.addEventListener("resize", () => {
  if (
    document.getElementById("viewer")
      .classList.contains("open")
  ) {
    clampPan();
    applyZoom();
  }
});

document.addEventListener("keydown", event => {
  if (!document.getElementById("viewer").classList.contains("open")) return;

  const center = getImageStageCenter();

  if (event.key === "Escape") {
    closeViewer();
  } else if (
    event.key === "ArrowLeft" &&
    zoomScale <= 1.001
  ) {
    showPrev();
  } else if (
    event.key === "ArrowRight" &&
    zoomScale <= 1.001
  ) {
    showNext();
  } else if (
    event.key === "+" ||
    event.key === "="
  ) {
    zoomAt(
      center.x,
      center.y,
      zoomScale * 1.35,
      { animate: true }
    );
  } else if (
    event.key === "-" ||
    event.key === "_"
  ) {
    zoomAt(
      center.x,
      center.y,
      zoomScale / 1.35,
      { animate: true }
    );
  } else if (event.key === "0") {
    resetZoom({ animate: true });
  }
});

window.addEventListener("load", async () => {
  try {
    await initServiceWorker();
    const state = parseDriveState();
    if (!state) { setStatus("等待 Google Drive"); document.getElementById("welcomeText").innerHTML = "请回到 Google Drive，单选文件夹内任意一张图片后使用<br>打开方式 → Drive Original Player。"; return; }
    driveIds = state.ids; resourceKeys = state.resourceKeys || {};
    setStatus("正在授权"); currentAccessToken = await getBridgeAccessToken();
    if (!currentAccessToken) { setStatus("需要首次授权"); document.getElementById("welcomeText").textContent = "当前浏览器还没有长期授权。"; document.getElementById("authBtn").style.display = "inline-block"; return; }
    await sendTokenToWorker(currentAccessToken);
    setStatus("正在定位文件夹");
    const openedFile = await fetchFileMetadata(driveIds[0]);
    if (!isImageFile(openedFile)) throw new Error("从 Google Drive 打开的文件不是图片。");
    const parentId = Array.isArray(openedFile.parents) && openedFile.parents.length ? openedFile.parents[0] : null;
    if (!parentId) galleryFiles = [openedFile];
    else { setStatus("正在读取当前文件夹"); galleryFiles = await listImagesInFolder(parentId, openedFile.driveId || null); }
    if (!galleryFiles.some(file => file.id === openedFile.id)) galleryFiles.unshift(openedFile);
    currentIndex = Math.max(0, galleryFiles.findIndex(file => file.id === openedFile.id));
    renderGallery(); setStatus("Original · 文件夹 " + galleryFiles.length);
  } catch (error) { console.error(error); setStatus("读取失败"); showError(error.message || String(error)); }
});

setInterval(refreshWorkerAccessToken, 30 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshWorkerAccessToken(); });
window.addEventListener("focus", refreshWorkerAccessToken);
</script>
