<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星映 · 聚合长廊</title><link rel="stylesheet" href="../assets/sources.css?v=booru-2"><script src="../assets/android-preload.js"></script><script src="../assets/vendor/hls.min.js"></script></head><body>
<header><a href="../index.html" class="brand">✶ 星映</a><span>聚合长廊</span><button id="connect">连接 Drive</button></header>
<main><nav id="sites" aria-label="选择来源"><button data-site="all">全部</button><button data-site="x">X</button><button data-site="pornhub">Pornhub</button><button data-site="missav">MissAV</button><button data-site="hanime">Hanime1</button><button data-site="r34">3D</button><button data-site="danbooru">Danbooru</button><button data-site="gelbooru">Gelbooru</button><button data-site="e621">e621</button></nav>
<section class="intro"><h1 id="heading">聚合长廊</h1><p>星映统一界面 · 后台采集 · 原文件保存</p></section>
<form id="filters"><label class="wide">搜索关键词<input id="search" placeholder="标题、作者、标签"></label><label>排序<select id="sort"><option value="likes">点赞优先</option><option value="views">播放量优先</option><option value="percent">好评率优先</option><option value="date">最新</option></select></label><label>最低点赞<input id="likes" type="number" min="0" value="1000"></label><label>最低播放<input id="views" type="number" min="0" value="0"></label><label>最低好评 %<input id="percent" type="number" min="0" max="100" value="0"></label><label>日期范围<select id="period"><option value="all">全部时间</option><option value="week">近 7 天</option><option value="month">近 30 天</option><option value="custom">自定义日期</option></select></label><label>起始日期<input id="from" type="date"></label><label>结束日期<input id="to" type="date"></label><label class="check"><input id="unknown" type="checkbox">显示指标缺失项</label><label class="check"><input id="unknownDate" type="checkbox">日期筛选时包含未知日期</label><label>收藏<select id="favorite"><option value="">全部</option><option value="author">已收藏作者</option><option value="tag">已收藏标签</option></select></label><button type="submit">应用筛选</button></form>
<form id="booruAuth" hidden><label class="wide">Gelbooru API Key<input id="gelbooruKey" autocomplete="off" spellcheck="false" placeholder="gelbooru.com 账号设置里的 api_key"></label><label>Gelbooru User ID<input id="gelbooruUser" inputmode="numeric" autocomplete="off" placeholder="数字 user_id"></label><button type="submit">保存凭据</button><span id="booruAuthState" role="status"></span></form>
<div class="toolbar"><button id="refresh">重新采集</button><button id="next">下一页</button><button id="login">来源登录 / 验证</button><button id="cookies" hidden>导入 X 登录</button><span id="stats"></span></div>
<p id="status" role="status">准备采集…</p><div id="grid"></div><div id="empty" hidden>没有符合筛选的数据。可调整阈值；来源缺失的指标不会当作已达标。</div>
<section class="tasks"><h2>保存任务</h2><div id="tasks">暂无任务</div><p>仅保存实际解析出的最高可用清晰度。HLS 会下载完整播放列表与分片，打包为 ZIP；不会把播放列表改名冒充 MP4。</p></section>
</main><dialog id="viewer"><button id="close">关闭</button><h2 id="detailTitle"></h2><div id="media"></div><p id="detailStats"></p><div id="choices"></div><div class="toolbar"><button id="download">下载原文件</button><button id="drive">保存到 Drive</button></div><p id="detailStatus" role="status"></p></dialog>
<script src="../assets/sources.js?v=booru-2"></script></body></html>
