<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>星映 · 全部文件</title>
  <script src="../assets/android-preload.js"></script>
  <link rel="stylesheet" href="../assets/theme.css?v=starlight-5" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0f1d; color: #e8ecf7; font: 15px/1.5 system-ui, "Noto Sans SC", sans-serif; }
    header { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 13px 16px; background: #0b0f1de8; backdrop-filter: blur(10px); border-bottom: 1px solid #1e2740; }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    h1 small { display: block; font-size: 11px; color: #7d8aa8; font-weight: 400; letter-spacing: .16em; }
    .grow { flex: 1 1 200px; }
    input[type="search"] { width: 100%; padding: 10px 13px; border-radius: 11px; border: 1px solid #253055;
      background: #131a2c; color: inherit; font-size: 14px; outline: none; }
    button { padding: 9px 13px; border-radius: 11px; border: 1px solid #2b3757; background: #172038; color: inherit;
      font-size: 14px; cursor: pointer; }
    button.primary { background: #2f4bff; border-color: #2f4bff; }
    main { padding: 14px 16px 90px; }
    #status { color: #93a0bd; font-size: 13px; margin: 0 0 10px; white-space: pre-wrap; }
    #error { color: #ff9aa8; font-size: 13px; margin: 0 0 10px; white-space: pre-wrap; }
    #list { display: grid; gap: 8px; }
    .row { display: flex; gap: 11px; align-items: center; padding: 11px 13px; border-radius: 12px;
      background: #121a2c; border: 1px solid #1d2740; cursor: pointer; }
    .row:active { background: #18223a; }
    .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: #1b2440; color: #8fa6ff; font-size: 13px; }
    .meta { flex: 1; min-width: 0; }
    .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .path { font-size: 12px; color: #77839f; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .right { flex: 0 0 auto; text-align: right; font-size: 12px; color: #77839f; }
    #empty { color: #77839f; padding: 26px 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<header>
  <h1>全部文件<small id="rootLabel"></small></h1>
  <button id="back" type="button">返回</button>
  <div class="grow"><input id="search" type="search" placeholder="搜索文件名或目录…" autocomplete="off" /></div>
  <button id="refresh" type="button">刷新</button>
</header>
<main>
  <p id="status">准备中</p>
  <p id="error" hidden></p>
  <div id="list"></div>
  <div id="empty" hidden>没有匹配的文件。</div>
</main>
<script src="../assets/root-pref.js?v=2"></script>
<script src="files.js?v=1"></script>
</body>
</html>
