  function showError(text) {
    document.getElementById("error").textContent = text;
  }


  /*
   * 读取 Google Drive Open With 传来的 state
   *
   * 形式类似：
   *
   * {
   *   "ids": ["FILE_ID"],
   *   "resourceKeys": {...},
   *   "action": "open",
   *   "userId": "..."
   * }
   */


  function escapeDriveQueryValue(value) {
    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }

  function isDriveFolder(file) {
    return !!(
      file &&
      file.mimeType === "application/vnd.google-apps.folder"
    );
  }

  function isVideoFile(file) {
    if (!file) return false;
    if (file.mimeType && file.mimeType.startsWith("video/")) return true;
    return /\.(mp4|m4v|mov|webm|mkv)$/i.test(file.name || "");
  }

  function isImageFile(file) {
    if (!file) return false;
    if (file.mimeType && file.mimeType.startsWith("image/")) return true;
    return /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(file.name || "");
  }

  function driveListFields(mediaMetadataField) {
    return [
      "id",
      "name",
      "mimeType",
      "size",
      "thumbnailLink",
      "resourceKey",
      "parents",
      "driveId",
      "capabilities",
      mediaMetadataField
    ].join(",");
  }

  async function fetchDriveMetadata(fileId, accessToken, resourceKey = null) {
    const fields =
      "id,name,mimeType,size,thumbnailLink,resourceKey,parents,driveId,capabilities,videoMediaMetadata";

    const url =
      "https://www.googleapis.com/drive/v3/files/" +
      encodeURIComponent(fileId) +
      "?supportsAllDrives=true&fields=" +
      encodeURIComponent(fields);

    const headers = {
      "Authorization": "Bearer " + accessToken
    };

    if (resourceKey) {
      headers["X-Goog-Drive-Resource-Keys"] =
        fileId + "/" + resourceKey;
    }

    const response = await fetch(url, {
      headers,
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "读取 Google Drive 文件夹信息失败：HTTP " +
        response.status
      );
    }

    return response.json();
  }

  /*
   * 从当前视频向上寻找名为 1433223 的祖先文件夹。
   * 如果路径中没有这个名字，则退回当前视频的直接父文件夹，
   * 避免因为目录改名导致播放器完全不可用。
   */
  async function findVideoRootFolder(openedFile, accessToken) {
    const parents =
      Array.isArray(openedFile.parents)
        ? openedFile.parents
        : [];

    if (!parents.length) return null;

    let parentId = parents[0];
    let firstParent = null;
    let matched = null;
    let guard = 0;

    while (parentId && guard < 80) {
      const folder =
        await fetchDriveMetadata(
          parentId,
          accessToken
        );

      if (!firstParent) firstParent = folder;

      if (
        isDriveFolder(folder) &&
        folder.name === VIDEO_ROOT_FOLDER_NAME
      ) {
        // 如果路径中出现多个同名目录，继续向上，
        // 最终使用最上层的 1433223。
        matched = folder;
      }

      const folderParents =
        Array.isArray(folder.parents)
          ? folder.parents
          : [];

      parentId =
        folderParents.length
          ? folderParents[0]
          : null;

      guard += 1;
    }

    return matched || firstParent;
  }

  async function listVideoTreeChildren(folderFile, accessToken) {
    const allItems = [];
    let pageToken = null;

    do {
      const params = new URLSearchParams({
        q:
          "'" +
          escapeDriveQueryValue(folderFile.id) +
          "' in parents and trashed = false",
        spaces: "drive",
        pageSize: "1000",
        supportsAllDrives: "true",
        includeItemsFromAllDrives: "true",
        fields:
          "nextPageToken,files(" +
          driveListFields("videoMediaMetadata") +
          ")"
      });

      if (folderFile.driveId) {
        params.set("corpora", "drive");
        params.set("driveId", folderFile.driveId);
      } else {
        params.set("corpora", "user");
      }

      if (pageToken) {
        params.set("pageToken", pageToken);
      }

      const response = await fetch(
        "https://www.googleapis.com/drive/v3/files?" +
          params.toString(),
        {
          headers: {
            "Authorization": "Bearer " + accessToken
          },
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          "读取文件夹内容失败：" +
          folderFile.name +
          " · HTTP " +
          response.status
        );
      }

      const data = await response.json();

      for (const file of data.files || []) {
        if (isDriveFolder(file) || isVideoFile(file)) {
          allItems.push(file);
        }
      }

      pageToken = data.nextPageToken || null;
    } while (pageToken);

    const collator =
      new Intl.Collator(
        undefined,
        {
          numeric: true,
          sensitivity: "base"
        }
      );

    allItems.sort((a, b) => {
      const aFolder = isDriveFolder(a) ? 0 : 1;
      const bFolder = isDriveFolder(b) ? 0 : 1;

      if (aFolder !== bFolder) {
        return aFolder - bFolder;
      }

      return collator.compare(
        a.name || "",
        b.name || ""
      );
    });

    return allItems;
  }

  async function discoverCurrentFolderVideosEarly(
    openedFile,
    accessToken
  ) {
    if (
      earlySiblingDiscoveryRunning ||
      !openedFile ||
      !accessToken
    ) {
      return;
    }

    const parentId =
      Array.isArray(
        openedFile.parents
      )
        ? openedFile.parents[0]
        : null;

    if (!parentId) {
      return;
    }

    earlySiblingDiscoveryRunning =
      true;

    try {
      const parent =
        await fetchDriveMetadata(
          parentId,
          accessToken
        );

      if (
        !parent ||
        !isDriveFolder(parent)
      ) {
        return;
      }

      const items =
        await listVideoTreeChildren(
          parent,
          accessToken
        );

      const videos =
        items.filter(
          file =>
            isVideoFile(file)
        );

      const index =
        videos.findIndex(
          file =>
            file.id ===
            openedFile.id
        );

      if (index < 0) {
        return;
      }

      provisionalSiblingVideos =
        videos.slice();

      provisionalSiblingVideos
        .forEach(
          (file, i) => {
            file._playlistIndex =
              i;

            file._folderPath =
              parent.name || "";
          }
        );

      /*
       * 全局树还没找到当前文件时，
       * 先用“当前直接父文件夹”的视频做临时播放列表。
       * 这样下一条同目录视频无需等 104 个文件夹读完。
       */
      const globalHasCurrent =
        videoTreeRoot &&
        flattenVideosFromTree(
          videoTreeRoot
        ).some(
          file =>
            file.id ===
            openedFile.id
        );

      if (!globalHasCurrent) {
        const activeId =
          currentFileId ||
          openedFile.id;

        videoPlaylist =
          provisionalSiblingVideos
            .slice();

        currentVideoIndex =
          videoPlaylist.findIndex(
            file =>
              file.id ===
              activeId
          );

        if (currentVideoIndex < 0) {
          currentVideoIndex =
            index;
        }

        videoPlaylistDomReady =
          false;

        const listBtn =
          document.getElementById(
            "videoListBtn"
          );

        if (
          listBtn &&
          videoPlaylist.length > 1
        ) {
          listBtn.style.display =
            "inline-block";
        }
      }

    } catch (error) {
      console.debug(
        "提前读取当前文件夹视频失败：",
        error
      );
    } finally {
      earlySiblingDiscoveryRunning =
        false;
    }
  }

  /*
   * V7：递归建立 1433223 文件树，但不再阻塞当前视频首帧。
   *
   * 当前视频播放后，这个扫描器在后台运行。
   * 视频正常播放时最多同时读取 2 个文件夹；
   * 视频暂停时可提升到 4 个，以更快完成目录索引。
   *
   * 如果视频正在 seek / buffering / Seek Rescue，
   * 主动让出时间片，避免目录元数据请求影响媒体播放。
   */
  async function buildVideoFolderTreeStreaming(
    rootFolder,
    accessToken,
    onProgress
  ) {
    const rootNode = {
      file: rootFolder,
      children: []
    };

    const queue = [rootNode];
    let scannedFolders = 0;
    const MAX_FOLDERS = 5000;

    const isMediaSensitiveForTreeScan =
      player =>
        !!(
          player &&
          (
            player.seeking ||
            seekRescueActivation ||
            seekRescueSession ||
            (
              player.currentSrc &&
              player.readyState < 3
            ) ||
            (
              !player.paused &&
              getBufferedAhead(player) < 4
            )
          )
        );

    while (queue.length) {
      const player =
        document.getElementById(
          "player"
        );

      const playing =
        !!(
          player &&
          !player.paused &&
          !player.ended
        );

      const mediaSensitive =
        isMediaSensitiveForTreeScan(
          player
        );

      const concurrency =
        (
          playing ||
          mediaSensitive
        )
          ? 2
          : 4;

      const batch =
        queue.splice(
          0,
          concurrency
        );

      await Promise.all(
        batch.map(async node => {
          const items =
            await listVideoTreeChildren(
              node.file,
              accessToken
            );

          node.children =
            items.map(file => ({
              file,
              children: []
            }));

          for (
            const child
            of node.children
          ) {
            if (
              isDriveFolder(
                child.file
              )
            ) {
              queue.push(child);
            }
          }

          scannedFolders += 1;

          if (
            typeof onProgress ===
            "function"
          ) {
            onProgress({
              rootNode,
              scannedFolders,
              pendingFolders:
                queue.length,
              finished: false
            });
          }
        })
      );

      if (
        scannedFolders +
        queue.length >
        MAX_FOLDERS
      ) {
        throw new Error(
          "文件夹数量超过 " +
          MAX_FOLDERS +
          "，为避免浏览器卡死已停止读取。"
        );
      }

      /*
       * 每个 batch 后显式把主线程还给播放器。
       * 如果当前视频处于敏感状态，则多等一会儿。
       */
      const activePlayer =
        document.getElementById(
          "player"
        );

      const mediaBusy =
        isMediaSensitiveForTreeScan(
          activePlayer
        );

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            mediaBusy
              ? 650
              : 20
          )
      );
    }

    if (
      typeof onProgress ===
      "function"
    ) {
      onProgress({
        rootNode,
        scannedFolders,
        pendingFolders: 0,
        finished: true
      });
    }

    return rootNode;
  }

  function ensureOpenedVideoInPlaylist(
    openedFile,
    scannedVideos
  ) {
    const result =
      scannedVideos.filter(
        file =>
          file &&
          file.id !==
            openedFile.id
      );

    const discovered =
      scannedVideos.find(
        file =>
          file &&
          file.id ===
            openedFile.id
      );

    if (discovered) {
      return scannedVideos;
    }

    openedFile._folderPath =
      videoRootFolder
        ? videoRootFolder.name
        : "";

    return [
      openedFile,
      ...result
    ];
  }

  function scheduleVideoTreeUiRefresh() {
    if (
      videoTreeScanRefreshTimer
    ) {
      return;
    }

    videoTreeScanRefreshTimer =
      setTimeout(
        () => {
          videoTreeScanRefreshTimer =
            null;

          const wrap =
            document.getElementById(
              "playerWrap"
            );

          /*
           * 列表关闭时完全不重建 DOM。
           * 只把 DOM 标记成过期；
           * 用户真正打开列表时再一次性渲染最新树。
           */
          if (
            wrap &&
            wrap.classList.contains(
              "playlist-open"
            )
          ) {
            renderVideoPlaylist();
          }
        },
        650
      );
  }

  function applyVideoTreeScanSnapshot(
    openedFile,
    rootNode,
    scannedFolders,
    finished = false
  ) {
    if (!rootNode) {
      return;
    }

    videoTreeRoot =
      rootNode;

    const activeId =
      currentFileId ||
      openedFile.id;

    let nextPlaylist =
      flattenVideosFromTree(
        videoTreeRoot
      );

    const globalHasActive =
      nextPlaylist.some(
        file =>
          file &&
          file.id === activeId
      );

    if (
      !globalHasActive &&
      provisionalSiblingVideos.length &&
      provisionalSiblingVideos.some(
        file =>
          file.id === activeId
      )
    ) {
      /*
       * 全局扫描还没到当前分支：
       * 保留已经提前拿到的同目录列表，
       * 不让当前同目录列表被不完整的全局快照冲掉。
       */
      nextPlaylist =
        provisionalSiblingVideos
          .slice();
    } else {
      nextPlaylist =
        ensureOpenedVideoInPlaylist(
          openedFile,
          nextPlaylist
        );

      if (globalHasActive) {
        provisionalSiblingVideos =
          [];
      }
    }

    nextPlaylist.forEach(
      (file, index) => {
        file._playlistIndex =
          index;
      }
    );

    videoPlaylist =
      nextPlaylist;

    currentVideoIndex =
      videoPlaylist.findIndex(
        file =>
          file.id === activeId
      );

    if (currentVideoIndex < 0) {
      currentVideoIndex = 0;
    }

    /*
     * 只“补充展开”当前视频路径，
     * 不清除用户自己已经展开的目录。
     */
    ensureVideoPathExpanded(
      videoTreeRoot,
      activeId
    );

    videoPlaylistDomReady =
      false;

    const listBtn =
      document.getElementById(
        "videoListBtn"
      );

    if (listBtn) {
      listBtn.style.display =
        (
          videoTreeRoot ||
          videoPlaylist.length > 1
        )
          ? "inline-block"
          : "none";
    }

    if (
      !finished
    ) {
      setStatus(
        "Original · 播放中 · 后台读取 " +
        (
          videoRootFolder
            ? videoRootFolder.name
            : VIDEO_ROOT_FOLDER_NAME
        ) +
        " · " +
        scannedFolders +
        " 个文件夹 · " +
        videoPlaylist.length +
        " 个视频"
      );
    } else {
      setStatus(
        sharpenMode === 0
          ? (
              "Original · 流畅模式（手动） · " +
              scannedFolders +
              " 个文件夹已读取"
            )
          : (
              gpuActive
                ? (
                    "Original · WebGPU 高质量渲染 · " +
                    scannedFolders +
                    " 个文件夹已读取"
                  )
                : (
                    "Original · 平衡模式 · " +
                    scannedFolders +
                    " 个文件夹已读取"
                  )
            )
      );
    }

    scheduleVideoTreeUiRefresh();

  }

  async function startVideoTreeScanInBackground(
    openedFile,
    accessToken
  ) {
    if (
      videoTreeScanInProgress
    ) {
      return;
    }

    videoTreeScanInProgress =
      true;

    videoTreeScannedFolders =
      0;

    videoTreeScanOpenedFile =
      openedFile;

    try {
      /*
       * 这一步也放到播放之后：
       * 先看视频，再沿 parents 向上定位 1433223。
       */
      videoRootFolder =
        await findVideoRootFolder(
          openedFile,
          accessToken
        );

      if (!videoRootFolder) {
        return;
      }

      /*
       * 先立即建立一个空 root，
       * 让“列表”按钮可以出现；
       * children 会随着后台扫描逐步补全。
       */
      videoTreeRoot = {
        file:
          videoRootFolder,
        children: []
      };

      const listBtn =
        document.getElementById(
          "videoListBtn"
        );

      if (listBtn) {
        listBtn.style.display =
          "inline-block";
      }

      videoTreeRoot =
        await buildVideoFolderTreeStreaming(
          videoRootFolder,
          accessToken,
          progress => {
            videoTreeScannedFolders =
              progress.scannedFolders;

            applyVideoTreeScanSnapshot(
              openedFile,
              progress.rootNode,
              progress.scannedFolders,
              progress.finished
            );
          }
        );
    } catch (error) {
      /*
       * 后台目录读取失败绝不能打断已经在播放的视频。
       */
      console.warn(
        "后台读取递归视频文件树失败，继续当前视频：",
        error
      );

      setStatus(
        "Original · 当前视频继续播放 · 后台目录读取失败"
      );
    } finally {
      videoTreeScanInProgress =
        false;

      videoTreeScanOpenedFile =
        null;

      if (
        videoTreeScanRefreshTimer
      ) {
        clearTimeout(
          videoTreeScanRefreshTimer
        );

        videoTreeScanRefreshTimer =
          null;
      }

      if (
        videoPlaylistDomReady === false
      ) {
        const wrap =
          document.getElementById(
            "playerWrap"
          );

        if (
          wrap &&
          wrap.classList.contains(
            "playlist-open"
          )
        ) {
          renderVideoPlaylist();
        }
      }
    }
  }


  function flattenVideosFromTree(rootNode) {
    const result = [];

    function walk(node, pathParts) {
      if (!node || !node.file) return;

      const folderName =
        node.file.name || "Folder";

      const currentPath =
        [...pathParts, folderName];

      for (const child of node.children || []) {
        if (isDriveFolder(child.file)) {
          walk(child, currentPath);
        } else if (isVideoFile(child.file)) {
          child.file._folderPath =
            currentPath.join(" / ");
          result.push(child.file);
        }
      }
    }

    if (rootNode) {
      walk(rootNode, []);
    }

    result.forEach((file, index) => {
      file._playlistIndex = index;
    });

    return result;
  }


  /*
   * 只展开“当前视频所在路径”。
   *
   * 例如：
   * 1433223
   * ├─ A
   * │  └─ A1
   * │     └─ target.mp4
   * ├─ B
   * └─ C
   *
   * 初始只展开：
   * 1433223 → A → A1
   * B / C 保持折叠。
   */
  function expandOnlyPathToVideo(
    rootNode,
    targetVideoId
  ) {
    expandedVideoFolders.clear();

    if (
      !rootNode ||
      !targetVideoId
    ) {
      return false;
    }

    function findTarget(node) {
      if (
        !node ||
        !node.file
      ) {
        return false;
      }

      for (
        const child of
        node.children || []
      ) {
        if (
          isVideoFile(child.file) &&
          child.file.id === targetVideoId
        ) {
          // 当前 node 就是目标视频的直接父文件夹。
          expandedVideoFolders.add(
            node.file.id
          );
          return true;
        }

        if (
          isDriveFolder(child.file) &&
          findTarget(child)
        ) {
          // 目标视频位于这个子文件夹内部，
          // 所以当前祖先文件夹也必须展开。
          expandedVideoFolders.add(
            node.file.id
          );
          return true;
        }
      }

      return false;
    }

    return findTarget(rootNode);
  }

  /*
   * 切换到别的视频后，只“补开”它所在的路径，
   * 不强制关闭用户手动打开的其他文件夹。
   */
  function ensureVideoPathExpanded(
    rootNode,
    targetVideoId
  ) {
    if (
      !rootNode ||
      !targetVideoId
    ) {
      return false;
    }

    function findTarget(node) {
      if (
        !node ||
        !node.file
      ) {
        return false;
      }

      for (
        const child of
        node.children || []
      ) {
        if (
          isVideoFile(child.file) &&
          child.file.id === targetVideoId
        ) {
          expandedVideoFolders.add(
            node.file.id
          );
          return true;
        }

        if (
          isDriveFolder(child.file) &&
          findTarget(child)
        ) {
          expandedVideoFolders.add(
            node.file.id
          );
          return true;
        }
      }

      return false;
    }

    return findTarget(rootNode);
  }

  function countVideoTreeFolders(rootNode) {
    let count = 0;

    function walk(node, includeSelf) {
      if (!node) return;
      if (includeSelf) count += 1;

      for (const child of node.children || []) {
        if (isDriveFolder(child.file)) {
          walk(child, true);
        }
      }
    }

    walk(rootNode, false);
    return count;
  }

  function formatFileSize(size) {
    const value = Number(size);
    if (!Number.isFinite(value) || value <= 0) return "";
    if (value >= 1024 ** 3) return (value / 1024 ** 3).toFixed(1) + " GB";
    if (value >= 1024 ** 2) return (value / 1024 ** 2).toFixed(0) + " MB";
    return (value / 1024).toFixed(0) + " KB";
  }


  function syncVideoPlaylistDomState() {
    const items =
      document.getElementById(
        "videoPlaylistItems"
      );

    if (!items) return;

    const previous =
      items.querySelector(
        ".video-playlist-item.active"
      );

    if (previous) {
      previous.classList.remove(
        "active"
      );

      previous.removeAttribute(
        "aria-current"
      );
    }

    const current =
      items.querySelector(
        `.video-playlist-item[data-index="${currentVideoIndex}"]`
      );

    if (current) {
      current.classList.add(
        "active"
      );

      current.setAttribute(
        "aria-current",
        "true"
      );
    }

    for (
      const folder of
      items.querySelectorAll(
        ".drive-tree-folder[data-folder-id]"
      )
    ) {
      const folderId =
        folder.dataset.folderId;

      folder.classList.toggle(
        "collapsed",
        !expandedVideoFolders.has(
          folderId
        )
      );
    }
  }

  function postWorkerMessage(
    worker,
    data,
    timeout = 260
  ) {
    return new Promise(resolve => {
      if (!worker) {
        resolve(false);
        return;
      }

      const channel =
        new MessageChannel();

      let settled = false;

      const finish =
        value => {
          if (settled) return;
          settled = true;

          clearTimeout(timer);

          try {
            channel.port1.close();
          } catch (_) {}

          resolve(value);
        };

      channel.port1.onmessage =
        event => {
          finish(
            !!event.data?.ok
          );
        };

      const timer =
        setTimeout(
          () => finish(false),
          timeout
        );

      try {
        worker.postMessage(
          data,
          [channel.port2]
        );
      } catch (_) {
        finish(false);
      }
    });
  }


  function getVideoMediaUrl(file) {
    if (!file?.id) {
      return "";
    }

    let url =
      "./media/" +
      encodeURIComponent(
        file.id
      );

    if (file.resourceKey) {
      url +=
        "?resourceKey=" +
        encodeURIComponent(
          file.resourceKey
        );
    }

    return url;
  }

  function renderVideoPlaylist() {
    const items =
      document.getElementById("videoPlaylistItems");

    const title =
      document.getElementById("playlistTitle");

    if (!items) return;

    const folderCount =
      videoTreeRoot
        ? countVideoTreeFolders(videoTreeRoot)
        : 0;

    if (title) {
      title.textContent =
        (videoRootFolder
          ? videoRootFolder.name
          : "视频目录") +
        " · " +
        folderCount +
        " 个子文件夹 · " +
        videoPlaylist.length +
        " 个视频" +
        (
          videoTreeScanInProgress
            ? " · 后台读取中"
            : ""
        );
    }

    items.innerHTML = "";

    if (!videoTreeRoot) {
      videoPlaylist.forEach((file, index) => {
        items.appendChild(
          createVideoTreeMediaItem(file, index)
        );
      });

      videoPlaylistDomReady = true;
      return;
    }

    function renderFolder(node, depth = 0) {
      const folderWrap =
        document.createElement("div");

      folderWrap.className =
        "drive-tree-folder";

      folderWrap.dataset.folderId =
        node.file.id;

      if (
        !expandedVideoFolders.has(
          node.file.id
        )
      ) {
        folderWrap.classList.add("collapsed");
      }

      const folderRow =
        document.createElement("button");

      folderRow.type = "button";
      folderRow.className =
        "drive-folder-row";

      folderRow.style.paddingLeft =
        Math.min(8 + depth * 2, 22) + "px";

      const chevron =
        document.createElement("span");

      chevron.className =
        "drive-folder-chevron";

      chevron.textContent = "›";

      const icon =
        document.createElement("span");

      icon.className =
        "drive-folder-icon";

      icon.textContent = "📁";

      const name =
        document.createElement("span");

      name.className =
        "drive-folder-name";

      name.textContent =
        node.file.name || "Folder";

      const directMedia =
        (node.children || [])
          .filter(child =>
            isVideoFile(child.file)
          ).length;

      const directFolders =
        (node.children || [])
          .filter(child =>
            isDriveFolder(child.file)
          ).length;

      const count =
        document.createElement("span");

      count.className =
        "drive-folder-count";

      const countParts = [];

      if (directFolders) {
        countParts.push(
          directFolders + "夹"
        );
      }

      if (directMedia) {
        countParts.push(
          directMedia + "视频"
        );
      }

      count.textContent =
        countParts.join(" · ");

      folderRow.append(
        chevron,
        icon,
        name,
        count
      );

      const children =
        document.createElement("div");

      children.className =
        "drive-folder-children";

      folderRow.addEventListener(
        "click",
        () => {
          const id = node.file.id;

          if (
            expandedVideoFolders.has(id)
          ) {
            expandedVideoFolders.delete(id);
            folderWrap.classList.add(
              "collapsed"
            );
          } else {
            expandedVideoFolders.add(id);
            folderWrap.classList.remove(
              "collapsed"
            );
          }
        }
      );

      for (const child of node.children || []) {
        if (isDriveFolder(child.file)) {
          children.appendChild(
            renderFolder(child, depth + 1)
          );
        } else if (isVideoFile(child.file)) {
          children.appendChild(
            createVideoTreeMediaItem(
              child.file,
              child.file._playlistIndex
            )
          );
        }
      }

      folderWrap.append(
        folderRow,
        children
      );

      return folderWrap;
    }

    items.appendChild(
      renderFolder(videoTreeRoot, 0)
    );

    videoPlaylistDomReady = true;
  }

  function createVideoTreeMediaItem(file, index) {
    const button =
      document.createElement("button");

    button.className =
      "video-playlist-item tree-video" +
      (
        index === currentVideoIndex
          ? " active"
          : ""
      );

    button.type = "button";
    button.dataset.index = String(index);

    if (index === currentVideoIndex) {
      button.setAttribute(
        "aria-current",
        "true"
      );
    }

    const thumb =
      document.createElement("div");

    thumb.className =
      "video-thumb-wrap";

    const fallback =
      document.createElement("div");

    fallback.className =
      "video-thumb-fallback";

    fallback.textContent = "▶";

    thumb.appendChild(fallback);

    if (file.thumbnailLink) {
      const img =
        document.createElement("img");

      img.loading = "lazy";
      img.decoding = "async";
      img.alt = "";
      img.src = file.thumbnailLink;

      img.onerror = () => img.remove();

      thumb.appendChild(img);
    }

    const meta =
      document.createElement("div");

    meta.className =
      "video-playlist-meta";

    const name =
      document.createElement("div");

    name.className =
      "video-playlist-name";

    name.textContent =
      file.name ||
      "Google Drive Video";

    const sub =
      document.createElement("div");

    sub.className =
      "video-playlist-sub";

    const resolution =
      file.videoMediaMetadata &&
      file.videoMediaMetadata.width &&
      file.videoMediaMetadata.height
        ? file.videoMediaMetadata.width +
          "×" +
          file.videoMediaMetadata.height
        : "";

    const relativeFolder =
      file._folderPath &&
      videoRootFolder &&
      file._folderPath !== videoRootFolder.name
        ? file._folderPath
        : "";

    sub.textContent =
      [
        relativeFolder,
        resolution,
        formatFileSize(file.size)
      ]
        .filter(Boolean)
        .join(" · ");

    meta.append(
      name,
      sub
    );

    button.append(
      thumb,
      meta
    );

    button.addEventListener(
      "click",
      async () => {
        await switchVideoByIndex(
          index,
          true
        );

        closeVideoPlaylist();
      }
    );

    return button;
  }

  function openVideoPlaylist() {
    const wrap = document.getElementById("playerWrap");
    if (!wrap || (!videoTreeRoot && videoPlaylist.length <= 1)) return;
    wrap.classList.add("playlist-open");
    wrap.classList.remove("watch-ui-hidden", "fullscreen-ui-hidden");

    ensureVideoPathExpanded(
      videoTreeRoot,
      currentFileId
    );

    if (!videoPlaylistDomReady) {
      renderVideoPlaylist();
    } else {
      syncVideoPlaylistDomState();
    }

    requestAnimationFrame(() => {
      const active = document.querySelector(
        `#videoPlaylistItems .video-playlist-item[data-index="${currentVideoIndex}"]`
      );
      if (active) {
        active.scrollIntoView({
          block: "nearest"
        });
      }
    });

    clearTimeout(videoUiTimer);
    clearTimeout(fullscreenUiTimer);
  }

  function closeVideoPlaylist() {
    const wrap = document.getElementById("playerWrap");
    if (!wrap) return;
    wrap.classList.remove("playlist-open");
    showWatchUi();
  }

  function toggleVideoPlaylist() {
    const wrap = document.getElementById("playerWrap");
    if (!wrap) return;
    if (wrap.classList.contains("playlist-open")) closeVideoPlaylist();
    else openVideoPlaylist();
  }

  async function playPreviousVideo() {
    if (!videoPlaylist.length) return;
    const next = currentVideoIndex > 0 ? currentVideoIndex - 1 : videoPlaylist.length - 1;
    await switchVideoByIndex(next, true);
  }

  async function playNextVideo() {
    if (!videoPlaylist.length) return;
    const next = currentVideoIndex + 1 < videoPlaylist.length ? currentVideoIndex + 1 : 0;
    await switchVideoByIndex(next, true);
  }

  function updateVideoInfo(file) {
    document.getElementById("filename").textContent = file.name || "Google Drive Video";
    const meta = file.videoMediaMetadata;
    document.getElementById("quality").textContent =
      meta && meta.width && meta.height
        ? "Original · " + meta.width + " × " + meta.height
        : "Original · Drive 原文件";
  }

  async function sendCurrentVideoStateToWorker(file) {
    if (!serviceWorkerReady) {
      throw new Error(
        "视频流服务尚未准备完成，请刷新页面后重试。"
      );
    }

    const registration =
      await navigator
        .serviceWorker
        .ready;

    const worker =
      navigator.serviceWorker.controller ||
      registration.active;

    if (!worker) {
      throw new Error(
        "Service Worker 尚未接管当前页面。请刷新后重试。"
      );
    }

    await postWorkerMessage(
      worker,
      {
        type: "SET_TOKEN",
        token:
          currentAccessToken,
        fileId:
          file.id,
        fileSize:
          Number(file.size)
      },
      260
    );
  }

  async function switchVideoByIndex(index, autoplay = true) {
    const file = videoPlaylist[index];
    if (!file) return;

    const generation =
      ++switchGeneration;

    /* 切换视频时仅停止旧的 Seek Rescue；不启动任何下一条预加载。 */
    destroySeekRescue();

    currentVideoIndex = index;
    currentFileId = file.id;
    currentResourceKey = file.resourceKey || null;
    currentFileSize = Number(file.size);

    ensureVideoPathExpanded(
      videoTreeRoot,
      file.id
    );

    updateVideoInfo(file);

    if (videoPlaylistDomReady) {
      syncVideoPlaylistDomState();
    }

    if (file.capabilities && file.capabilities.canDownload === false) {
      showError("这个 Google Drive 文件禁止下载，因此无法播放原文件。");
      return;
    }

    await sendCurrentVideoStateToWorker(file);

    if (generation !== switchGeneration) {
      return;
    }

    const mediaUrl =
      getVideoMediaUrl(file);

    const player =
      document.getElementById("player");

    if (!player) {
      return;
    }

    if (sharpenMode === 0 && gpuActive) {
      disableWebGPUEnhancement(
        false,
        true
      );
    }

    if (file.thumbnailLink) {
      player.poster = file.thumbnailLink;
    } else {
      player.removeAttribute("poster");
    }

    /*
     * 纯按需加载：只有切换动作真正发生后才设置 src / load。
     */
    player.src = mediaUrl;
    player.load();
    applySharpenMode();

    setStatus(
      sharpenMode === 0
        ? "Original · 流畅模式（按需加载）"
        : (
            gpuActive
              ? "Original · WebGPU 高质量渲染 · 按需加载"
              : "Original · 准备高质量渲染 · 按需加载"
          )
    );

    if (autoplay) {
      try {
        const playPromise =
          player.play();

        playPromise?.catch?.(
          error => {
            console.log(
              "等待用户点击播放：",
              error
            );
          }
        );
      } catch (error) {
        console.log(
          "等待用户点击播放：",
          error
        );
      }
    }

    showWatchUi();
  }

  function startGpuHealthMonitor() {
    if (gpuHealthTimer) return;

    gpuHealthTimer = setInterval(() => {
      const player = document.getElementById("player");
      if (
        !player ||
        player.paused ||
        !gpuActive ||
        typeof player.getVideoPlaybackQuality !== "function"
      ) {
        return;
      }

      try {
        const q = player.getVideoPlaybackQuality();
        const total = Number(q.totalVideoFrames || 0);
        const dropped = Number(q.droppedVideoFrames || 0);
        const deltaTotal = total - gpuHealthPrevTotal;
        const deltaDropped = dropped - gpuHealthPrevDropped;

        gpuHealthPrevTotal = total;
        gpuHealthPrevDropped = dropped;

        if (deltaTotal < 90) return;

        const ratio = deltaDropped / deltaTotal;

        /*
         * 画质模式现在完全由用户手动控制。
         * 检测到持续掉帧时只提示，不自动改成“流畅”。
         */
        if (deltaDropped >= 6 && ratio >= 0.035) {
          setStatus(
            "检测到持续掉帧 · 可手动选择「画质：流畅」"
          );

          console.warn(
            "检测到 WebGPU 渲染掉帧。当前为手动画质模式，未自动切换。",
            { deltaTotal, deltaDropped, ratio }
          );
        }
      } catch (error) {
        console.debug("GPU 健康监测失败：", error);
      }
    }, 5000);
  }

  function bindVideoPlayerEvents(player) {
    if (
      !player ||
      player.dataset
        .mainPlayerEventsReady ===
        "1"
    ) {
      return;
    }

    player.dataset
      .mainPlayerEventsReady =
        "1";

    const isActivePlayer =
      () =>
        player ===
        document.getElementById(
          "player"
        );

    player.addEventListener(
      "loadedmetadata",
      () => {
        if (!isActivePlayer()) {
          return;
        }

        syncGpuCanvasSize();
        syncGpuMediaControls();
        updateDiagnostic();
      }
    );

    player.addEventListener(
      "loadeddata",
      async () => {
        if (!isActivePlayer()) {
          return;
        }

        if (
          sharpenMode !== 0 &&
          !gpuActive &&
          !gpuInitializing
        ) {
          await enableWebGPUEnhancement();
          applySharpenMode();
        } else if (
          sharpenMode === 0
        ) {
          setGpuUiActive(false);
          applySharpenMode();

          setStatus(
            "Original · 流畅模式（手动）"
          );
        }

        syncGpuCanvasSize();
        renderGpuFrame();
        updateDiagnostic();
      }
    );

    player.addEventListener(
      "resize",
      () => {
        if (!isActivePlayer()) {
          return;
        }

        syncGpuCanvasSize();
        renderGpuFrame();
        updateDiagnostic();
      }
    );

    player.addEventListener(
      "timeupdate",
      () => {
        if (
          isActivePlayer() &&
          diagnosticOpen
        ) {
          updateDiagnostic();
        }
      }
    );

    player.addEventListener(
      "play",
      () => {
        if (isActivePlayer()) {
          showWatchUi();
        }
      }
    );

    player.addEventListener(
      "pause",
      () => {
        if (isActivePlayer()) {
          showWatchUi();
        }
      }
    );

    player.addEventListener(
      "seeking",
      () => {
        if (isActivePlayer()) {
          handlePlayerSeekingForRescue();
        }
      }
    );

    player.addEventListener(
      "timeupdate",
      () => {
        if (isActivePlayer()) {
          handlePlayerProgressForRescue();
        }
      }
    );

    player.addEventListener(
      "playing",
      () => {
        if (isActivePlayer()) {
          handlePlayerProgressForRescue();
        }
      }
    );

    player.addEventListener(
      "ended",
      async () => {
        if (!isActivePlayer()) {
          return;
        }

        if (
          videoPlaylist.length >
            1
        ) {
          const next =
            currentVideoIndex + 1;

          if (
            next <
            videoPlaylist.length
          ) {
            await switchVideoByIndex(
              next,
              true
            );
          }
        }
      }
    );

    player.addEventListener(
      "error",
      () => {
        if (!isActivePlayer()) {
          return;
        }

        showError(
          "视频文件已经成功读取，但浏览器无法解码这个视频。\\n\\n" +
          "最兼容的是：MP4 + H.264/AVC + AAC。"
        );
      }
    );
  }

  function initVideoPlayerEventsOnce() {
    if (videoPlayerEventsReady) {
      return;
    }

    videoPlayerEventsReady = true;

    const player =
      document.getElementById("player");

    initGpuMediaControls();
    initFullscreenAutoHide();
    startGpuHealthMonitor();
    bindVideoPlayerEvents(player);
  }


  /*
   * ================================================================
   * Seek Rescue V2 · Mediabunny random-access transmux + MSE
   * ================================================================
   *
   * v1 使用 MP4Box 对稀疏的 sample 物理区间做 appendBuffer，
   * 某些非交错 MP4 会停在 HAVE_NOTHING。
   *
   * V2 改成：
   *   Drive Range URL
   *      → Mediabunny UrlSource（随机读取 / 自带缓存与并发）
   *      → Conversion（能 copy 就直接 transmux，不重新编码）
   *      → fragmented MP4
   *      → MediaSource / SourceBuffer
   *
   * 正常文件继续原生 <video>；仅 Seek 卡住时加载本模块。
   */

  const SEEK_RESCUE_TIMEOUT_MS = 1200;
  const SEEK_RESCUE_DEBOUNCE_MS = 150;
  const SEEK_RESCUE_INITIAL_OUTPUT_SEC = 10;
  const SEEK_RESCUE_REFILL_OUTPUT_SEC = 16;
  const SEEK_RESCUE_REFILL_THRESHOLD_SEC = 5;
  const SEEK_RESCUE_WINDOW_BACK_SEC = 6;
  const SEEK_RESCUE_STORAGE_KEY =
    "drive_original_player_seek_rescue_v2";

  const MEDIABUNNY_MODULE_URL =
    "https://cdn.jsdelivr.net/npm/mediabunny@1.51.0/+esm";

  let mediabunnyModulePromise = null;
  let seekRescueSession = null;
  let seekRescueActivation = null;
  let seekRescueWatchdog = null;
  let seekRescueProbe = null;
  let seekRescueDebounceTimer = null;
  let seekRescueInternalChange = false;
  let seekPendingTarget = null;
  let seekRescuePreparedSession = null;
  let seekRescuePreparedFileId = null;


  function showSeekHoldOverlay(targetTime) {
    const overlay = document.getElementById("seekHoldOverlay");
    const canvas = document.getElementById("seekHoldCanvas");
    const text = document.getElementById("seekHoldText");
    const player = document.getElementById("player");
    const stage = document.getElementById("videoStage");

    seekPendingTarget = targetTime;

    if (text) {
      text.textContent =
        "正在跳转到 " + formatSeconds(targetTime) + "…";
    }

    if (canvas && player && stage) {
      try {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (player.videoWidth && player.videoHeight && player.readyState >= 2) {
          const scale = Math.min(
            canvas.width / player.videoWidth,
            canvas.height / player.videoHeight
          );
          const w = player.videoWidth * scale;
          const h = player.videoHeight * scale;
          const x = (canvas.width - w) / 2;
          const y = (canvas.height - h) / 2;
          ctx.drawImage(player, x, y, w, h);
        }
      } catch (_) {}
    }

    overlay?.classList.add("active");
    syncGpuMediaControls();
  }

  function hideSeekHoldOverlay() {
    document.getElementById("seekHoldOverlay")
      ?.classList.remove("active");
    seekPendingTarget = null;
    syncGpuMediaControls();
  }

  async function prepareSeekRescueForCurrentFile() {
    const file = videoPlaylist[currentVideoIndex];
    const player = document.getElementById("player");

    if (
      !file ||
      !player ||
      !isSeekRescueRemembered(file.id) ||
      (
        file.mimeType !== "video/mp4" &&
        !/\.mp4$/i.test(file.name || "")
      ) ||
      seekRescueSession ||
      seekRescueActivation
    ) {
      return;
    }

    if (
      seekRescuePreparedSession &&
      seekRescuePreparedFileId === file.id
    ) {
      return;
    }

    if (seekRescuePreparedSession) {
      seekRescuePreparedSession.destroy().catch(() => {});
    }

    const session = new MediabunnySeekRescueSession(
      player,
      file,
      getMediaUrlForFile(file),
      Number.isFinite(player.duration) ? player.duration : 0
    );

    seekRescuePreparedSession = session;
    seekRescuePreparedFileId = file.id;

    try {
      await session.prepareInput();
    } catch (error) {
      console.debug("Seek Rescue 预热失败：", error);
      if (seekRescuePreparedSession === session) {
        seekRescuePreparedSession = null;
        seekRescuePreparedFileId = null;
      }
      session.destroy().catch(() => {});
    }
  }

  function loadMediabunnyModule() {
    if (!mediabunnyModulePromise) {
      mediabunnyModulePromise =
        import(MEDIABUNNY_MODULE_URL)
          .catch(error => {
            mediabunnyModulePromise = null;
            throw error;
          });
    }

    return mediabunnyModulePromise;
  }

  function getRememberedSeekRescueIds() {
    try {
      const value = JSON.parse(
        localStorage.getItem(
          SEEK_RESCUE_STORAGE_KEY
        ) || "[]"
      );

      return new Set(
        Array.isArray(value)
          ? value
          : []
      );
    } catch (_) {
      return new Set();
    }
  }

  function isSeekRescueRemembered(fileId) {
    return !!fileId &&
      getRememberedSeekRescueIds()
        .has(fileId);
  }

  function rememberSeekRescue(fileId) {
    if (!fileId) return;

    try {
      const ids =
        getRememberedSeekRescueIds();

      ids.add(fileId);

      localStorage.setItem(
        SEEK_RESCUE_STORAGE_KEY,
        JSON.stringify(
          Array.from(ids).slice(-200)
        )
      );
    } catch (_) {}
  }

  function getMediaUrlForFile(file) {
    if (!file || !file.id) return "";

    let url =
      "./media/" +
      encodeURIComponent(file.id);

    if (file.resourceKey) {
      url +=
        "?resourceKey=" +
        encodeURIComponent(
          file.resourceKey
        );
    }

    return url;
  }

  function concatUint8Arrays(a, b) {
    const first =
      a instanceof Uint8Array
        ? a
        : new Uint8Array(a || 0);

    const second =
      b instanceof Uint8Array
        ? b
        : new Uint8Array(b || 0);

    const out =
      new Uint8Array(
        first.byteLength +
        second.byteLength
      );

    out.set(first, 0);
    out.set(
      second,
      first.byteLength
    );

    return out;
  }

  function copyUint8(data) {
    if (!data) {
      return new Uint8Array(0);
    }

    const view =
      data instanceof Uint8Array
        ? data
        : new Uint8Array(data);

    return view.slice();
  }

  function waitForEventOnce(
    target,
    eventName,
    timeout = 10000
  ) {
    return new Promise(
      (resolve, reject) => {
        let timer = null;

        const cleanup = () => {
          if (timer) {
            clearTimeout(timer);
          }

          target.removeEventListener(
            eventName,
            onEvent
          );
        };

        const onEvent = event => {
          cleanup();
          resolve(event);
        };

        target.addEventListener(
          eventName,
          onEvent,
          { once: true }
        );

        timer = setTimeout(
          () => {
            cleanup();
            reject(
              new Error(
                "等待 " +
                eventName +
                " 超时"
              )
            );
          },
          timeout
        );
      }
    );
  }

  class MediabunnySeekRescueSession {
    constructor(
      player,
      file,
      mediaUrl,
      originalDuration
    ) {
      this.player = player;
      this.file = file;
      this.mediaUrl = mediaUrl;
      this.originalDuration =
        Number.isFinite(originalDuration)
          ? originalDuration
          : 0;

      this.module = null;
      this.source = null;
      this.input = null;
      this.mime = "";

      this.mediaSource = null;
      this.sourceBuffer = null;
      this.objectUrl = null;

      this.output = null;
      this.conversion = null;
      this.windowStart = 0;
      this.generatedUntil = 0;
      this.conversionBusy = false;

      this.appendQueue = [];
      this.appendBusy = false;
      this.appendError = null;

      this.ftyp = null;
      this.lastMoof = null;
      this.lastMoofTimestamp = null;

      this.active = false;
      this.destroyed = false;
      this.refillTimer = null;
      this.phase = "初始化";
      this.bytesRead = 0;
      this.generation = 0;
    }

    async prepareInput() {
      if (this.input) return;

      this.phase = "加载 Mediabunny";
      this.module =
        await loadMediabunnyModule();

      const {
        Input,
        UrlSource,
        ALL_FORMATS
      } = this.module;

      if (
        !Input ||
        !UrlSource ||
        !ALL_FORMATS
      ) {
        throw new Error(
          "Mediabunny 模块不完整。"
        );
      }

      this.phase = "读取 MP4 索引";

      this.source =
        new UrlSource(
          this.mediaUrl,
          {
            maxCacheSize:
              24 * 1024 * 1024,
            parallelism: 6,
            requestInit: {
              cache: "no-store"
            }
          }
        );

      try {
        this.source.on(
          "read",
          ({ start, end }) => {
            const length =
              Number(end) -
              Number(start);

            if (
              Number.isFinite(length) &&
              length > 0
            ) {
              this.bytesRead += length;
            }
          }
        );
      } catch (_) {}

      this.input =
        new Input({
          source: this.source,
          formats: ALL_FORMATS
        });

      if (
        !(await this.input.canRead())
      ) {
        throw new Error(
          "Mediabunny 无法读取这个媒体文件。"
        );
      }

      const videoTrack =
        await this.input
          .getPrimaryVideoTrack();

      if (!videoTrack) {
        throw new Error(
          "没有找到主视频轨。"
        );
      }

      const audioTrack =
        await this.input
          .getPrimaryAudioTrack();

      const codecStrings = [];

      const videoCodec =
        await videoTrack
          .getCodecParameterString();

      if (videoCodec) {
        codecStrings.push(
          videoCodec
        );
      }

      if (audioTrack) {
        const audioCodec =
          await audioTrack
            .getCodecParameterString();

        if (audioCodec) {
          codecStrings.push(
            audioCodec
          );
        }
      }

      if (!codecStrings.length) {
        throw new Error(
          "无法取得 MSE codec string。"
        );
      }

      this.mime =
        'video/mp4; codecs="' +
        codecStrings.join(", ") +
        '"';

      if (
        !("MediaSource" in window) ||
        !MediaSource.isTypeSupported(
          this.mime
        )
      ) {
        throw new Error(
          "浏览器 MSE 不支持：" +
          this.mime
        );
      }

      if (
        !(this.originalDuration > 0)
      ) {
        try {
          this.originalDuration =
            await this.input
              .getDurationFromMetadata();
        } catch (_) {}
      }
    }

    async cancelConversion() {
      if (this.conversion) {
        try {
          await this.conversion.cancel();
        } catch (_) {}
      }

      this.conversion = null;
      this.output = null;
      this.conversionBusy = false;
    }

    async closeMediaSource() {
      this.appendQueue.length = 0;
      this.appendBusy = false;
      this.appendError = null;

      if (this.sourceBuffer) {
        try {
          if (this.sourceBuffer.updating) {
            this.sourceBuffer.abort();
          }
        } catch (_) {}
      }

      if (
        this.mediaSource &&
        this.mediaSource.readyState ===
          "open"
      ) {
        try {
          this.mediaSource.endOfStream();
        } catch (_) {}
      }

      this.sourceBuffer = null;
      this.mediaSource = null;

      if (this.objectUrl) {
        try {
          URL.revokeObjectURL(
            this.objectUrl
          );
        } catch (_) {}

        this.objectUrl = null;
      }
    }

    enqueueAppend(data) {
      if (
        this.destroyed ||
        !data ||
        !data.byteLength
      ) {
        return;
      }

      this.appendQueue.push(
        copyUint8(data)
      );

      this.pumpAppendQueue();
    }

    pumpAppendQueue() {
      if (
        this.destroyed ||
        this.appendBusy ||
        !this.sourceBuffer ||
        this.sourceBuffer.updating ||
        !this.appendQueue.length
      ) {
        return;
      }

      const data =
        this.appendQueue.shift();

      this.appendBusy = true;

      const sb =
        this.sourceBuffer;

      const cleanup = () => {
        sb.removeEventListener(
          "updateend",
          onUpdateEnd
        );

        sb.removeEventListener(
          "error",
          onError
        );
      };

      const onUpdateEnd = () => {
        cleanup();
        this.appendBusy = false;
        this.pumpAppendQueue();
      };

      const onError = () => {
        cleanup();
        this.appendBusy = false;
        this.appendError =
          new Error(
            "MSE SourceBuffer append 失败。"
          );
      };

      sb.addEventListener(
        "updateend",
        onUpdateEnd,
        { once: true }
      );

      sb.addEventListener(
        "error",
        onError,
        { once: true }
      );

      try {
        sb.appendBuffer(data);
      } catch (error) {
        cleanup();
        this.appendBusy = false;
        this.appendError = error;
      }
    }

    async waitAppendIdle(
      timeout = 12000
    ) {
      const started =
        performance.now();

      while (
        !this.destroyed &&
        performance.now() -
          started <
          timeout
      ) {
        if (this.appendError) {
          throw this.appendError;
        }

        if (
          !this.appendBusy &&
          !this.appendQueue.length &&
          !this.sourceBuffer?.updating
        ) {
          return;
        }

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              30
            )
        );
      }

      throw new Error(
        "等待 MSE 写入超时。"
      );
    }

    isBuffered(time) {
      try {
        const ranges =
          this.player.buffered;

        for (
          let index = 0;
          index < ranges.length;
          index++
        ) {
          if (
            time >=
              ranges.start(index) &&
            time <=
              ranges.end(index) -
              0.05
          ) {
            return true;
          }
        }
      } catch (_) {}

      return false;
    }

    async waitUntilBuffered(
      time,
      timeout = 16000
    ) {
      const started =
        performance.now();

      while (
        !this.destroyed &&
        performance.now() -
          started <
          timeout
      ) {
        if (this.appendError) {
          throw this.appendError;
        }

        if (
          this.player.readyState >= 1 &&
          this.isBuffered(time)
        ) {
          return true;
        }

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              70
            )
        );
      }

      return false;
    }

    async createPipeline(
      targetTime
    ) {
      await this.prepareInput();
      await this.cancelConversion();
      await this.closeMediaSource();

      this.generation++;
      const generation =
        this.generation;

      const {
        Output,
        NullTarget,
        Mp4OutputFormat,
        Conversion
      } = this.module;

      if (
        !Output ||
        !NullTarget ||
        !Mp4OutputFormat ||
        !Conversion
      ) {
        throw new Error(
          "Mediabunny 输出模块不完整。"
        );
      }

      this.windowStart =
        Math.max(
          0,
          targetTime -
            SEEK_RESCUE_WINDOW_BACK_SEC
        );

      this.generatedUntil = 0;
      this.ftyp = null;
      this.lastMoof = null;
      this.lastMoofTimestamp = null;
      this.phase = "建立 MSE";

      const ms =
        new MediaSource();

      this.mediaSource = ms;
      this.objectUrl =
        URL.createObjectURL(ms);

      const sourceOpen =
        waitForEventOnce(
          ms,
          "sourceopen",
          10000
        );

      seekRescueInternalChange = true;

      this.player.src =
        this.objectUrl;

      this.player.load();

      try {
        await sourceOpen;
      } finally {
        seekRescueInternalChange = false;
      }

      if (
        generation !==
          this.generation ||
        this.destroyed
      ) {
        return;
      }

      const sb =
        ms.addSourceBuffer(
          this.mime
        );

      this.sourceBuffer = sb;
      sb.mode = "segments";

      /*
       * Mediabunny Conversion 的 trim 输出从 0 开始。
       * timestampOffset 把临时 fMP4 的 0 秒重新映射到
       * 原视频的 windowStart，因此播放器仍显示原时间轴。
       */
      sb.timestampOffset =
        this.windowStart;

      if (
        this.originalDuration > 0
      ) {
        try {
          ms.duration =
            this.originalDuration;
        } catch (_) {}
      }

      const format =
        new Mp4OutputFormat({
          fastStart: "fragmented",
          minimumFragmentDuration: 0.5,

          onFtyp: data => {
            if (
              generation !==
                this.generation
            ) return;

            this.ftyp =
              copyUint8(data);
          },

          onMoov: data => {
            if (
              generation !==
                this.generation
            ) return;

            const header =
              concatUint8Arrays(
                this.ftyp,
                data
              );

            this.enqueueAppend(
              header
            );
          },

          onMoof: (
            data,
            position,
            timestamp
          ) => {
            if (
              generation !==
                this.generation
            ) return;

            this.lastMoof =
              copyUint8(data);

            this.lastMoofTimestamp =
              Number(timestamp);
          },

          onMdat: data => {
            if (
              generation !==
                this.generation
            ) return;

            if (!this.lastMoof) {
              return;
            }

            const segment =
              concatUint8Arrays(
                this.lastMoof,
                data
              );

            this.lastMoof = null;
            this.enqueueAppend(
              segment
            );
          }
        });

      this.output =
        new Output({
          target:
            new NullTarget(),
          format
        });

      this.phase = "准备无损重封装";

      this.conversion =
        await Conversion.init({
          input: this.input,
          output: this.output,
          tracks: "primary",
          trim: {
            start:
              this.windowStart
          },
          showWarnings: false
        });

      if (
        !this.conversion.isValid
      ) {
        const reasons =
          (this.conversion
            .discardedTracks || [])
            .map(item =>
              item.reason
            )
            .join(", ");

        throw new Error(
          "Mediabunny 无法无损转换此文件" +
          (reasons
            ? "：" + reasons
            : "。")
        );
      }
    }

    async executeUntil(
      outputTime
    ) {
      if (
        this.destroyed ||
        !this.conversion ||
        this.conversionBusy
      ) {
        return;
      }

      this.conversionBusy = true;
      this.phase = "读取目标音视频片段";

      try {
        await this.conversion.execute({
          until: outputTime
        });

        this.generatedUntil =
          Math.max(
            this.generatedUntil,
            outputTime
          );

        await this.waitAppendIdle();
      } finally {
        this.conversionBusy = false;
      }
    }

    async seekTo(
      targetTime,
      shouldPlay = true,
      forceRebuild = false
    ) {
      if (this.destroyed) return;

      const duration =
        this.originalDuration > 0
          ? this.originalDuration
          : Infinity;

      const target =
        Math.max(
          0,
          Math.min(
            targetTime,
            Number.isFinite(duration)
              ? Math.max(
                  0,
                  duration - 0.05
                )
              : targetTime
          )
        );

      if (
        !forceRebuild &&
        this.active &&
        this.isBuffered(target)
      ) {
        seekRescueInternalChange = true;

        this.player.currentTime =
          target;

        setTimeout(() => {
          seekRescueInternalChange = false;
        }, 250);

        if (shouldPlay) {
          try {
            await this.player.play();
          } catch (_) {}
        }

        return;
      }

      await this.createPipeline(
        target
      );

      const relativeTarget =
        target -
        this.windowStart;

      const initialUntil =
        Math.max(
          SEEK_RESCUE_INITIAL_OUTPUT_SEC,
          relativeTarget + 4
        );

      await this.executeUntil(
        initialUntil
      );

      this.phase = "等待目标缓冲";

      const buffered =
        await this.waitUntilBuffered(
          target,
          9000
        );

      if (!buffered) {
        throw new Error(
          "Rescue 已重封装目标片段，" +
          "但 MSE 仍未产生目标缓冲。"
        );
      }

      seekRescueInternalChange = true;

      this.player.currentTime =
        target;

      setTimeout(() => {
        seekRescueInternalChange = false;
      }, 300);

      if (shouldPlay) {
        try {
          await this.player.play();
        } catch (_) {}
      }

      this.active = true;
      this.phase = "播放中";
      hideSeekHoldOverlay();
      this.startRefillLoop();
    }

    async refillIfNeeded() {
      if (
        this.destroyed ||
        !this.active ||
        !this.conversion ||
        this.conversionBusy ||
        this.player.paused
      ) {
        return;
      }

      const ahead =
        getBufferedAhead(
          this.player
        );

      if (
        ahead >
          SEEK_RESCUE_REFILL_THRESHOLD_SEC
      ) {
        return;
      }

      const nextUntil =
        this.generatedUntil +
        SEEK_RESCUE_REFILL_OUTPUT_SEC;

      try {
        await this.executeUntil(
          nextUntil
        );
      } catch (error) {
        if (
          error?.name !==
            "ConversionCanceledError"
        ) {
          console.error(
            "Seek Rescue V2 续缓冲失败：",
            error
          );
        }
      }
    }

    startRefillLoop() {
      if (this.refillTimer) return;

      this.refillTimer =
        setInterval(
          () => {
            this.refillIfNeeded();
          },
          1000
        );
    }

    async activate(
      targetTime,
      shouldPlay
    ) {
      await this.prepareInput();
      await this.seekTo(
        targetTime,
        shouldPlay,
        true
      );
    }

    async destroy() {
      this.destroyed = true;
      this.active = false;
      this.generation++;

      if (this.refillTimer) {
        clearInterval(
          this.refillTimer
        );

        this.refillTimer = null;
      }

      await this.cancelConversion();
      await this.closeMediaSource();

      if (this.input) {
        try {
          this.input.dispose();
        } catch (_) {}
      }

      this.input = null;
      this.source = null;
    }
  }

  function clearSeekRescueWatchdog() {
    if (seekRescueWatchdog) {
      clearTimeout(
        seekRescueWatchdog
      );

      seekRescueWatchdog = null;
    }

    seekRescueProbe = null;
  }

  function destroySeekRescue() {
    clearSeekRescueWatchdog();

    if (seekRescueDebounceTimer) {
      clearTimeout(
        seekRescueDebounceTimer
      );

      seekRescueDebounceTimer = null;
    }

    const oldSession =
      seekRescueSession;
    const oldPrepared =
      seekRescuePreparedSession;

    seekRescueSession = null;
    seekRescuePreparedSession = null;
    seekRescuePreparedFileId = null;
    seekRescueActivation = null;
    seekRescueInternalChange = false;

    if (oldSession) {
      oldSession.destroy()
        .catch(() => {});
    }

    if (oldPrepared && oldPrepared !== oldSession) {
      oldPrepared.destroy()
        .catch(() => {});
    }

    hideSeekHoldOverlay();
  }

  async function restoreNativeAfterRescueFailure(
    file,
    targetTime,
    shouldPlay
  ) {
    const player =
      document.getElementById(
        "player"
      );

    if (!player || !file) return;

    const mediaUrl =
      getMediaUrlForFile(file);

    seekRescueInternalChange = true;

    player.src = mediaUrl;
    player.load();

    const restore = () => {
      try {
        player.currentTime =
          Math.max(
            0,
            targetTime
          );
      } catch (_) {}

      const finishRestore = () => {
        seekRescueInternalChange = false;
        hideSeekHoldOverlay();
      };

      player.addEventListener("seeked", finishRestore, { once: true });
      player.addEventListener("canplay", finishRestore, { once: true });

      if (shouldPlay) {
        player.play()
          .catch(() => {});
      }

      setTimeout(finishRestore, 5000);
    };

    if (player.readyState >= 1) {
      restore();
    } else {
      player.addEventListener(
        "loadedmetadata",
        restore,
        { once: true }
      );
    }
  }

  async function activateSeekRescue(
    targetTime,
    reason = "Seek timeout"
  ) {
    const player =
      document.getElementById(
        "player"
      );

    if (!player) return;

    if (
      seekRescueSession &&
      seekRescueSession.active
    ) {
      return seekRescueSession.seekTo(
        targetTime,
        !player.paused
      );
    }

    if (seekRescueActivation) {
      return seekRescueActivation;
    }

    const file =
      videoPlaylist[
        currentVideoIndex
      ];

    if (
      !file ||
      file.mimeType !== "video/mp4" &&
      !/\.mp4$/i.test(
        file.name || ""
      )
    ) {
      return;
    }

    const shouldPlay =
      !player.paused;

    const originalDuration =
      Number.isFinite(player.duration)
        ? player.duration
        : 0;

    const session =
      (
        seekRescuePreparedSession &&
        seekRescuePreparedFileId === file.id
      )
        ? seekRescuePreparedSession
        : new MediabunnySeekRescueSession(
            player,
            file,
            getMediaUrlForFile(file),
            originalDuration
          );

    seekRescuePreparedSession = null;
    seekRescuePreparedFileId = null;
    seekRescueSession = session;
    showSeekHoldOverlay(targetTime);

    seekRescueActivation =
      (async () => {
        setStatus(
          "Seek Rescue V2 · 正在随机读取并重封装…"
        );

        console.warn(
          "启动 Seek Rescue V2：",
          {
            file: file.name,
            targetTime,
            reason
          }
        );

        try {
          await session.activate(
            targetTime,
            shouldPlay
          );

          rememberSeekRescue(
            file.id
          );

          const quality =
            document.getElementById(
              "quality"
            );

          if (
            quality &&
            !quality.textContent
              .includes("Rescue V2")
          ) {
            quality.textContent +=
              " · Rescue V2";
          }

          setStatus(
            "Original · Seek Rescue V2"
          );

          return true;
        } catch (error) {
          console.error(
            "Seek Rescue V2 启动失败：",
            error
          );

          await session.destroy()
            .catch(() => {});

          if (
            seekRescueSession ===
              session
          ) {
            seekRescueSession = null;
          }

          setStatus(
            "Seek Rescue V2 失败 · 回退原生播放"
          );

          await restoreNativeAfterRescueFailure(
            file,
            targetTime,
            shouldPlay
          );

          return false;
        } finally {
          seekRescueActivation = null;
        }
      })();

    return seekRescueActivation;
  }

  function scheduleActiveRescueSeek(
    targetTime
  ) {
    if (seekRescueDebounceTimer) {
      clearTimeout(
        seekRescueDebounceTimer
      );
    }

    seekRescueDebounceTimer =
      setTimeout(
        () => {
          seekRescueDebounceTimer = null;

          if (
            !seekRescueSession ||
            !seekRescueSession.active ||
            seekRescueInternalChange
          ) {
            return;
          }

          const player =
            document.getElementById(
              "player"
            );

          showSeekHoldOverlay(targetTime);

          seekRescueSession.seekTo(
            targetTime,
            !player.paused
          ).catch(async error => {
            console.error(
              "Seek Rescue V2 二次 Seek 失败：",
              error
            );

            const file =
              videoPlaylist[
                currentVideoIndex
              ];

            await seekRescueSession
              ?.destroy()
              .catch(() => {});

            seekRescueSession = null;

            await restoreNativeAfterRescueFailure(
              file,
              targetTime,
              !player.paused
            );
          });
        },
        SEEK_RESCUE_DEBOUNCE_MS
      );
  }

  function handlePlayerSeekingForRescue() {
    if (seekRescueInternalChange) {
      return;
    }

    const player =
      document.getElementById(
        "player"
      );

    const file =
      videoPlaylist[
        currentVideoIndex
      ];

    if (
      !player ||
      !file ||
      (
        file.mimeType !== "video/mp4" &&
        !/\.mp4$/i.test(
          file.name || ""
        )
      )
    ) {
      return;
    }

    const targetTime =
      player.currentTime;

    if (
      seekRescueSession &&
      seekRescueSession.active
    ) {
      scheduleActiveRescueSeek(
        targetTime
      );
      return;
    }

    clearSeekRescueWatchdog();

    seekRescueProbe = {
      fileId: file.id,
      targetTime,
      shouldPlay:
        !player.paused
    };

    const delay =
      isSeekRescueRemembered(
        file.id
      )
        ? SEEK_RESCUE_DEBOUNCE_MS
        : SEEK_RESCUE_TIMEOUT_MS;

    seekRescueWatchdog =
      setTimeout(
        () => {
          const probe =
            seekRescueProbe;

          if (
            !probe ||
            probe.fileId !==
              currentFileId ||
            seekRescueInternalChange
          ) {
            return;
          }

          const looksStuck =
            isSeekRescueRemembered(
              file.id
            ) ||
            player.seeking ||
            player.readyState < 3 ||
            getBufferedAhead(player) < 0.15;

          if (looksStuck) {
            activateSeekRescue(
              probe.targetTime,
              isSeekRescueRemembered(
                file.id
              )
                ? "remembered file"
                : "native seek stalled"
            );
          } else {
            clearSeekRescueWatchdog();
          }
        },
        delay
      );
  }

  function handlePlayerProgressForRescue() {
    if (
      !seekRescueProbe ||
      seekRescueInternalChange ||
      (
        seekRescueSession &&
        seekRescueSession.active
      )
    ) {
      return;
    }

    const player =
      document.getElementById(
        "player"
      );

    if (!player) return;

    if (
      !player.seeking &&
      player.readyState >= 3 &&
      getBufferedAhead(player) > 0.3
    ) {
      clearSeekRescueWatchdog();
    }
  }

  function getSeekRescueDiagnosticText() {
    if (seekRescueSession) {
      const mb =
        Math.round(
          seekRescueSession.bytesRead /
          1024 /
          1024
        );

      if (
        seekRescueSession.active
      ) {
        return (
          "已启用 · Mediabunny + fMP4/MSE" +
          " · " +
          seekRescueSession.phase +
          " · 已读约 " +
          mb +
          " MB"
        );
      }

      return (
        "启动中 · " +
        seekRescueSession.phase +
        " · 已读约 " +
        mb +
        " MB"
      );
    }

    if (
      isSeekRescueRemembered(
        currentFileId
      )
    ) {
      return "待命 · 此文件已记忆为 Rescue V2";
    }

    return "待命 · 原生 Seek 优先";
  }

  function parseDriveState() {

    const params = new URLSearchParams(window.location.search);
    const rawState = params.get("state");

    if (!rawState) {
      return null;
    }

    try {

      const state = JSON.parse(rawState);

      if (
        state.action === "open" &&
        Array.isArray(state.ids) &&
        state.ids.length > 0
      ) {

        const id = state.ids[0];

        let resourceKey = null;

        if (
          state.resourceKeys &&
          state.resourceKeys[id]
        ) {
          resourceKey = state.resourceKeys[id];
        }

        return {
          fileId: id,
          resourceKey: resourceKey
        };

      }

    } catch (err) {

      console.error("state 解析失败：", err);

    }

    return null;
  }

  async function openDriveVideo(accessToken) {
    setStatus("正在读取文件信息…");
    currentAccessToken = accessToken;

    try {
      const metadataUrl =
        "https://www.googleapis.com/drive/v3/files/" +
        encodeURIComponent(currentFileId) +
        "?supportsAllDrives=true&fields=" +
        encodeURIComponent(
          "id,name,mimeType,size,thumbnailLink,resourceKey,parents,driveId,capabilities,videoMediaMetadata"
        );

      const headers = { "Authorization": "Bearer " + accessToken };
      if (currentResourceKey) {
        headers["X-Goog-Drive-Resource-Keys"] = currentFileId + "/" + currentResourceKey;
      }

      const metadataResponse = await fetch(metadataUrl, { headers, cache: "no-store" });
      if (!metadataResponse.ok) {
        const text = await metadataResponse.text();
        throw new Error(
          "无法读取 Drive 文件信息。\\nHTTP " + metadataResponse.status + "\\n" + text
        );
      }

      const openedFile = await metadataResponse.json();
      openedFile.resourceKey = openedFile.resourceKey || currentResourceKey || null;

      if (openedFile.mimeType && openedFile.mimeType.startsWith("image/")) {
        window.location.replace("./gallery/" + window.location.search);
        return;
      }

      if (!isVideoFile(openedFile)) {
        throw new Error("当前文件不是可识别的视频文件。");
      }

      /*
       * V7 启动顺序：
       *
       * 1. 只使用当前打开的视频先初始化播放器；
       * 2. 立即开始原文件播放；
       * 3. 1433223 的 104+ 文件夹随后后台扫描。
       *
       * 因此“正在读取 1433223”不再挡住视频首帧。
       */
      videoTreeRoot = null;
      videoRootFolder = null;

      openedFile._playlistIndex =
        0;

      openedFile._folderPath =
        "";

      videoPlaylist = [
        openedFile
      ];

      currentVideoIndex = 0;

      document.getElementById(
        "welcome"
      ).style.display =
        "none";

      document.getElementById(
        "playerWrap"
      ).style.display =
        "block";

      document.getElementById(
        "videoListBtn"
      ).style.display =
        "none";

      initVideoPlayerEventsOnce();

      videoPlaylistDomReady =
        false;

      renderVideoPlaylist();

      await switchVideoByIndex(
        0,
        true
      );

      setStatus(
        "Original · 视频已打开 · 后台读取 " +
        VIDEO_ROOT_FOLDER_NAME
      );

      /*
       * 先单独读取当前视频的直接父文件夹：
       * 同目录“下一条”通常可以在全树扫描完成前数秒甚至更早开始预解码。
       */
      discoverCurrentFolderVideosEarly(
        openedFile,
        accessToken
      );

      /*
       * 故意不 await：
       * 1433223 全树扫描继续与视频播放并行。
       */
      startVideoTreeScanInBackground(
        openedFile,
        accessToken
      );
    } catch (err) {
      console.error(err);
      setStatus("读取失败");
      showError(err.message || String(err));
    }
  }

// WebGPU 模式下补齐最常用的键盘控制。
document.addEventListener("keydown", event => {
  if (!gpuActive) return;

  const tag =
    event.target && event.target.tagName
      ? event.target.tagName.toLowerCase()
      : "";

  if (tag === "input" || tag === "button") return;

  const player = document.getElementById("player");
  if (!player) return;

  if (event.code === "Space") {
    event.preventDefault();
    gpuTogglePlay();
  } else if (event.key === "ArrowLeft") {
    player.currentTime = Math.max(0, player.currentTime - 5);
  } else if (event.key === "ArrowRight") {
    player.currentTime = Math.min(
      Number.isFinite(player.duration) ? player.duration : Infinity,
      player.currentTime + 5
    );
  }
});

  // 每 30 分钟自动更新一次 Access Token
setInterval(
  refreshWorkerAccessToken,
  30 * 60 * 1000
);

// 页面放后台很久后重新回来时，马上更新
document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      refreshWorkerAccessToken();

      const player = document.getElementById("player");
      if (
        player &&
        player.readyState >= 2 &&
        sharpenMode !== 0 &&
        !gpuActive &&
        !gpuInitializing
      ) {
        enableWebGPUEnhancement();
      }
    }
  }
);

// 切回这个窗口时也更新
window.addEventListener(
  "focus",
  refreshWorkerAccessToken
);
</script>
