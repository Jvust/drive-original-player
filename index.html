<script>

  /*
   * ================================
   * 这里以后替换成你的 OAuth Client ID
   * ================================
   */

  const CLIENT_ID =
    "874966483946-dje8urul1seiu4bj6nucv3nsrhdp8f9f.apps.googleusercontent.com";


  /*
   * drive.file：
   * 允许访问用户明确使用本应用打开的 Drive 文件
   *
   * drive.install：
   * 用于 Drive 的“打开方式”集成
   */

  const SCOPES =  
    "https://www.googleapis.com/auth/drive.file " +
    "https://www.googleapis.com/auth/drive.install";


  let tokenClient = null;
  let currentFileId = null;
  let currentResourceKey = null;
  let currentFileSize = null;
  let serviceWorkerReady = false;
  const OAUTH_BRIDGE =
  "https://drive-oauth-bridge.143322378jb.workers.dev";

const SESSION_KEY =
  "drive_oauth_session";


function captureOAuthSession() {

  const params =
    new URLSearchParams(
      window.location.hash.substring(1)
    );

  const session =
    params.get("oauth_session");

  if (session) {

    localStorage.setItem(
      SESSION_KEY,
      session
    );

    // 把 session 从地址栏清掉
    history.replaceState(
      null,
      "",
      window.location.pathname +
      window.location.search
    );

    return true;
  }

  return false;
}


async function getBridgeAccessToken() {


  const session =
    localStorage.getItem(
      SESSION_KEY
    );

  if (!session) {
    return null;
  }

  try {

    const response =
      await fetch(
        OAUTH_BRIDGE + "/token",
        {
          method: "GET",

          headers: {
            "Authorization":
              "Bearer " + session
          },

          cache: "no-store"
        }
      );


    if (!response.ok) {

      // Refresh Token 失效等情况
      if (response.status === 401) {
        localStorage.removeItem(
          SESSION_KEY
        );
      }

      return null;
    }


    const data =
      await response.json();

    return (
      data.access_token ||
      null
    );

  } catch (error) {

    console.error(
      "自动获取 Access Token 失败：",
      error
    );

    return null;
  }
}

    let tokenRefreshRunning = false;

async function refreshWorkerAccessToken() {

  if (
    tokenRefreshRunning ||
    !currentFileId ||
    !currentFileSize ||
    !serviceWorkerReady
  ) {
    return;
  }

  tokenRefreshRunning = true;

  try {

    const accessToken =
      await getBridgeAccessToken();

    if (!accessToken) {
      return;
    }

    const registration =
      await navigator.serviceWorker.ready;

    const worker =
      navigator.serviceWorker.controller ||
      registration.active;

    if (!worker) {
      return;
    }

    worker.postMessage({
      type: "SET_TOKEN",
      token: accessToken,
      fileId: currentFileId,
      fileSize: currentFileSize
    });

    console.log(
      "Google Drive Access Token 已自动刷新"
    );

  } catch (error) {

    console.error(
      "自动刷新 Access Token 失败：",
      error
    );

  } finally {

    tokenRefreshRunning = false;

  }
}
  let rotated = false;

function toggleRotate() {

  const player =
    document.getElementById("player");

  rotated = !rotated;

  if (rotated) {

    player.classList.add("rotated");

    /*
     * 旋转之后宽高交换，

     */

      window.innerHeight - 150;

    const availableWidth =
      window.innerWidth - 60;

    player.style.width =
      availableHeight + "px";

    player.style.height =

    player.style.maxWidth = "none";
    player.style.maxHeight = "none";

  } else {

    player.classList.remove("rotated");

    player.style.width = "";
    player.style.height = "";
    player.style.maxWidth = "";
    player.style.maxHeight = "";
  }
}  


function getFullscreenElement() {
  return (
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    null
  );
}

async function toggleWebFullscreen() {
  const wrap =
    document.getElementById("playerWrap");

  if (!wrap) return;

  try {
    if (!getFullscreenElement()) {
      if (wrap.requestFullscreen) {
        await wrap.requestFullscreen();
      } else if (wrap.webkitRequestFullscreen) {
        wrap.webkitRequestFullscreen();
      } else {
        throw new Error("当前浏览器不支持网页全屏。");
      }
    } else {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  } catch (error) {
    console.error("网页全屏切换失败：", error);
    showError(
      "网页全屏切换失败：" +
      (error.message || String(error))
    );
  }
}

function updateWebFullscreenButton() {

let diagnosticOpen = false;
let diagnosticTimer = null;

function formatSeconds(value) {
  if (!Number.isFinite(value)) return "—";

  const total = Math.max(0, Math.floor(value));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const seconds = total % 60;

  if (hours > 0) {
    return (
      String(hours).padStart(2, "0") + ":" +
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0")
    );
  }

  return (
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0")
  );
}

function getBufferedAhead(player) {
  try {
    const current = player.currentTime;

    for (let i = 0; i < player.buffered.length; i++) {
      const start = player.buffered.start(i);
      const end = player.buffered.end(i);

      if (current >= start && current <= end) {
        return Math.max(0, end - current);
      }
    }
  } catch (error) {
    console.debug("读取缓冲区失败：", error);
  }

  return 0;
}

function buildDiagnosticText() {
  const player = document.getElementById("player");

  if (!player) {
    return "播放器尚未初始化。";
  }

  const rect = player.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  const sourceWidth = player.videoWidth || 0;
  const sourceHeight = player.videoHeight || 0;

  const cssWidth = Math.round(rect.width);
  const cssHeight = Math.round(rect.height);

  const physicalWidth = Math.round(rect.width * dpr);
  const physicalHeight = Math.round(rect.height * dpr);

  const widthScale =
    sourceWidth > 0
      ? physicalWidth / sourceWidth
      : NaN;

  const heightScale =
    sourceHeight > 0
      ? physicalHeight / sourceHeight
      : NaN;

  const effectiveScale =
    Number.isFinite(widthScale) &&
    Number.isFinite(heightScale)
      ? Math.min(widthScale, heightScale)
      : NaN;

  let scalingText = "等待视频元数据";

  if (Number.isFinite(effectiveScale)) {
    if (effectiveScale < 0.98) {
      scalingText =
        "浏览器正在缩小显示（" +
        Math.round(effectiveScale * 100) +
        "%）";
    } else if (effectiveScale > 1.02) {
      scalingText =
        "浏览器正在放大显示（" +
        Math.round(effectiveScale * 100) +
        "%）";
    } else {
      scalingText = "接近 1:1 物理像素显示";
    }
  }

  const bufferedAhead = getBufferedAhead(player);

  const readyStateMap = {
    0: "0 · HAVE_NOTHING",
    1: "1 · HAVE_METADATA",
    2: "2 · HAVE_CURRENT_DATA",
    3: "3 · HAVE_FUTURE_DATA",
    4: "4 · HAVE_ENOUGH_DATA"
  };

  const networkStateMap = {
    0: "0 · NETWORK_EMPTY",
    1: "1 · NETWORK_IDLE",
    2: "2 · NETWORK_LOADING",
    3: "3 · NETWORK_NO_SOURCE"
  };

  return [
    "【视频画质诊断】",
    "",
    "源视频分辨率：  " +
      (sourceWidth && sourceHeight
        ? sourceWidth + " × " + sourceHeight
        : "等待元数据"),
    "CSS 显示尺寸：  " +
      cssWidth + " × " + cssHeight,
    "屏幕 DPR：       " +
      dpr.toFixed(2),
    "约等效物理像素： " +
      physicalWidth + " × " + physicalHeight,
    "缩放判断：       " +
      scalingText,
    "",
    "当前时间：       " +
      formatSeconds(player.currentTime),
    "视频总时长：     " +
      formatSeconds(player.duration),
    "前向缓冲：       " +
      bufferedAhead.toFixed(1) + " 秒",
    "播放速度：       " +
      player.playbackRate.toFixed(2) + "×",
    "readyState：     " +
      (readyStateMap[player.readyState] || player.readyState),
    "networkState：   " +
      (networkStateMap[player.networkState] || player.networkState),
    "",
    "说明：Drive 传输端仍读取原文件；这里主要判断浏览器是否",
    "把源视频缩放到较小的屏幕尺寸后再显示。"
  ].join("\n");
}

function updateDiagnostic() {
  const panel =
    document.getElementById("diagnosticPanel");

  if (!panel || !diagnosticOpen) {
    return;
  }

  panel.textContent =
    buildDiagnosticText();
}

function toggleDiagnostic() {
  const panel =
    document.getElementById("diagnosticPanel");

  const copyButton =
    document.getElementById("copyDiagnosticBtn");

  diagnosticOpen =
    !diagnosticOpen;

  panel.classList.toggle(
    "open",
    diagnosticOpen
  );

  if (copyButton) {
    copyButton.style.display =
      diagnosticOpen
        ? "inline-block"
        : "none";
  }

  if (diagnosticOpen) {
    updateDiagnostic();

    clearInterval(
      diagnosticTimer
    );

    diagnosticTimer =
      setInterval(
        updateDiagnostic,
        1000
      );

  } else {

    clearInterval(
      diagnosticTimer
    );

    diagnosticTimer = null;
  }
}

async function copyDiagnostic() {
  const text =
    buildDiagnosticText();

  try {
    await navigator.clipboard.writeText(
      text
    );

    const button =
      document.getElementById(
        "copyDiagnosticBtn"
      );

    if (button) {
      const oldText =
        button.textContent;

      button.textContent =
        "已复制";

      setTimeout(
        () => {
          button.textContent =
            oldText;
        },
        1200
      );
    }

  } catch (error) {
    console.error(
      "复制诊断信息失败：",
      error
    );
  }
}

window.addEventListener(

async function initServiceWorker() {

  if (!("serviceWorker" in navigator)) {
    showError("当前浏览器不支持 Service Worker。");
    return;
  }


  try {
    await navigator.serviceWorker.register("./sw.js", {
      scope: "./"
    });

    await navigator.serviceWorker.ready;

    serviceWorkerReady = true;

    console.log("Drive streaming Service Worker ready");

  } catch (error) {
    console.error("Service Worker 注册失败", error);
  }
}
  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }


  function showError(text) {
    document.getElementById("error").textContent = text;
  }


  /*
   * 读取 Google Drive Open With 传来的 state
   *
   * 形式类似：
   *
   * {
   *   "ids": ["FILE_ID"],
   *   "resourceKeys": {...},
   *   "action": "open",
   *   "userId": "..."
   * }
   */

  function parseDriveState() {

    const params = new URLSearchParams(window.location.search);
    const rawState = params.get("state");

    if (!rawState) {
      return null;
    }

    try {

      const state = JSON.parse(rawState);

      if (
        state.action === "open" &&
        Array.isArray(state.ids) &&
        state.ids.length > 0
      ) {

        const id = state.ids[0];

        let resourceKey = null;

        if (
          state.resourceKeys &&
          state.resourceKeys[id]
        ) {
          resourceKey = state.resourceKeys[id];
        }

        return {
          fileId: id,
          resourceKey: resourceKey
        };

      }

    } catch (err) {

      console.error("state 解析失败：", err);

    }

    return null;
  }


  /*
   * 初始化 Google OAuth
   */

 window.addEventListener("load", async () => {
   
   await initServiceWorker();

    const driveState = parseDriveState();

    if (driveState) {

      currentFileId = driveState.fileId;

   /*

  captureOAuthSession();

  });

function authorizeDrive() {

  window.location.href =
    OAUTH_BRIDGE + "/auth";

}


  

  /*
   * 从 Drive API 读取视频
   */

  async function openDriveVideo(accessToken) {

    setStatus("正在读取文件信息…");


    try {

      let metadataUrl =
        "https://www.googleapis.com/drive/v3/files/" +
        encodeURIComponent(currentFileId) +
        "?fields=id,name,mimeType,size,capabilities,videoMediaMetadata";


      const headers = {
        "Authorization": "Bearer " + accessToken
      };


      /*
       * 如果 Google Drive Open With 返回 resourceKey，
       * 按官方要求带上对应 header。
       */

      if (currentResourceKey) {

        headers["X-Goog-Drive-Resource-Keys"] =
          currentFileId + "/" + currentResourceKey;

      }


      const metadataResponse =
        await fetch(metadataUrl, {
          headers: headers
        });


      if (!metadataResponse.ok) {

        const text =
          await metadataResponse.text();

        throw new Error(
          "无法读取 Drive 文件信息。\n" +
          "HTTP " +
          metadataResponse.status +
          "\n" +
          text
        );

      }


      const file =
        await metadataResponse.json();
      currentFileSize = Number(file.size);

      /*
       * 如果 Drive 打开的是图片，交给独立的原图相册页面。
       * 保留完整 state，因此多选图片的 ids 不会丢失。
       */
      if (
        file.mimeType &&
        file.mimeType.startsWith("image/")
      ) {
        window.location.replace(
          "./gallery/" + window.location.search
        );
        return;
      }


      if (
        file.capabilities &&
        file.capabilities.canDownload === false
      ) {

        throw new Error(
          "这个 Google Drive 文件禁止下载，因此无法播放原文件。"
        );

      }


      document.getElementById("filename")
        .textContent =
        file.name || "Google Drive Video";


      /*
       * 显示 Drive 提供的视频分辨率
       */

      if (
        file.videoMediaMetadata &&
        file.videoMediaMetadata.width &&
        file.videoMediaMetadata.height
      ) {

        document.getElementById("quality")
          .textContent =
          "Original · " +
          file.videoMediaMetadata.width +
          " × " +
          file.videoMediaMetadata.height;

      } else {

        document.getElementById("quality")
          .textContent =
          "Original · Drive 原文件";

      }


      /*
       * alt=media 获取的是 Drive 中保存的原始 Blob 文件内容，
       * 不是 Google Drive 网页预览转码视频。
       *
       * 注意：
       * video 标签不能添加 Authorization Header，
       * 因此这里使用短期 OAuth access token。
       */

if (!serviceWorkerReady) {
  throw new Error(
    "视频流服务尚未准备完成，请刷新页面后重试。"
  );
}

const registration =
  await navigator.serviceWorker.ready;

const worker =
  navigator.serviceWorker.controller ||
  registration.active;

worker.postMessage({
  type: "SET_TOKEN",
  token: accessToken,
  fileId: currentFileId,
  fileSize: Number(file.size)
});

await new Promise(resolve => setTimeout(resolve, 200));

let mediaUrl =
  "./media/" +
  encodeURIComponent(currentFileId);

if (currentResourceKey) {
  mediaUrl +=
    "?resourceKey=" +
    encodeURIComponent(currentResourceKey);
}


      const player =
        document.getElementById("player");


      player.src = mediaUrl;

      player.addEventListener(
        "loadedmetadata",
        updateDiagnostic
      );

      player.addEventListener(
        "resize",
        updateDiagnostic
      );

      player.addEventListener(
        "timeupdate",
        () => {
          if (diagnosticOpen) {
            updateDiagnostic();
          }
        }
      );


      document.getElementById("welcome")
        .style.display = "none";


      document.getElementById("playerWrap")
        .style.display = "block";


      setStatus("Original");


      player.addEventListener(
        "error",
        () => {

          showError(
            "视频文件已经成功读取，但浏览器无法解码这个视频。\n\n" +
            "最兼容的是：MP4 + H.264/AVC + AAC。\n" +
            "如果是 MKV、HEVC/H.265、DTS、TrueHD 等，" +
            "后面可以再给播放器增加对应方案。"
          );

        },
        { once: true }
      );


      try {

        await player.play();

      } catch (e) {

        // 浏览器阻止自动播放属于正常情况
        console.log(
          "等待用户点击播放：",
          e
        );

      }

    }

    catch (err) {

      console.error(err);

      setStatus("读取失败");

      showError(err.message);

    }

  }

  // 每 30 分钟自动更新一次 Access Token
setInterval(
  refreshWorkerAccessToken,
  30 * 60 * 1000
);

// 页面放后台很久后重新回来时，马上更新
document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      refreshWorkerAccessToken();
    }
  }
);

// 切回这个窗口时也更新
window.addEventListener(
  "focus",
  refreshWorkerAccessToken
);
</script>

</body>
</html>
