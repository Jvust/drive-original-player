<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Original Player · High Quality</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }
    #player {
      object-fit: contain;
    }

    #videoStage {
      position: relative;
      width: 100%;
      background: #000;
      transform-origin: center center;
      transition: transform 0.25s ease;
    }

    #videoStage.rotated {
      transform: rotate(90deg);
    }

    #videoStage.rotated video,
    #videoStage.rotated #gpuCanvas {
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: contain;
    }

    #gpuCanvas {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      pointer-events: none;
    }

    #playerWrap.gpu-active #gpuCanvas {
      display: block;
    }

    #playerWrap.gpu-active #player {
      opacity: 0;
      pointer-events: none;
    }

    #gpuMediaControls {
      display: none;
      align-items: center;
      gap: 9px;
      width: 100%;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 9px;
      background: #151515;
    }

    #playerWrap.gpu-active #gpuMediaControls {
      display: flex;
    }

    #gpuMediaControls button {
      flex: 0 0 auto;
      padding: 8px 11px;
      font-size: 13px;
    }

    #gpuSeek {
      flex: 1 1 auto;
      min-width: 90px;
    }

    #gpuTime {
      flex: 0 0 auto;
      min-width: 105px;
      color: #ccc;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    #gpuVolume {
      width: 90px;
    }

    @media (max-width: 700px) {
      #gpuMediaControls {
        gap: 6px;
        padding: 7px;
      }
      #gpuVolume {
        display: none;
      }
      #gpuTime {
        min-width: 88px;
        font-size: 11px;
      }
    }

    header {
      height: 58px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #151515;
      border-bottom: 1px solid #242424;
    }

    .logo {
      font-size: 16px;
      font-weight: 600;
    }

    #status {
      color: #aaa;
      font-size: 13px;
    }

    main {
      min-height: calc(100vh - 58px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #welcome {
      text-align: center;
    }

    #welcome h1 {
      margin-bottom: 8px;
      font-size: 26px;
    }

    #welcome p {
      color: #999;
      margin-bottom: 24px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 15px;
      cursor: pointer;
      background: #ffffff;
      color: #111111;
    }

    button:hover {
      background: #e8e8e8;
    }

    #playerWrap {
      display: none;
      position: relative;
      width: 100%;
      max-width: 1500px;
    }

    video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 150px);
      background: #000;
    }

    .player-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .player-tools button {
      padding: 9px 14px;
      font-size: 13px;
    }

    /* 批量视频：列表只在用户主动打开时覆盖画面。 */
    #videoQuickControls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 42;
      display: flex;
      gap: 8px;
      opacity: 1;
      visibility: visible;
      transition: opacity .18s ease, visibility .18s ease;
    }

    #videoQuickControls button {
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      background: rgba(20,20,20,.74);
      color: #fff;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 14px rgba(0,0,0,.22);
    }

    #playerWrap.watch-ui-hidden:not(.playlist-open) #videoQuickControls {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #playlistBackdrop {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 44;
      background: rgba(0,0,0,.30);
    }

    #videoPlaylistDrawer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 45;
      width: min(430px, 88vw);
      display: flex;
      flex-direction: column;
      background: rgba(13,13,13,.96);
      border-left: 1px solid rgba(255,255,255,.12);
      box-shadow: -18px 0 45px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
      transform: translateX(102%);
      transition: transform .20s ease;
      pointer-events: none;
    }

    #playerWrap.playlist-open #playlistBackdrop {
      display: block;
    }

    #playerWrap.playlist-open #videoPlaylistDrawer {
      transform: translateX(0);
      pointer-events: auto;
    }

    .playlist-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }

    #playlistTitle {
      min-width: 0;
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-head button {
      padding: 7px 10px;
      font-size: 13px;
    }

    #videoPlaylistItems {
      flex: 1 1 auto;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 8px;
    }

    .video-playlist-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px;
      margin: 0 0 5px;
      border-radius: 9px;
      background: transparent;
      color: #fff;
      text-align: left;
    }

    .video-playlist-item:hover {
      background: rgba(255,255,255,.09);
    }

    .video-playlist-item.active {
      background: rgba(255,255,255,.14);
      outline: 1px solid rgba(255,255,255,.16);
    }

    .video-thumb-wrap {
      position: relative;
      flex: 0 0 112px;
      width: 112px;
      height: 63px;
      overflow: hidden;
      border-radius: 7px;
      background: #222;
    }

    .video-thumb-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .video-thumb-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 22px;
    }

    .video-playlist-meta {
      min-width: 0;
      flex: 1;
    }

    .video-playlist-name {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 13px;
      line-height: 1.35;
    }

    .video-playlist-sub {
      margin-top: 5px;
      color: #919191;
      font-size: 11px;
    }

    .drive-tree-folder {
      margin: 2px 0;
    }

    .drive-folder-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 6px 8px;
      border-radius: 8px;
      background: transparent;
      color: #ddd;
      text-align: left;
      font-size: 13px;
    }

    .drive-folder-row:hover {
      background: rgba(255,255,255,.07);
    }

    .drive-folder-chevron {
      width: 16px;
      flex: 0 0 16px;
      text-align: center;
      color: #8e8e8e;
      font-size: 12px;
      transform: rotate(90deg);
      transition: transform .15s ease;
    }

    .drive-tree-folder.collapsed > .drive-folder-row .drive-folder-chevron {
      transform: rotate(0deg);
    }

    .drive-folder-icon {
      flex: 0 0 auto;
      font-size: 16px;
      line-height: 1;
    }

    .drive-folder-name {
      min-width: 0;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .drive-folder-count {
      flex: 0 0 auto;
      color: #777;
      font-size: 11px;
    }

    .drive-folder-children {
      margin-left: 13px;
      padding-left: 7px;
      border-left: 1px solid rgba(255,255,255,.08);
    }

    .drive-tree-folder.collapsed > .drive-folder-children {
      display: none;
    }

    .video-playlist-item.tree-video {
      margin-left: 0;
    }

    .video-playlist-item.tree-video .video-thumb-wrap {
      flex-basis: 96px;
      width: 96px;
      height: 54px;
    }

    .playlist-foot {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      padding: 10px 12px max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,.10);
    }

    .playlist-foot button {
      flex: 1 1 0;
      padding: 9px 10px;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      #videoQuickControls {
        top: 8px;
        right: 8px;
        gap: 6px;
      }

      #videoQuickControls button {
        padding: 7px 9px;
        font-size: 12px;
      }

      #videoPlaylistDrawer {
        width: min(360px, 90vw);
      }

      .video-thumb-wrap {
        flex-basis: 92px;
        width: 92px;
        height: 52px;
      }
    }

    #diagnosticPanel {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 9px;
      background: #111;
      color: #d8d8d8;
      font-size: 13px;
      line-height: 1.65;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #diagnosticPanel.open {
      display: block;
    }

    /* 沉浸式网页全屏：播放器工具永久退出画面，列表/退出按钮按需唤醒。 */
    #playerWrap:fullscreen,
    #playerWrap:-webkit-full-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: none;
      margin: 0;
      padding: 0;
      background: #000;
      display: flex !important;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #playerWrap:fullscreen #videoStage,
    #playerWrap:-webkit-full-screen #videoStage {
      width: 100vw;
      height: 100vh;
    }

    #playerWrap:fullscreen #videoStage.rotated,
    #playerWrap:-webkit-full-screen #videoStage.rotated {
      width: 100vh;
      height: 100vw;
    }

    #playerWrap:fullscreen video,
    #playerWrap:-webkit-full-screen video {
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: contain;
    }

    /* 这些只用于设置/诊断，全屏观看时不覆盖视频。 */
    #playerWrap:fullscreen .player-tools,
    #playerWrap:fullscreen #diagnosticPanel,
    #playerWrap:fullscreen #info,
    #playerWrap:-webkit-full-screen .player-tools,
    #playerWrap:-webkit-full-screen #diagnosticPanel,
    #playerWrap:-webkit-full-screen #info {
      display: none !important;
    }

    #playerWrap:fullscreen #gpuMediaControls,
    #playerWrap:-webkit-full-screen #gpuMediaControls {
      position: absolute;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 41;
      width: min(900px, calc(100vw - 24px));
      transform: translateX(-50%);
      margin: 0;
      background: rgba(0,0,0,.68);
      backdrop-filter: blur(8px);
    }

    #playerWrap:fullscreen #videoPlaylistDrawer,
    #playerWrap:-webkit-full-screen #videoPlaylistDrawer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      height: 100vh;
    }

    #playerWrap:fullscreen #playlistBackdrop,
    #playerWrap:-webkit-full-screen #playlistBackdrop {
      position: absolute;
      inset: 0;
    }

    /* 全屏无操作时，播放条和两个快捷按钮一起淡出。 */
    #playerWrap:fullscreen #gpuMediaControls,
    #playerWrap:fullscreen #videoQuickControls,
    #playerWrap:-webkit-full-screen #gpuMediaControls,
    #playerWrap:-webkit-full-screen #videoQuickControls {
      opacity: 1;
      visibility: visible;
      transition: opacity .18s ease, visibility .18s ease;
    }

    #playerWrap:fullscreen.fullscreen-ui-hidden:not(.playlist-open) #gpuMediaControls,
    #playerWrap:fullscreen.fullscreen-ui-hidden:not(.playlist-open) #videoQuickControls,
    #playerWrap:-webkit-full-screen.fullscreen-ui-hidden:not(.playlist-open) #gpuMediaControls,
    #playerWrap:-webkit-full-screen.fullscreen-ui-hidden:not(.playlist-open) #videoQuickControls {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #playerWrap:fullscreen.fullscreen-ui-hidden:not(.playlist-open),
    #playerWrap:-webkit-full-screen.fullscreen-ui-hidden:not(.playlist-open) {
      cursor: none;
    }

    #info {
      padding-top: 12px;
    }

    #filename {
      font-size: 14px;
      color: #ddd;
    }

    #quality {
      margin-top: 6px;
      color: #7fd47f;
      font-size: 13px;
    }

    #error {
      max-width: 760px;
      color: #ff8e8e;
      line-height: 1.7;
      margin-top: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<!-- 仅用于浏览器显示端的实时锐化，不修改/转码 Google Drive 原视频。 -->
<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute;left:-9999px;top:-9999px;overflow:hidden">
  <defs>
    <filter id="videoSharpenMild" x="-5%" y="-5%" width="110%" height="110%"
            color-interpolation-filters="sRGB">
      <feConvolveMatrix order="3"
        kernelMatrix="0 -0.15 0 -0.15 1.6 -0.15 0 -0.15 0"
        divisor="1" bias="0" edgeMode="duplicate" preserveAlpha="true" />
    </filter>
    <filter id="videoSharpenStrong" x="-5%" y="-5%" width="110%" height="110%"
            color-interpolation-filters="sRGB">
      <feConvolveMatrix order="3"
        kernelMatrix="0 -0.25 0 -0.25 2 -0.25 0 -0.25 0"
        divisor="1" bias="0" edgeMode="duplicate" preserveAlpha="true" />
    </filter>
  </defs>
</svg>

<header>
  <div class="logo">Drive Original Player</div>
  <div id="status">等待授权</div>
</header>

<main>

  <div id="welcome">
    <h1>Drive Original Player</h1>
    <p>直接读取 Google Drive 中的原始视频文件</p>

    <button id="loginBtn" onclick="authorizeDrive()">
      授权 Google Drive
    </button>

    <div id="error"></div>
  </div>

  <div id="playerWrap">
    <div id="videoStage">
      <video
        id="player"
        controls
        playsinline
        preload="auto"
        controlsList="nodownload">
      </video>
      <canvas id="gpuCanvas" aria-label="WebGPU 视频画面"></canvas>
    </div>

    <div id="videoQuickControls" aria-label="视频快捷控制">
      <button id="videoListBtn" onclick="toggleVideoPlaylist()" title="1433223 文件树">列表</button>
      <button id="fullscreenFab" onclick="toggleWebFullscreen()" title="网页全屏">全屏</button>
    </div>

    <div id="playlistBackdrop" onclick="closeVideoPlaylist()"></div>
    <aside id="videoPlaylistDrawer" aria-label="1433223 视频文件树">
      <div class="playlist-head">
        <div id="playlistTitle">当前文件夹</div>
        <button onclick="closeVideoPlaylist()">关闭</button>
      </div>
      <div id="videoPlaylistItems"></div>
      <div class="playlist-foot">
        <button onclick="playPreviousVideo()">上一条</button>
        <button onclick="playNextVideo()">下一条</button>
      </div>
    </aside>

    <div id="gpuMediaControls">
      <button id="gpuPlayBtn" onclick="gpuTogglePlay()">播放</button>
      <input id="gpuSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度" />
      <span id="gpuTime">00:00 / 00:00</span>
      <button id="gpuMuteBtn" onclick="gpuToggleMute()">静音</button>
      <input id="gpuVolume" type="range" min="0" max="1" value="1" step="0.05" aria-label="音量" />
    </div>

    <div class="player-tools">
      <button id="rotateBtn" onclick="toggleRotate()">
        旋转 90°
      </button>
      <button id="webFullscreenBtn" onclick="toggleWebFullscreen()" title="全屏后控件会自动隐藏；移动鼠标或触摸屏幕可再次显示">
        全屏
      </button>
      <button id="sharpenBtn" onclick="cycleSharpenMode()" title="只改变显示效果，不修改 Google Drive 原视频">
        画质：平衡
      </button>
      <button id="diagnosticBtn" onclick="toggleDiagnostic()">
        画质诊断
      </button>
      <button id="copyDiagnosticBtn" onclick="copyDiagnostic()" style="display:none">
        复制诊断
      </button>
    </div>

    <div id="diagnosticPanel"></div>

    <div id="info">
      <div id="filename"></div>
      <div id="quality"></div>
    </div>
  </div>

</main>

<script>

  /*
   * OAuth 由 Cloudflare Worker /auth 统一处理。
   * 当前 Worker 使用 drive.readonly + drive.install。
   */

  let currentFileId = null;
  let currentResourceKey = null;
  let currentFileSize = null;
  let currentAccessToken = null;
  let videoPlaylist = [];
  let currentVideoIndex = -1;
  let videoTreeRoot = null;
  let videoRootFolder = null;
  const VIDEO_ROOT_FOLDER_NAME = "1433223";
  const expandedVideoFolders = new Set();
  let videoPlayerEventsReady = false;
  let videoUiTimer = null;
  let userActivityFlag = true;
  let activityPollTimer = null;
  let gpuHealthTimer = null;
  let gpuHealthPrevTotal = 0;
  let gpuHealthPrevDropped = 0;
  let performanceFallback =
    sessionStorage.getItem("drive_player_gpu_fallback") === "1";
  const VIDEO_UI_HIDE_DELAY = 2200;

  function detectSmoothDevice() {
    const ua = navigator.userAgent || "";
    const uaMobile = !!(
      navigator.userAgentData &&
      navigator.userAgentData.mobile
    );
    const androidOrMobile =
      /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
    const coarse =
      window.matchMedia &&
      window.matchMedia("(pointer: coarse)").matches;
    const touchTablet =
      coarse &&
      navigator.maxTouchPoints >= 2 &&
      Math.min(screen.width || 9999, screen.height || 9999) <= 1000;

    return uaMobile || androidOrMobile || touchTablet;
  }

  const smoothDeviceMode = detectSmoothDevice();
  let serviceWorkerReady = false;
  const OAUTH_BRIDGE =
  "https://drive-oauth-bridge.143322378jb.workers.dev";

const SESSION_KEY =
  "drive_oauth_session";


function captureOAuthSession() {

  const params =
    new URLSearchParams(
      window.location.hash.substring(1)
    );

  const session =
    params.get("oauth_session");

  if (session) {

    localStorage.setItem(
      SESSION_KEY,
      session
    );

    // 把 session 从地址栏清掉
    history.replaceState(
      null,
      "",
      window.location.pathname +
      window.location.search
    );

    return true;
  }

  return false;
}


async function getBridgeAccessToken() {


  const session =
    localStorage.getItem(
      SESSION_KEY
    );

  if (!session) {
    return null;
  }

  try {

    const response =
      await fetch(
        OAUTH_BRIDGE + "/token",
        {
          method: "GET",

          headers: {
            "Authorization":
              "Bearer " + session
          },

          cache: "no-store"
        }
      );


    if (!response.ok) {

      // Refresh Token 失效等情况
      if (response.status === 401) {
        localStorage.removeItem(
          SESSION_KEY
        );
      }

      return null;
    }


    const data =
      await response.json();

    return (
      data.access_token ||
      null
    );

  } catch (error) {

    console.error(
      "自动获取 Access Token 失败：",
      error
    );

    return null;
  }
}

    let tokenRefreshRunning = false;

async function refreshWorkerAccessToken() {

  if (
    tokenRefreshRunning ||
    !currentFileId ||
    !currentFileSize ||
    !serviceWorkerReady
  ) {
    return;
  }

  tokenRefreshRunning = true;

  try {

    const accessToken =
      await getBridgeAccessToken();

    if (!accessToken) {
      return;
    }

    currentAccessToken = accessToken;

    const registration =
      await navigator.serviceWorker.ready;

    const worker =
      navigator.serviceWorker.controller ||
      registration.active;

    if (!worker) {
      return;
    }

    worker.postMessage({
      type: "SET_TOKEN",
      token: accessToken,
      fileId: currentFileId,
      fileSize: currentFileSize
    });

    console.log(
      "Google Drive Access Token 已自动刷新"
    );

  } catch (error) {

    console.error(
      "自动刷新 Access Token 失败：",
      error
    );

  } finally {

    tokenRefreshRunning = false;

  }
}
  let rotated = false;

function toggleRotate() {
  const stage = document.getElementById("videoStage");

  rotated = !rotated;

  if (rotated) {
    stage.classList.add("rotated");

    if (!getFullscreenElement()) {
      const availableHeight = window.innerHeight - 150;
      const availableWidth = window.innerWidth - 60;
      stage.style.width = availableHeight + "px";
      stage.style.height = availableWidth + "px";
      stage.style.maxWidth = "none";
      stage.style.maxHeight = "none";
    }
  } else {
    stage.classList.remove("rotated");
    stage.style.width = "";
    stage.style.height = "";
    stage.style.maxWidth = "";
    stage.style.maxHeight = "";
  }

  setTimeout(() => {
    syncGpuCanvasSize();
    renderGpuFrame();
    updateDiagnostic();
  }, 100);
}

/*
 * ==========================================
 * WebGPU 视频渲染层
 * ==========================================
 *
 * 最终渲染架构：
 * - Google Drive / Service Worker：原文件 + Range
 * - <video>：浏览器成熟的硬件解码、音频、时间轴和 seek
 * - WebGPU：作为默认画面输出层，负责 GPU 显示和边缘自适应锐化
 *
 * 不再提供 A / B / GPU 开关。
 * WebGPU 不可用或设备丢失时，仅作为安全措施自动回退到原生 <video>。
 */
let gpuActive = false;
let gpuInitializing = false;
let gpuAdapter = null;
let gpuDevice = null;
let gpuContext = null;
let gpuPipeline = null;
let gpuSampler = null;
let gpuUniformBuffer = null;
let gpuFormat = null;
let gpuFrameHandle = null;
let gpuRafHandle = null;
let gpuLastError = "";
let gpuSeeking = false;
let gpuColorSpace = "srgb";
let gpuScaleMode = "native";
let gpuLastScaleRatio = 1;

let sharpenMode = 1;
const SHARPEN_LABELS = ["原始", "平衡", "清晰"];
const SHARPEN_FILTERS = [
  "none",
  'url("#videoSharpenMild")',
  'url("#videoSharpenStrong")'
];
// “原始”只关闭额外锐化；智能缩放仍保留高质量重采样。
// 平衡/清晰使用较克制的 RCAS-style 强度，避免 halo。
const GPU_SHARPEN_STRENGTH = [0.0, 0.30, 0.52];

function gpuSupported() {
  return !!(navigator.gpu && HTMLCanvasElement.prototype.getContext);
}

function setGpuButton(text) {
  // 最终版不再显示 GPU 开关；保留函数仅用于兼容内部状态调用。
}

function setGpuUiActive(active) {
  const wrap = document.getElementById("playerWrap");
  const player = document.getElementById("player");

  wrap.classList.toggle("gpu-active", active);

  // GPU 模式使用自己的简洁控制条；关闭后恢复浏览器原生 controls。
  player.controls = !active;

  syncGpuMediaControls();
}

async function initWebGPU() {
  if (gpuDevice && gpuPipeline && gpuContext) {
    return true;
  }

  if (!gpuSupported()) {
    gpuLastError = "当前浏览器没有 WebGPU。";
    return false;
  }

  try {
    gpuAdapter = await navigator.gpu.requestAdapter({
      powerPreference: "high-performance"
    });

    if (!gpuAdapter) {
      throw new Error("没有可用的 WebGPU GPU Adapter。");
    }

    gpuDevice = await gpuAdapter.requestDevice();
    gpuFormat = navigator.gpu.getPreferredCanvasFormat();

    const canvas = document.getElementById("gpuCanvas");
    gpuContext = canvas.getContext("webgpu");

    if (!gpuContext) {
      throw new Error("无法创建 WebGPU Canvas Context。");
    }

    // 屏幕和浏览器都支持时优先使用 Display-P3；失败则安全回退 sRGB。
    gpuColorSpace =
      window.matchMedia &&
      window.matchMedia("(color-gamut: p3)").matches
        ? "display-p3"
        : "srgb";

    try {
      gpuContext.configure({
        device: gpuDevice,
        format: gpuFormat,
        alphaMode: "opaque",
        colorSpace: gpuColorSpace
      });
    } catch (_) {
      gpuColorSpace = "srgb";
      gpuContext.configure({
        device: gpuDevice,
        format: gpuFormat,
        alphaMode: "opaque"
      });
    }

    gpuSampler = gpuDevice.createSampler({
      magFilter: "linear",
      minFilter: "linear"
    });

    // Params: texel(vec2) + sourcePerOutput(vec2) + strength + mode + padding(vec2) = 32 bytes
    gpuUniformBuffer = gpuDevice.createBuffer({
      size: 32,
      usage:
        GPUBufferUsage.UNIFORM |
        GPUBufferUsage.COPY_DST
    });

    const shader = gpuDevice.createShaderModule({
      code: `struct Params {
  texel: vec2f,
  sourcePerOutput: vec2f,
  strength: f32,
  mode: f32,
  padding: vec2f,
};

@group(0) @binding(0)
var videoSampler: sampler;

@group(0) @binding(1)
var videoTexture: texture_external;

@group(0) @binding(2)
var<uniform> params: Params;

struct VertexOut {
  @builtin(position) position: vec4f,
  @location(0) uv: vec2f,
};

@vertex
fn vsMain(@builtin(vertex_index) index: u32) -> VertexOut {
  var positions = array<vec2f, 3>(
    vec2f(-1.0, -1.0),
    vec2f( 3.0, -1.0),
    vec2f(-1.0,  3.0)
  );

  var uvs = array<vec2f, 3>(
    vec2f(0.0, 1.0),
    vec2f(2.0, 1.0),
    vec2f(0.0, -1.0)
  );

  var output: VertexOut;
  output.position = vec4f(positions[index], 0.0, 1.0);
  output.uv = uvs[index];
  return output;
}

fn sampleVideo(uv: vec2f) -> vec4f {
  return textureSampleBaseClampToEdge(
    videoTexture,
    videoSampler,
    uv
  );
}

fn luma(c: vec3f) -> f32 {
  return dot(c, vec3f(0.2126, 0.7152, 0.0722));
}

fn toLinear1(c: f32) -> f32 {
  if (c <= 0.04045) {
    return c / 12.92;
  }
  return pow((c + 0.055) / 1.055, 2.4);
}

fn toGamma1(c: f32) -> f32 {
  let v = max(c, 0.0);
  if (v <= 0.0031308) {
    return v * 12.92;
  }
  return 1.055 * pow(v, 1.0 / 2.4) - 0.055;
}

fn toLinear(c: vec3f) -> vec3f {
  return vec3f(toLinear1(c.r), toLinear1(c.g), toLinear1(c.b));
}

fn toGamma(c: vec3f) -> vec3f {
  return vec3f(toGamma1(c.r), toGamma1(c.g), toGamma1(c.b));
}

fn adaptiveSharpen(
  center: vec3f,
  left: vec3f,
  right: vec3f,
  up: vec3f,
  down: vec3f,
  strength: f32
) -> vec3f {
  if (strength <= 0.001) {
    return center;
  }

  let localMin = min(center, min(min(left, right), min(up, down)));
  let localMax = max(center, max(max(left, right), max(up, down)));
  let rangeRGB = localMax - localMin;
  let rangeV = max(rangeRGB.r, max(rangeRGB.g, rangeRGB.b));

  // RCAS-style 思路：低/中对比纹理增强更多，强边缘保护更多。
  let edgeProtect = 1.0 - smoothstep(0.16, 0.58, rangeV);
  let blur = (left + right + up + down) * 0.25;
  let detail = center - blur;
  let gain = strength * (0.68 + 0.32 * edgeProtect);
  let candidate = center + detail * gain;

  let margin = vec3f(0.018 + 0.018 * strength);
  return clamp(
    candidate,
    max(vec3f(0.0), localMin - margin),
    min(vec3f(1.0), localMax + margin)
  );
}

fn highQualityDownscale(uv: vec2f) -> vec3f {
  // sourcePerOutput > 1 表示一个输出像素覆盖多个源像素。
  // 在 gamma 解码后的线性光空间做 13-tap 重采样，减少缩小时的锯齿和闪烁。
  let footprint = clamp(
    max(params.sourcePerOutput.x, params.sourcePerOutput.y),
    1.0,
    4.0
  );

  let rx = vec2f(params.texel.x * footprint * 0.58, 0.0);
  let ry = vec2f(0.0, params.texel.y * footprint * 0.58);
  let ox = vec2f(params.texel.x * footprint * 1.16, 0.0);
  let oy = vec2f(0.0, params.texel.y * footprint * 1.16);

  var sum = toLinear(sampleVideo(uv).rgb) * 0.20;

  sum += toLinear(sampleVideo(uv + rx).rgb) * 0.105;
  sum += toLinear(sampleVideo(uv - rx).rgb) * 0.105;
  sum += toLinear(sampleVideo(uv + ry).rgb) * 0.105;
  sum += toLinear(sampleVideo(uv - ry).rgb) * 0.105;

  sum += toLinear(sampleVideo(uv + rx + ry).rgb) * 0.060;
  sum += toLinear(sampleVideo(uv + rx - ry).rgb) * 0.060;
  sum += toLinear(sampleVideo(uv - rx + ry).rgb) * 0.060;
  sum += toLinear(sampleVideo(uv - rx - ry).rgb) * 0.060;

  sum += toLinear(sampleVideo(uv + ox).rgb) * 0.035;
  sum += toLinear(sampleVideo(uv - ox).rgb) * 0.035;
  sum += toLinear(sampleVideo(uv + oy).rgb) * 0.035;
  sum += toLinear(sampleVideo(uv - oy).rgb) * 0.035;

  return toGamma(sum);
}

fn edgeAdaptiveUpscale(uv: vec2f) -> vec3f {
  let center = sampleVideo(uv).rgb;
  let dx = vec2f(params.texel.x, 0.0);
  let dy = vec2f(0.0, params.texel.y);

  let left = sampleVideo(uv - dx).rgb;
  let right = sampleVideo(uv + dx).rgb;
  let up = sampleVideo(uv - dy).rgb;
  let down = sampleVideo(uv + dy).rgb;

  let gx = luma(right) - luma(left);
  let gy = luma(down) - luma(up);
  let grad = sqrt(gx * gx + gy * gy);

  var tangent = vec2f(1.0, 0.0);
  if (grad > 0.0001) {
    tangent = normalize(vec2f(-gy, gx));
  }

  // EASU-style：沿边缘切线取样，在放大时优先维持边缘连续性。
  let t = tangent * params.texel;
  let edgeNear =
    (sampleVideo(uv + t * 0.55).rgb +
     sampleVideo(uv - t * 0.55).rgb) * 0.5;
  let edgeFar =
    (sampleVideo(uv + t * 1.10).rgb +
     sampleVideo(uv - t * 1.10).rgb) * 0.5;

  let edgeWeight = smoothstep(0.018, 0.20, grad);
  let reconstructed = mix(
    center,
    edgeNear * 0.72 + edgeFar * 0.28,
    edgeWeight * 0.34
  );

  return adaptiveSharpen(
    reconstructed,
    left,
    right,
    up,
    down,
    params.strength
  );
}

@fragment
fn fsMain(input: VertexOut) -> @location(0) vec4f {
  let center = sampleVideo(input.uv);

  // mode: 0=接近1:1，1=放大，2=缩小
  if (params.mode > 1.5) {
    let base = highQualityDownscale(input.uv);
    let dx = vec2f(params.texel.x * max(params.sourcePerOutput.x, 1.0), 0.0);
    let dy = vec2f(0.0, params.texel.y * max(params.sourcePerOutput.y, 1.0));

    // 缩小后只做非常轻的 RCAS-style 收尾，避免过锐。
    let sharpened = adaptiveSharpen(
      base,
      sampleVideo(input.uv - dx).rgb,
      sampleVideo(input.uv + dx).rgb,
      sampleVideo(input.uv - dy).rgb,
      sampleVideo(input.uv + dy).rgb,
      params.strength * 0.42
    );
    return vec4f(sharpened, center.a);
  }

  if (params.mode > 0.5) {
    return vec4f(edgeAdaptiveUpscale(input.uv), center.a);
  }

  if (params.strength <= 0.001) {
    return center;
  }

  let dx = vec2f(params.texel.x, 0.0);
  let dy = vec2f(0.0, params.texel.y);
  let sharpened = adaptiveSharpen(
    center.rgb,
    sampleVideo(input.uv - dx).rgb,
    sampleVideo(input.uv + dx).rgb,
    sampleVideo(input.uv - dy).rgb,
    sampleVideo(input.uv + dy).rgb,
    params.strength * 0.55
  );

  return vec4f(sharpened, center.a);
}
`
    });

    gpuPipeline = gpuDevice.createRenderPipeline({
      layout: "auto",
      vertex: {
        module: shader,
        entryPoint: "vsMain"
      },
      fragment: {
        module: shader,
        entryPoint: "fsMain",
        targets: [{ format: gpuFormat }]
      },
      primitive: {
        topology: "triangle-list"
      }
    });

    gpuDevice.lost.then(info => {
      gpuLastError =
        "WebGPU 设备已丢失：" +
        (info.message || info.reason || "unknown");

      console.error(gpuLastError);
      disableWebGPUEnhancement(true);
    });

    return true;
  } catch (error) {
    gpuLastError = error.message || String(error);
    console.error("WebGPU 初始化失败：", error);
    return false;
  }
}

function syncGpuCanvasSize() {
  const canvas = document.getElementById("gpuCanvas");
  const stage = document.getElementById("videoStage");

  if (!canvas || !stage) return;

  const rect = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  const width = Math.max(1, Math.round(rect.width * dpr));
  const height = Math.max(1, Math.round(rect.height * dpr));

  if (canvas.width !== width) canvas.width = width;
  if (canvas.height !== height) canvas.height = height;
}

function getGpuViewport() {
  const canvas = document.getElementById("gpuCanvas");
  const player = document.getElementById("player");

  const cw = canvas.width || 1;
  const ch = canvas.height || 1;
  const vw = player.videoWidth || cw;
  const vh = player.videoHeight || ch;

  const canvasAspect = cw / ch;
  const videoAspect = vw / vh;

  let width = cw;
  let height = ch;
  let x = 0;
  let y = 0;

  if (canvasAspect > videoAspect) {
    height = ch;
    width = height * videoAspect;
    x = (cw - width) / 2;
  } else {
    width = cw;
    height = width / videoAspect;
    y = (ch - height) / 2;
  }

  return { x, y, width, height };
}

function getSmartGpuMode(viewport, player) {
  const outputW = Math.max(1, viewport.width);
  const outputH = Math.max(1, viewport.height);
  const sourceW = Math.max(1, player.videoWidth);
  const sourceH = Math.max(1, player.videoHeight);

  const scaleX = outputW / sourceW;
  const scaleY = outputH / sourceH;
  const displayScale = Math.min(scaleX, scaleY);

  gpuLastScaleRatio = displayScale;

  if (displayScale > 1.05) {
    gpuScaleMode = "upscale";
    return 1;
  }

  if (displayScale < 0.95) {
    gpuScaleMode = "downscale";
    return 2;
  }

  gpuScaleMode = "native";
  return 0;
}

function renderGpuFrame() {
  if (
    !gpuActive ||
    !gpuDevice ||
    !gpuContext ||
    !gpuPipeline
  ) {
    return;
  }

  const player = document.getElementById("player");

  if (
    !player ||
    player.readyState < 2 ||
    !player.videoWidth ||
    !player.videoHeight
  ) {
    return;
  }

  try {
    syncGpuCanvasSize();
    const viewport = getGpuViewport();
    const mode = getSmartGpuMode(viewport, player);

    const externalTexture =
      gpuDevice.importExternalTexture({
        source: player,
        colorSpace: gpuColorSpace
      });

    const sourcePerOutputX =
      player.videoWidth / Math.max(1, viewport.width);
    const sourcePerOutputY =
      player.videoHeight / Math.max(1, viewport.height);

    const uniformData = new Float32Array([
      1 / player.videoWidth,
      1 / player.videoHeight,
      sourcePerOutputX,
      sourcePerOutputY,
      GPU_SHARPEN_STRENGTH[sharpenMode] || 0,
      mode,
      0,
      0
    ]);

    gpuDevice.queue.writeBuffer(
      gpuUniformBuffer,
      0,
      uniformData
    );

    const bindGroup = gpuDevice.createBindGroup({
      layout: gpuPipeline.getBindGroupLayout(0),
      entries: [
        {
          binding: 0,
          resource: gpuSampler
        },
        {
          binding: 1,
          resource: externalTexture
        },
        {
          binding: 2,
          resource: {
            buffer: gpuUniformBuffer
          }
        }
      ]
    });

    const encoder = gpuDevice.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [
        {
          view: gpuContext
            .getCurrentTexture()
            .createView(),
          clearValue: {
            r: 0,
            g: 0,
            b: 0,
            a: 1
          },
          loadOp: "clear",
          storeOp: "store"
        }
      ]
    });

    pass.setViewport(
      viewport.x,
      viewport.y,
      viewport.width,
      viewport.height,
      0,
      1
    );

    pass.setScissorRect(
      Math.max(0, Math.floor(viewport.x)),
      Math.max(0, Math.floor(viewport.y)),
      Math.max(1, Math.floor(viewport.width)),
      Math.max(1, Math.floor(viewport.height))
    );

    pass.setPipeline(gpuPipeline);
    pass.setBindGroup(0, bindGroup);
    pass.draw(3);
    pass.end();

    gpuDevice.queue.submit([
      encoder.finish()
    ]);
  } catch (error) {
    gpuLastError = error.message || String(error);
    console.error("WebGPU 视频帧渲染失败：", error);

    // 发生兼容性错误时，自动退回浏览器原生视频。
    disableWebGPUEnhancement(true);
  }
}

function scheduleGpuFrames() {
  cancelGpuFrames();

  const player = document.getElementById("player");

  if (!gpuActive || !player) return;

  if (typeof player.requestVideoFrameCallback === "function") {
    const frame = () => {
      if (!gpuActive) return;
      renderGpuFrame();
      gpuFrameHandle = player.requestVideoFrameCallback(frame);
    };

    gpuFrameHandle = player.requestVideoFrameCallback(frame);
  } else {
    const frame = () => {
      if (!gpuActive) return;
      renderGpuFrame();
      gpuRafHandle = requestAnimationFrame(frame);
    };

    gpuRafHandle = requestAnimationFrame(frame);
  }
}

function cancelGpuFrames() {
  const player = document.getElementById("player");

  if (
    gpuFrameHandle !== null &&
    player &&
    typeof player.cancelVideoFrameCallback === "function"
  ) {
    try {
      player.cancelVideoFrameCallback(gpuFrameHandle);
    } catch (_) {}
  }

  if (gpuRafHandle !== null) {
    cancelAnimationFrame(gpuRafHandle);
  }

  gpuFrameHandle = null;
  gpuRafHandle = null;
}

async function enableWebGPUEnhancement() {
  if (gpuActive || gpuInitializing) return;

  gpuInitializing = true;
  setStatus("Original · 正在启动高质量渲染");

  const ok = await initWebGPU();

  gpuInitializing = false;

  if (!ok) {
    setStatus("Original · 浏览器原生渲染");
    showError(
      "当前浏览器无法启用 WebGPU 高质量渲染，已自动使用原生视频渲染。\n" +
      (gpuLastError || "当前设备/浏览器可能不支持 WebGPU 视频外部纹理。")
    );
    return;
  }

  showError("");
  gpuActive = true;
  setGpuUiActive(true);
  setStatus("Original · WebGPU 智能高质量渲染");

  // WebGPU 自己完成画质增强，不再叠加 SVG filter。
  const player = document.getElementById("player");
  player.style.filter = "none";
  player.style.webkitFilter = "none";

  syncGpuCanvasSize();
  renderGpuFrame();
  scheduleGpuFrames();
  updateDiagnostic();
}

function disableWebGPUEnhancement(fromError = false) {
  gpuActive = false;
  cancelGpuFrames();
  setGpuUiActive(false);

  setStatus(
    fromError
      ? "Original · 已回退原生渲染"
      : "Original · 浏览器原生渲染"
  );

  // WebGPU 不可用时，SVG 锐化只作为兼容性 fallback。
  applySharpenMode();
  updateDiagnostic();
}

function applySharpenMode() {
  const player = document.getElementById("player");
  const button = document.getElementById("sharpenBtn");

  if (!player) return;

  if (smoothDeviceMode || performanceFallback) {
    sharpenMode = 0;
    player.style.filter = "none";
    player.style.webkitFilter = "none";
    if (button) {
      button.textContent = performanceFallback
        ? "画质：流畅（自动）"
        : "画质：流畅";
    }
    updateDiagnostic();
    return;
  }

  if (gpuActive) {
    // WebGPU shader 负责锐化；不要再给视频本身叠加 SVG filter。
    player.style.filter = "none";
    player.style.webkitFilter = "none";
    renderGpuFrame();
  } else {
    const value = SHARPEN_FILTERS[sharpenMode] || "none";
    player.style.filter = value;
    player.style.webkitFilter = value;
  }

  if (button) {
    button.textContent =
      "画质：" + SHARPEN_LABELS[sharpenMode];
  }

  updateDiagnostic();
}

function cycleSharpenMode() {
  if (smoothDeviceMode) {
    applySharpenMode();
    return;
  }

  sharpenMode =
    (sharpenMode + 1) %
    SHARPEN_LABELS.length;

  applySharpenMode();
}

function gpuTogglePlay() {
  const player = document.getElementById("player");
  if (!player) return;

  if (player.paused) {
    player.play().catch(error => {
      console.error("播放失败：", error);
    });
  } else {
    player.pause();
  }
}

function gpuToggleMute() {
  const player = document.getElementById("player");
  if (!player) return;

  player.muted = !player.muted;
  syncGpuMediaControls();
}

function syncGpuMediaControls() {
  const player = document.getElementById("player");
  const playButton = document.getElementById("gpuPlayBtn");
  const muteButton = document.getElementById("gpuMuteBtn");
  const seek = document.getElementById("gpuSeek");
  const volume = document.getElementById("gpuVolume");
  const time = document.getElementById("gpuTime");

  if (!player) return;

  if (playButton) {
    playButton.textContent =
      player.paused ? "播放" : "暂停";
  }

  if (muteButton) {
    muteButton.textContent =
      player.muted || player.volume === 0
        ? "取消静音"
        : "静音";
  }

  if (volume && document.activeElement !== volume) {
    volume.value = String(player.volume);
  }

  if (
    seek &&
    !gpuSeeking &&
    Number.isFinite(player.duration) &&
    player.duration > 0
  ) {
    seek.value = String(
      Math.round(
        (player.currentTime / player.duration) * 1000
      )
    );
  }

  if (time) {
    time.textContent =
      formatSeconds(player.currentTime) +
      " / " +
      formatSeconds(player.duration);
  }
}

function initGpuMediaControls() {
  const player = document.getElementById("player");
  const seek = document.getElementById("gpuSeek");
  const volume = document.getElementById("gpuVolume");

  if (!player || player.dataset.gpuControlsReady === "1") {
    return;
  }

  player.dataset.gpuControlsReady = "1";

  [
    "play",
    "pause",
    "timeupdate",
    "durationchange",
    "volumechange",
    "loadedmetadata"
  ].forEach(eventName => {
    player.addEventListener(
      eventName,
      syncGpuMediaControls
    );
  });

  player.addEventListener("seeked", () => {
    renderGpuFrame();
    syncGpuMediaControls();
  });

  player.addEventListener("loadeddata", () => {
    renderGpuFrame();
  });

  if (seek) {
    seek.addEventListener("pointerdown", () => {
      gpuSeeking = true;
    });

    seek.addEventListener("input", () => {
      if (
        Number.isFinite(player.duration) &&
        player.duration > 0
      ) {
        const next =
          (Number(seek.value) / 1000) *
          player.duration;

        const time = document.getElementById("gpuTime");
        if (time) {
          time.textContent =
            formatSeconds(next) +
            " / " +
            formatSeconds(player.duration);
        }
      }
    });

    const commitSeek = () => {
      if (
        Number.isFinite(player.duration) &&
        player.duration > 0
      ) {
        player.currentTime =
          (Number(seek.value) / 1000) *
          player.duration;
      }
      gpuSeeking = false;
    };

    seek.addEventListener("change", commitSeek);
    seek.addEventListener("pointerup", commitSeek);
  }

  if (volume) {
    volume.addEventListener("input", () => {
      player.volume = Number(volume.value);
      if (player.volume > 0) player.muted = false;
    });
  }

  syncGpuMediaControls();
}


let fullscreenUiTimer = null;
const FULLSCREEN_UI_HIDE_DELAY = 2000;

function isPlayerFullscreen() {
  const fullscreenElement = getFullscreenElement();
  const wrap = document.getElementById("playerWrap");
  return !!(fullscreenElement && wrap && fullscreenElement === wrap);
}

function hideFullscreenUi() {
  const wrap = document.getElementById("playerWrap");
  if (!wrap || !isPlayerFullscreen() || wrap.classList.contains("playlist-open")) return;
  wrap.classList.add("fullscreen-ui-hidden");
}

function showFullscreenUi() {
  const wrap = document.getElementById("playerWrap");
  if (!wrap || !isPlayerFullscreen()) return;
  wrap.classList.remove("fullscreen-ui-hidden");
  clearTimeout(fullscreenUiTimer);
  if (!wrap.classList.contains("playlist-open")) {
    fullscreenUiTimer = setTimeout(hideFullscreenUi, FULLSCREEN_UI_HIDE_DELAY);
  }
}

function resetFullscreenUiState() {
  const wrap = document.getElementById("playerWrap");
  clearTimeout(fullscreenUiTimer);
  fullscreenUiTimer = null;
  if (!wrap) return;
  wrap.classList.remove("fullscreen-ui-hidden");
  if (isPlayerFullscreen()) showFullscreenUi();
}

function markUserActivity() {
  userActivityFlag = true;
}

function setWatchUiActive() {
  const wrap = document.getElementById("playerWrap");
  if (!wrap) return;

  wrap.classList.remove("watch-ui-hidden");
  clearTimeout(videoUiTimer);

  if (!wrap.classList.contains("playlist-open")) {
    videoUiTimer = setTimeout(() => {
      if (!userActivityFlag && !wrap.classList.contains("playlist-open")) {
        wrap.classList.add("watch-ui-hidden");
      }
    }, VIDEO_UI_HIDE_DELAY);
  }

  if (isPlayerFullscreen()) showFullscreenUi();
}

function showWatchUi() {
  markUserActivity();
  setWatchUiActive();
}

function initFullscreenAutoHide() {
  const wrap = document.getElementById("playerWrap");
  if (!wrap || wrap.dataset.fullscreenAutoHide === "1") return;
  wrap.dataset.fullscreenAutoHide = "1";

  // 参考 Video.js 的 userActive 思路：高频事件只打标记，
  // 统一由低频轮询处理，避免 pointermove 每次都重建 timeout。
  const report = () => markUserActivity();
  ["mousemove", "pointermove", "touchstart", "touchmove", "pointerdown"].forEach(type => {
    wrap.addEventListener(type, report, { passive: true });
  });

  if (!activityPollTimer) {
    activityPollTimer = setInterval(() => {
      if (!userActivityFlag) return;
      userActivityFlag = false;
      setWatchUiActive();
    }, 250);
  }

  document.addEventListener("keydown", event => {
    if (event.key !== "Escape") markUserActivity();
    if (isPlayerFullscreen() && event.key !== "Escape") showFullscreenUi();
  });
}

function getFullscreenElement() {
  return (
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    null
  );
}

async function toggleWebFullscreen() {
  const wrap =
    document.getElementById("playerWrap");

  if (!wrap) return;

  try {
    if (!getFullscreenElement()) {
      if (wrap.requestFullscreen) {
        await wrap.requestFullscreen();
      } else if (wrap.webkitRequestFullscreen) {
        wrap.webkitRequestFullscreen();
      } else {
        throw new Error("当前浏览器不支持网页全屏。");
      }
    } else {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  } catch (error) {
    console.error("网页全屏切换失败：", error);
    showError(
      "网页全屏切换失败：" +
      (error.message || String(error))
    );
  }
}

function updateWebFullscreenButton() {
  const fullscreen = !!getFullscreenElement();
  const button = document.getElementById("webFullscreenBtn");
  const fab = document.getElementById("fullscreenFab");

  if (button) button.textContent = fullscreen ? "退出全屏" : "全屏";
  if (fab) fab.textContent = fullscreen ? "退出" : "全屏";

  if (fullscreen) {
    const active = document.activeElement;
    if (active && typeof active.blur === "function") active.blur();
  }

  resetFullscreenUiState();
  showWatchUi();

  setTimeout(
    () => {
      if (rotated) {
        const stage = document.getElementById("videoStage");
        if (getFullscreenElement()) {
          stage.style.width = "";
          stage.style.height = "";
        } else {
          stage.style.width =
            (window.innerHeight - 150) + "px";
          stage.style.height =
            (window.innerWidth - 60) + "px";
        }
      }

      syncGpuCanvasSize();
      renderGpuFrame();
      updateDiagnostic();
    },
    100
  );
}

function formatSeconds(value) {
  if (!Number.isFinite(value)) return "—";

  const total = Math.max(0, Math.floor(value));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const seconds = total % 60;

  if (hours > 0) {
    return (
      String(hours).padStart(2, "0") + ":" +
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0")
    );
  }

  return (
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0")
  );
}

function getBufferedAhead(player) {
  try {
    const current = player.currentTime;

    for (let i = 0; i < player.buffered.length; i++) {
      const start = player.buffered.start(i);
      const end = player.buffered.end(i);

      if (current >= start && current <= end) {
        return Math.max(0, end - current);
      }
    }
  } catch (error) {
    console.debug("读取缓冲区失败：", error);
  }

  return 0;
}

function buildDiagnosticText() {
  const player = document.getElementById("player");

  if (!player) {
    return "播放器尚未初始化。";
  }

  const rect = player.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  const sourceWidth = player.videoWidth || 0;
  const sourceHeight = player.videoHeight || 0;

  const cssWidth = Math.round(rect.width);
  const cssHeight = Math.round(rect.height);

  const physicalWidth = Math.round(rect.width * dpr);
  const physicalHeight = Math.round(rect.height * dpr);

  const widthScale =
    sourceWidth > 0
      ? physicalWidth / sourceWidth
      : NaN;

  const heightScale =
    sourceHeight > 0
      ? physicalHeight / sourceHeight
      : NaN;

  const effectiveScale =
    Number.isFinite(widthScale) &&
    Number.isFinite(heightScale)
      ? Math.min(widthScale, heightScale)
      : NaN;

  let scalingText = "等待视频元数据";

  if (Number.isFinite(effectiveScale)) {
    if (effectiveScale < 0.98) {
      scalingText =
        "浏览器正在缩小显示（" +
        Math.round(effectiveScale * 100) +
        "%）";
    } else if (effectiveScale > 1.02) {
      scalingText =
        "浏览器正在放大显示（" +
        Math.round(effectiveScale * 100) +
        "%）";
    } else {
      scalingText = "接近 1:1 物理像素显示";
    }
  }

  const bufferedAhead = getBufferedAhead(player);

  const readyStateMap = {
    0: "0 · HAVE_NOTHING",
    1: "1 · HAVE_METADATA",
    2: "2 · HAVE_CURRENT_DATA",
    3: "3 · HAVE_FUTURE_DATA",
    4: "4 · HAVE_ENOUGH_DATA"
  };

  const networkStateMap = {
    0: "0 · NETWORK_EMPTY",
    1: "1 · NETWORK_IDLE",
    2: "2 · NETWORK_LOADING",
    3: "3 · NETWORK_NO_SOURCE"
  };

  return [
    "【视频画质诊断】",
    "",
    "源视频分辨率：  " +
      (sourceWidth && sourceHeight
        ? sourceWidth + " × " + sourceHeight
        : "等待元数据"),
    "CSS 显示尺寸：  " +
      cssWidth + " × " + cssHeight,
    "屏幕 DPR：       " +
      dpr.toFixed(2),
    "约等效物理像素： " +
      physicalWidth + " × " + physicalHeight,
    "缩放判断：       " +
      scalingText,
    "画面增强：       " +
      SHARPEN_LABELS[sharpenMode],
    "渲染模式：       " +
      (gpuActive ? "WebGPU 智能缩放 Shader" : "浏览器原生 <video>"),
    "智能缩放：       " +
      (gpuActive
        ? (gpuScaleMode === "upscale"
            ? "EASU-style 边缘自适应放大 + RCAS-style"
            : gpuScaleMode === "downscale"
              ? "线性光 13-tap 高质量缩小 + RCAS-style"
              : "接近 1:1 · 轻量保真")
        : "未启用"),
    "GPU缩放倍率：    " +
      (gpuActive ? gpuLastScaleRatio.toFixed(2) + "×" : "—"),
    "输出色域：       " +
      (gpuActive ? gpuColorSpace : "由浏览器原生视频决定"),
    "Seek Rescue：     " +
      getSeekRescueDiagnosticText(),
    "WebGPU：          " +
      (gpuSupported() ? (gpuActive ? "已启用" : "可用") : "不支持"),
    gpuLastError
      ? "GPU最近错误：    " + gpuLastError
      : "GPU最近错误：    无",
    "",
    "当前时间：       " +
      formatSeconds(player.currentTime),
    "视频总时长：     " +
      formatSeconds(player.duration),
    "前向缓冲：       " +
      bufferedAhead.toFixed(1) + " 秒",
    "播放速度：       " +
      player.playbackRate.toFixed(2) + "×",
    "readyState：     " +
      (readyStateMap[player.readyState] || player.readyState),
    "networkState：   " +
      (networkStateMap[player.networkState] || player.networkState),
    (() => {
      try {
        if (typeof player.getVideoPlaybackQuality === "function") {
          const q = player.getVideoPlaybackQuality();
          return (
            "视频帧统计：     " +
            q.totalVideoFrames +
            " 总帧 / " +
            q.droppedVideoFrames +
            " 丢帧"
          );
        }
      } catch (_) {}
      return "视频帧统计：     —";
    })(),
    "",
    "说明：Drive 端仍读取原文件；视频解码交给浏览器成熟的硬件媒体栈。",
    "WebGPU 会按物理显示尺寸自动选择 1:1、边缘自适应放大或线性光高质量缩小；",
    "手机/平板和持续掉帧设备仍自动使用原生 <video>，优先保证流畅。",
    "异常 MP4 若原生 Seek 卡住，会自动启用 MP4Box + MSE Seek Rescue；不会重新编码。"
  ].join("\n");
}

function updateDiagnostic() {
  const panel =
    document.getElementById("diagnosticPanel");

  if (!panel || !diagnosticOpen) {
    return;
  }

  panel.textContent =
    buildDiagnosticText();
}

function toggleDiagnostic() {
  const panel =
    document.getElementById("diagnosticPanel");

  const copyButton =
    document.getElementById("copyDiagnosticBtn");

  diagnosticOpen =
    !diagnosticOpen;

  panel.classList.toggle(
    "open",
    diagnosticOpen
  );

  if (copyButton) {
    copyButton.style.display =
      diagnosticOpen
        ? "inline-block"
        : "none";
  }

  if (diagnosticOpen) {
    updateDiagnostic();

    clearInterval(
      diagnosticTimer
    );

    diagnosticTimer =
      setInterval(
        updateDiagnostic,
        1000
      );

  } else {

    clearInterval(
      diagnosticTimer
    );

    diagnosticTimer = null;
  }
}

async function copyDiagnostic() {
  const text =
    buildDiagnosticText();

  try {
    await navigator.clipboard.writeText(
      text
    );

    const button =
      document.getElementById(
        "copyDiagnosticBtn"
      );

    if (button) {
      const oldText =
        button.textContent;

      button.textContent =
        "已复制";

      setTimeout(
        () => {
          button.textContent =
            oldText;
        },
        1200
      );
    }

  } catch (error) {
    console.error(
      "复制诊断信息失败：",
      error
    );
  }
}

async function initServiceWorker() {

  if (!("serviceWorker" in navigator)) {
    showError("当前浏览器不支持 Service Worker。");
    return;
  }


  try {
    await navigator.serviceWorker.register("./sw.js", {
      scope: "./"
    });

    await navigator.serviceWorker.ready;

    serviceWorkerReady = true;

    console.log("Drive streaming Service Worker ready");

  } catch (error) {
    console.error("Service Worker 注册失败", error);
  }
}
  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }


  function showError(text) {
    document.getElementById("error").textContent = text;
  }


  /*
   * 读取 Google Drive Open With 传来的 state
   *
   * 形式类似：
   *
   * {
   *   "ids": ["FILE_ID"],
   *   "resourceKeys": {...},
   *   "action": "open",
   *   "userId": "..."
   * }
   */


  function escapeDriveQueryValue(value) {
    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }

  function isDriveFolder(file) {
    return !!(
      file &&
      file.mimeType === "application/vnd.google-apps.folder"
    );
  }

  function isVideoFile(file) {
    if (!file) return false;
    if (file.mimeType && file.mimeType.startsWith("video/")) return true;
    return /\.(mp4|m4v|mov|webm|mkv)$/i.test(file.name || "");
  }

  function driveListFields(mediaMetadataField) {
    return [
      "id",
      "name",
      "mimeType",
      "size",
      "thumbnailLink",
      "resourceKey",
      "parents",
      "driveId",
      "capabilities",
      mediaMetadataField
    ].join(",");
  }

  async function fetchDriveMetadata(fileId, accessToken, resourceKey = null) {
    const fields =
      "id,name,mimeType,size,thumbnailLink,resourceKey,parents,driveId,capabilities,videoMediaMetadata";

    const url =
      "https://www.googleapis.com/drive/v3/files/" +
      encodeURIComponent(fileId) +
      "?supportsAllDrives=true&fields=" +
      encodeURIComponent(fields);

    const headers = {
      "Authorization": "Bearer " + accessToken
    };

    if (resourceKey) {
      headers["X-Goog-Drive-Resource-Keys"] =
        fileId + "/" + resourceKey;
    }

    const response = await fetch(url, {
      headers,
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "读取 Google Drive 文件夹信息失败：HTTP " +
        response.status
      );
    }

    return response.json();
  }

  /*
   * 从当前视频向上寻找名为 1433223 的祖先文件夹。
   * 如果路径中没有这个名字，则退回当前视频的直接父文件夹，
   * 避免因为目录改名导致播放器完全不可用。
   */
  async function findVideoRootFolder(openedFile, accessToken) {
    const parents =
      Array.isArray(openedFile.parents)
        ? openedFile.parents
        : [];

    if (!parents.length) return null;

    let parentId = parents[0];
    let firstParent = null;
    let matched = null;
    let guard = 0;

    while (parentId && guard < 80) {
      const folder =
        await fetchDriveMetadata(
          parentId,
          accessToken
        );

      if (!firstParent) firstParent = folder;

      if (
        isDriveFolder(folder) &&
        folder.name === VIDEO_ROOT_FOLDER_NAME
      ) {
        // 如果路径中出现多个同名目录，继续向上，
        // 最终使用最上层的 1433223。
        matched = folder;
      }

      const folderParents =
        Array.isArray(folder.parents)
          ? folder.parents
          : [];

      parentId =
        folderParents.length
          ? folderParents[0]
          : null;

      guard += 1;
    }

    return matched || firstParent;
  }

  async function listVideoTreeChildren(folderFile, accessToken) {
    const allItems = [];
    let pageToken = null;

    do {
      const params = new URLSearchParams({
        q:
          "'" +
          escapeDriveQueryValue(folderFile.id) +
          "' in parents and trashed = false",
        spaces: "drive",
        pageSize: "1000",
        supportsAllDrives: "true",
        includeItemsFromAllDrives: "true",
        fields:
          "nextPageToken,files(" +
          driveListFields("videoMediaMetadata") +
          ")"
      });

      if (folderFile.driveId) {
        params.set("corpora", "drive");
        params.set("driveId", folderFile.driveId);
      } else {
        params.set("corpora", "user");
      }

      if (pageToken) {
        params.set("pageToken", pageToken);
      }

      const response = await fetch(
        "https://www.googleapis.com/drive/v3/files?" +
          params.toString(),
        {
          headers: {
            "Authorization": "Bearer " + accessToken
          },
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          "读取文件夹内容失败：" +
          folderFile.name +
          " · HTTP " +
          response.status
        );
      }

      const data = await response.json();

      for (const file of data.files || []) {
        if (isDriveFolder(file) || isVideoFile(file)) {
          allItems.push(file);
        }
      }

      pageToken = data.nextPageToken || null;
    } while (pageToken);

    const collator =
      new Intl.Collator(
        undefined,
        {
          numeric: true,
          sensitivity: "base"
        }
      );

    allItems.sort((a, b) => {
      const aFolder = isDriveFolder(a) ? 0 : 1;
      const bFolder = isDriveFolder(b) ? 0 : 1;

      if (aFolder !== bFolder) {
        return aFolder - bFolder;
      }

      return collator.compare(
        a.name || "",
        b.name || ""
      );
    });

    return allItems;
  }

  /*
   * 递归建立 1433223 下的文件树。
   * 一次并发读取最多 4 个文件夹，兼顾速度和 Drive API 压力。
   */
  async function buildVideoFolderTree(rootFolder, accessToken) {
    const rootNode = {
      file: rootFolder,
      children: []
    };

    const queue = [rootNode];
    let scannedFolders = 0;
    const MAX_FOLDERS = 5000;

    while (queue.length) {
      const batch = queue.splice(0, 4);

      await Promise.all(
        batch.map(async node => {
          const items =
            await listVideoTreeChildren(
              node.file,
              accessToken
            );

          node.children =
            items.map(file => ({
              file,
              children: []
            }));

          for (const child of node.children) {
            if (isDriveFolder(child.file)) {
              queue.push(child);
            }
          }

          scannedFolders += 1;

          setStatus(
            "正在读取 " +
            (rootFolder.name || VIDEO_ROOT_FOLDER_NAME) +
            " · " +
            scannedFolders +
            " 个文件夹"
          );
        })
      );

      if (scannedFolders + queue.length > MAX_FOLDERS) {
        throw new Error(
          "文件夹数量超过 " +
          MAX_FOLDERS +
          "，为避免浏览器卡死已停止读取。"
        );
      }
    }

    return rootNode;
  }

  function flattenVideosFromTree(rootNode) {
    const result = [];

    function walk(node, pathParts) {
      if (!node || !node.file) return;

      const folderName =
        node.file.name || "Folder";

      const currentPath =
        [...pathParts, folderName];

      for (const child of node.children || []) {
        if (isDriveFolder(child.file)) {
          walk(child, currentPath);
        } else if (isVideoFile(child.file)) {
          child.file._folderPath =
            currentPath.join(" / ");
          result.push(child.file);
        }
      }
    }

    if (rootNode) {
      walk(rootNode, []);
    }

    result.forEach((file, index) => {
      file._playlistIndex = index;
    });

    return result;
  }


  /*
   * 只展开“当前视频所在路径”。
   *
   * 例如：
   * 1433223
   * ├─ A
   * │  └─ A1
   * │     └─ target.mp4
   * ├─ B
   * └─ C
   *
   * 初始只展开：
   * 1433223 → A → A1
   * B / C 保持折叠。
   */
  function expandOnlyPathToVideo(
    rootNode,
    targetVideoId
  ) {
    expandedVideoFolders.clear();

    if (
      !rootNode ||
      !targetVideoId
    ) {
      return false;
    }

    function findTarget(node) {
      if (
        !node ||
        !node.file
      ) {
        return false;
      }

      for (
        const child of
        node.children || []
      ) {
        if (
          isVideoFile(child.file) &&
          child.file.id === targetVideoId
        ) {
          // 当前 node 就是目标视频的直接父文件夹。
          expandedVideoFolders.add(
            node.file.id
          );
          return true;
        }

        if (
          isDriveFolder(child.file) &&
          findTarget(child)
        ) {
          // 目标视频位于这个子文件夹内部，
          // 所以当前祖先文件夹也必须展开。
          expandedVideoFolders.add(
            node.file.id
          );
          return true;
        }
      }

      return false;
    }

    return findTarget(rootNode);
  }

  /*
   * 切换到别的视频后，只“补开”它所在的路径，
   * 不强制关闭用户手动打开的其他文件夹。
   */
  function ensureVideoPathExpanded(
    rootNode,
    targetVideoId
  ) {
    if (
      !rootNode ||
      !targetVideoId
    ) {
      return false;
    }

    function findTarget(node) {
      if (
        !node ||
        !node.file
      ) {
        return false;
      }

      for (
        const child of
        node.children || []
      ) {
        if (
          isVideoFile(child.file) &&
          child.file.id === targetVideoId
        ) {
          expandedVideoFolders.add(
            node.file.id
          );
          return true;
        }

        if (
          isDriveFolder(child.file) &&
          findTarget(child)
        ) {
          expandedVideoFolders.add(
            node.file.id
          );
          return true;
        }
      }

      return false;
    }

    return findTarget(rootNode);
  }

  function countVideoTreeFolders(rootNode) {
    let count = 0;

    function walk(node, includeSelf) {
      if (!node) return;
      if (includeSelf) count += 1;

      for (const child of node.children || []) {
        if (isDriveFolder(child.file)) {
          walk(child, true);
        }
      }
    }

    walk(rootNode, false);
    return count;
  }

  function formatFileSize(size) {
    const value = Number(size);
    if (!Number.isFinite(value) || value <= 0) return "";
    if (value >= 1024 ** 3) return (value / 1024 ** 3).toFixed(1) + " GB";
    if (value >= 1024 ** 2) return (value / 1024 ** 2).toFixed(0) + " MB";
    return (value / 1024).toFixed(0) + " KB";
  }

  function renderVideoPlaylist() {
    const items =
      document.getElementById("videoPlaylistItems");

    const title =
      document.getElementById("playlistTitle");

    if (!items) return;

    const folderCount =
      videoTreeRoot
        ? countVideoTreeFolders(videoTreeRoot)
        : 0;

    if (title) {
      title.textContent =
        (videoRootFolder
          ? videoRootFolder.name
          : "视频目录") +
        " · " +
        folderCount +
        " 个子文件夹 · " +
        videoPlaylist.length +
        " 个视频";
    }

    items.innerHTML = "";

    if (!videoTreeRoot) {
      videoPlaylist.forEach((file, index) => {
        items.appendChild(
          createVideoTreeMediaItem(file, index)
        );
      });
      return;
    }

    function renderFolder(node, depth = 0) {
      const folderWrap =
        document.createElement("div");

      folderWrap.className =
        "drive-tree-folder";

      folderWrap.dataset.folderId =
        node.file.id;

      if (
        !expandedVideoFolders.has(
          node.file.id
        )
      ) {
        folderWrap.classList.add("collapsed");
      }

      const folderRow =
        document.createElement("button");

      folderRow.type = "button";
      folderRow.className =
        "drive-folder-row";

      folderRow.style.paddingLeft =
        Math.min(8 + depth * 2, 22) + "px";

      const chevron =
        document.createElement("span");

      chevron.className =
        "drive-folder-chevron";

      chevron.textContent = "›";

      const icon =
        document.createElement("span");

      icon.className =
        "drive-folder-icon";

      icon.textContent = "📁";

      const name =
        document.createElement("span");

      name.className =
        "drive-folder-name";

      name.textContent =
        node.file.name || "Folder";

      const directMedia =
        (node.children || [])
          .filter(child =>
            isVideoFile(child.file)
          ).length;

      const directFolders =
        (node.children || [])
          .filter(child =>
            isDriveFolder(child.file)
          ).length;

      const count =
        document.createElement("span");

      count.className =
        "drive-folder-count";

      const countParts = [];

      if (directFolders) {
        countParts.push(
          directFolders + "夹"
        );
      }

      if (directMedia) {
        countParts.push(
          directMedia + "视频"
        );
      }

      count.textContent =
        countParts.join(" · ");

      folderRow.append(
        chevron,
        icon,
        name,
        count
      );

      const children =
        document.createElement("div");

      children.className =
        "drive-folder-children";

      folderRow.addEventListener(
        "click",
        () => {
          const id = node.file.id;

          if (
            expandedVideoFolders.has(id)
          ) {
            expandedVideoFolders.delete(id);
            folderWrap.classList.add(
              "collapsed"
            );
          } else {
            expandedVideoFolders.add(id);
            folderWrap.classList.remove(
              "collapsed"
            );
          }
        }
      );

      for (const child of node.children || []) {
        if (isDriveFolder(child.file)) {
          children.appendChild(
            renderFolder(child, depth + 1)
          );
        } else if (isVideoFile(child.file)) {
          children.appendChild(
            createVideoTreeMediaItem(
              child.file,
              child.file._playlistIndex
            )
          );
        }
      }

      folderWrap.append(
        folderRow,
        children
      );

      return folderWrap;
    }

    items.appendChild(
      renderFolder(videoTreeRoot, 0)
    );
  }

  function createVideoTreeMediaItem(file, index) {
    const button =
      document.createElement("button");

    button.className =
      "video-playlist-item tree-video" +
      (
        index === currentVideoIndex
          ? " active"
          : ""
      );

    button.type = "button";
    button.dataset.index = String(index);

    if (index === currentVideoIndex) {
      button.setAttribute(
        "aria-current",
        "true"
      );
    }

    const thumb =
      document.createElement("div");

    thumb.className =
      "video-thumb-wrap";

    const fallback =
      document.createElement("div");

    fallback.className =
      "video-thumb-fallback";

    fallback.textContent = "▶";

    thumb.appendChild(fallback);

    if (file.thumbnailLink) {
      const img =
        document.createElement("img");

      img.loading = "lazy";
      img.decoding = "async";
      img.alt = "";
      img.src = file.thumbnailLink;

      img.onerror = () => img.remove();

      thumb.appendChild(img);
    }

    const meta =
      document.createElement("div");

    meta.className =
      "video-playlist-meta";

    const name =
      document.createElement("div");

    name.className =
      "video-playlist-name";

    name.textContent =
      file.name ||
      "Google Drive Video";

    const sub =
      document.createElement("div");

    sub.className =
      "video-playlist-sub";

      file.videoMediaMetadata &&
      file.videoMediaMetadata.width &&
      file.videoMediaMetadata.height
        ? file.videoMediaMetadata.width +
          "×" +
          file.videoMediaMetadata.height
        : "";

      videoRootFolder &&
      file._folderPath !== videoRootFolder.name
        ? file._folderPath
        : "";

      ]
        .filter(Boolean)
        .join(" · ");

    meta.append(
      name,
      sub
    );

    button.append(
      thumb,

    );

    button.addEventListener(
