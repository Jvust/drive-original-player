<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Original Player</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      height: 58px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #151515;
      border-bottom: 1px solid #242424;
    }

    .logo {
      font-size: 16px;
      font-weight: 600;
    }

    #status {
      color: #aaa;
      font-size: 13px;
    }

    main {
      min-height: calc(100vh - 58px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #welcome {
      text-align: center;
    }

    #welcome h1 {
      margin-bottom: 8px;
      font-size: 26px;
    }

    #welcome p {
      color: #999;
      margin-bottom: 24px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 15px;
      cursor: pointer;
      background: #ffffff;
      color: #111111;
    }

    button:hover {
      background: #e8e8e8;
    }

    #playerWrap {
      display: none;
      width: 100%;
      max-width: 1500px;
    }

    video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 150px);
      background: #000;
    }

    #info {
      padding-top: 12px;
    }

    #filename {
      font-size: 14px;
      color: #ddd;
    }

    #quality {
      margin-top: 6px;
      color: #7fd47f;
      font-size: 13px;
    }

    #error {
      max-width: 760px;
      color: #ff8e8e;
      line-height: 1.7;
      margin-top: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Drive Original Player</div>
  <div id="status">等待授权</div>
</header>

<main>

  <div id="welcome">
    <h1>Drive Original Player</h1>
    <p>直接读取 Google Drive 中的原始视频文件</p>

    <button id="loginBtn" onclick="authorizeDrive()">
      授权 Google Drive
    </button>

    <div id="error"></div>
  </div>

  <div id="playerWrap">
    <video
      id="player"
      controls
      playsinline
      preload="metadata"
      controlsList="nodownload">
    </video>

    <div id="info">
      <div id="filename"></div>
      <div id="quality"></div>
    </div>
  </div>

</main>

<script>

  /*
   * ================================
   * 这里以后替换成你的 OAuth Client ID
   * ================================
   */

  const CLIENT_ID =
    "YOUR_CLIENT_ID.apps.googleusercontent.com";


  /*
   * drive.file：
   * 允许访问用户明确使用本应用打开的 Drive 文件
   *
   * drive.install：
   * 用于 Drive 的“打开方式”集成
   */

  const SCOPES =
    "https://www.googleapis.com/auth/drive.file " +
    "https://www.googleapis.com/auth/drive.install";


  let tokenClient = null;
  let currentFileId = null;
  let currentResourceKey = null;


  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }


  function showError(text) {
    document.getElementById("error").textContent = text;
  }


  /*
   * 读取 Google Drive Open With 传来的 state
   *
   * 形式类似：
   *
   * {
   *   "ids": ["FILE_ID"],
   *   "resourceKeys": {...},
   *   "action": "open",
   *   "userId": "..."
   * }
   */

  function parseDriveState() {

    const params = new URLSearchParams(window.location.search);
    const rawState = params.get("state");

    if (!rawState) {
      return null;
    }

    try {

      const state = JSON.parse(rawState);

      if (
        state.action === "open" &&
        Array.isArray(state.ids) &&
        state.ids.length > 0
      ) {

        const id = state.ids[0];

        let resourceKey = null;

        if (
          state.resourceKeys &&
          state.resourceKeys[id]
        ) {
          resourceKey = state.resourceKeys[id];
        }

        return {
          fileId: id,
          resourceKey: resourceKey
        };

      }

    } catch (err) {

      console.error("state 解析失败：", err);

    }

    return null;
  }


  /*
   * 初始化 Google OAuth
   */

  window.addEventListener("load", () => {

    const driveState = parseDriveState();

    if (driveState) {

      currentFileId = driveState.fileId;
      currentResourceKey = driveState.resourceKey;

      setStatus("检测到 Drive 视频");

    } else {

      setStatus("等待 Google Drive");

    }


    if (
      typeof google === "undefined" ||
      !google.accounts ||
      !google.accounts.oauth2
    ) {

      showError(
        "Google 登录组件加载失败，请刷新页面后重试。"
      );

      return;
    }


    tokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id: CLIENT_ID,

        scope: SCOPES,

        callback: async (response) => {

          if (response.error) {

            console.error(response);

            setStatus("授权失败");

            showError(
              "Google Drive 授权失败：\n" +
              response.error
            );

            return;
          }


          setStatus("已授权");


          if (!currentFileId) {

            document.getElementById("welcome").innerHTML = `
              <h1>授权成功</h1>
              <p>
                现在回到 Google Drive，
                右键视频 → 打开方式 → Drive Original Player
              </p>
            `;

            return;
          }


          await openDriveVideo(
            response.access_token
          );

        }

      });

  });


  /*
   * 点击按钮触发 Google 授权
   */

  function authorizeDrive() {

    showError("");

    if (!tokenClient) {

      showError(
        "Google OAuth 尚未初始化，请刷新页面。"
      );

      return;
    }


    if (
      CLIENT_ID.startsWith("YOUR_CLIENT_ID")
    ) {

      showError(
        "你还没有填写 Google OAuth Client ID。\n" +
        "先完成 Google Cloud OAuth 配置，再把 Client ID 填进代码。"
      );

      return;
    }


    tokenClient.requestAccessToken({
      prompt: ""
    });

  }


  /*
   * 从 Drive API 读取视频
   */

  async function openDriveVideo(accessToken) {

    setStatus("正在读取文件信息…");


    try {

      let metadataUrl =
        "https://www.googleapis.com/drive/v3/files/" +
        encodeURIComponent(currentFileId) +
        "?fields=id,name,mimeType,size,capabilities,videoMediaMetadata";


      const headers = {
        "Authorization": "Bearer " + accessToken
      };


      /*
       * 如果 Google Drive Open With 返回 resourceKey，
       * 按官方要求带上对应 header。
       */

      if (currentResourceKey) {

        headers["X-Goog-Drive-Resource-Keys"] =
          currentFileId + "/" + currentResourceKey;

      }


      const metadataResponse =
        await fetch(metadataUrl, {
          headers: headers
        });


      if (!metadataResponse.ok) {

        const text =
          await metadataResponse.text();

        throw new Error(
          "无法读取 Drive 文件信息。\n" +
          "HTTP " +
          metadataResponse.status +
          "\n" +
          text
        );

      }


      const file =
        await metadataResponse.json();


      if (
        file.capabilities &&
        file.capabilities.canDownload === false
      ) {

        throw new Error(
          "这个 Google Drive 文件禁止下载，因此无法播放原文件。"
        );

      }


      document.getElementById("filename")
        .textContent =
        file.name || "Google Drive Video";


      /*
       * 显示 Drive 提供的视频分辨率
       */

      if (
        file.videoMediaMetadata &&
        file.videoMediaMetadata.width &&
        file.videoMediaMetadata.height
      ) {

        document.getElementById("quality")
          .textContent =
          "Original · " +
          file.videoMediaMetadata.width +
          " × " +
          file.videoMediaMetadata.height;

      } else {

        document.getElementById("quality")
          .textContent =
          "Original · Drive 原文件";

      }


      /*
       * alt=media 获取的是 Drive 中保存的原始 Blob 文件内容，
       * 不是 Google Drive 网页预览转码视频。
       *
       * 注意：
       * video 标签不能添加 Authorization Header，
       * 因此这里使用短期 OAuth access token。
       */

      let mediaUrl =
        "https://www.googleapis.com/drive/v3/files/" +
        encodeURIComponent(currentFileId) +
        "?alt=media" +
        "&access_token=" +
        encodeURIComponent(accessToken);


      const player =
        document.getElementById("player");


      player.src = mediaUrl;


      document.getElementById("welcome")
        .style.display = "none";


      document.getElementById("playerWrap")
        .style.display = "block";


      setStatus("Original");


      player.addEventListener(
        "error",
        () => {

          showError(
            "视频文件已经成功读取，但浏览器无法解码这个视频。\n\n" +
            "最兼容的是：MP4 + H.264/AVC + AAC。\n" +
            "如果是 MKV、HEVC/H.265、DTS、TrueHD 等，" +
            "后面可以再给播放器增加对应方案。"
          );

        },
        { once: true }
      );


      try {

        await player.play();

      } catch (e) {

        // 浏览器阻止自动播放属于正常情况
        console.log(
          "等待用户点击播放：",
          e
        );

      }

    }

    catch (err) {

      console.error(err);

      setStatus("读取失败");

      showError(err.message);

    }

  }

</script>

</body>
</html>
