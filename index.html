  function openVideoPlaylist() {
    const wrap = document.getElementById("playerWrap");
    if (!wrap || (!videoTreeRoot && videoPlaylist.length <= 1)) return;
    wrap.classList.add("playlist-open");
    wrap.classList.remove("watch-ui-hidden", "fullscreen-ui-hidden");

    ensureVideoPathExpanded(
      videoTreeRoot,
      currentFileId
    );

    renderVideoPlaylist();

    requestAnimationFrame(() => {
      const active = document.querySelector(
        `#videoPlaylistItems .video-playlist-item[data-index="${currentVideoIndex}"]`
      );
      if (active) {
        active.scrollIntoView({
          block: "nearest"
        });
      }
    });

    clearTimeout(videoUiTimer);
    clearTimeout(fullscreenUiTimer);
  }

  function closeVideoPlaylist() {
    const wrap = document.getElementById("playerWrap");
    if (!wrap) return;
    wrap.classList.remove("playlist-open");
    showWatchUi();
  }

  function toggleVideoPlaylist() {
    const wrap = document.getElementById("playerWrap");
    if (!wrap) return;
    if (wrap.classList.contains("playlist-open")) closeVideoPlaylist();
    else openVideoPlaylist();
  }

  async function playPreviousVideo() {
    if (!videoPlaylist.length) return;
    const next = currentVideoIndex > 0 ? currentVideoIndex - 1 : videoPlaylist.length - 1;
    await switchVideoByIndex(next, true);
    renderVideoPlaylist();
  }

  async function playNextVideo() {
    if (!videoPlaylist.length) return;
    const next = currentVideoIndex + 1 < videoPlaylist.length ? currentVideoIndex + 1 : 0;
    await switchVideoByIndex(next, true);
    renderVideoPlaylist();
  }

  function updateVideoInfo(file) {
    document.getElementById("filename").textContent = file.name || "Google Drive Video";
    const meta = file.videoMediaMetadata;
    document.getElementById("quality").textContent =
      meta && meta.width && meta.height
        ? "Original · " + meta.width + " × " + meta.height
        : "Original · Drive 原文件";
  }

  async function sendCurrentVideoStateToWorker(file) {
    if (!serviceWorkerReady) throw new Error("视频流服务尚未准备完成，请刷新页面后重试。");
    const registration = await navigator.serviceWorker.ready;
    const worker = navigator.serviceWorker.controller || registration.active;
    if (!worker) throw new Error("Service Worker 尚未接管当前页面。请刷新后重试。");

    worker.postMessage({
      type: "SET_TOKEN",
      token: currentAccessToken,
      fileId: file.id,
      fileSize: Number(file.size)
    });

    await new Promise(resolve => setTimeout(resolve, 120));
  }

  async function switchVideoByIndex(index, autoplay = true) {
    const file = videoPlaylist[index];
    if (!file) return;

    /*
     * 切换到另一条视频前销毁旧 MSE Rescue。
     */
    destroySeekRescue();

    currentVideoIndex = index;
    currentFileId = file.id;
    currentResourceKey = file.resourceKey || null;
    currentFileSize = Number(file.size);

    /*
     * 上一条 / 下一条 / 自动连播跨文件夹时，
     * 确保当前视频所在路径处于展开状态。
     * 用户自己手动展开的其他文件夹不会因此被关闭。
     */
    ensureVideoPathExpanded(
      videoTreeRoot,
      file.id
    );

    updateVideoInfo(file);
    renderVideoPlaylist();

    if (file.capabilities && file.capabilities.canDownload === false) {
      showError("这个 Google Drive 文件禁止下载，因此无法播放原文件。");
      return;
    }

    await sendCurrentVideoStateToWorker(file);

    let mediaUrl = "./media/" + encodeURIComponent(file.id);
    if (currentResourceKey) {
      mediaUrl += "?resourceKey=" + encodeURIComponent(currentResourceKey);
    }

    const player = document.getElementById("player");
    if ((smoothDeviceMode || performanceFallback) && gpuActive) {
      disableWebGPUEnhancement(false);
    }

    // 借鉴成熟播放器的 poster 体验：真正视频帧出来前先显示 Drive 缩略图。
    if (file.thumbnailLink) player.poster = file.thumbnailLink;
    else player.removeAttribute("poster");

    player.src = mediaUrl;
    player.load();
    applySharpenMode();

    setStatus(
      (smoothDeviceMode || performanceFallback)
        ? (performanceFallback ? "Original · 流畅模式（自动）" : "Original · 流畅模式")
        : (gpuActive ? "Original · WebGPU 高质量渲染" : "Original · 准备高质量渲染")
    );

    if (autoplay) {
      try { await player.play(); } catch (error) { console.log("等待用户点击播放：", error); }
    }

    showWatchUi();
  }

  function startGpuHealthMonitor() {
    if (gpuHealthTimer) return;

    gpuHealthTimer = setInterval(() => {
      const player = document.getElementById("player");
      if (
        !player ||
        player.paused ||
        !gpuActive ||
        smoothDeviceMode ||
        performanceFallback ||
        typeof player.getVideoPlaybackQuality !== "function"
      ) {
        return;
      }

      try {
        const q = player.getVideoPlaybackQuality();
        const total = Number(q.totalVideoFrames || 0);
        const dropped = Number(q.droppedVideoFrames || 0);
        const deltaTotal = total - gpuHealthPrevTotal;
        const deltaDropped = dropped - gpuHealthPrevDropped;

        gpuHealthPrevTotal = total;
        gpuHealthPrevDropped = dropped;

        if (deltaTotal < 90) return;

        const ratio = deltaDropped / deltaTotal;

        // 持续掉帧约 3.5% 以上时自动回退，优先保证观看流畅。
        if (deltaDropped >= 6 && ratio >= 0.035) {
          performanceFallback = true;
          sessionStorage.setItem("drive_player_gpu_fallback", "1");
          disableWebGPUEnhancement(false);
          applySharpenMode();
          setStatus("Original · 流畅模式（自动）");
          console.warn(
            "检测到 WebGPU 渲染掉帧，已自动切换到原生视频渲染。",
            { deltaTotal, deltaDropped, ratio }
          );
        }
      } catch (error) {
        console.debug("GPU 健康监测失败：", error);
      }
    }, 5000);
  }

  function initVideoPlayerEventsOnce() {
    if (videoPlayerEventsReady) return;
    videoPlayerEventsReady = true;

    const player = document.getElementById("player");
    initGpuMediaControls();
    initFullscreenAutoHide();
    startGpuHealthMonitor();

    player.addEventListener("loadedmetadata", () => {
      syncGpuCanvasSize();
      syncGpuMediaControls();
      updateDiagnostic();
    });

    player.addEventListener("loadeddata", async () => {
      if (!smoothDeviceMode && !performanceFallback && !gpuActive && !gpuInitializing) {
        await enableWebGPUEnhancement();
      } else if (smoothDeviceMode || performanceFallback) {
        setGpuUiActive(false);
        applySharpenMode();
        setStatus(
          performanceFallback
            ? "Original · 流畅模式（自动）"
            : "Original · 流畅模式"
        );
      }
      syncGpuCanvasSize();
      renderGpuFrame();
      updateDiagnostic();
    });

    player.addEventListener("resize", () => {
      syncGpuCanvasSize();
      renderGpuFrame();
      updateDiagnostic();
    });

    player.addEventListener("timeupdate", () => {
      if (diagnosticOpen) updateDiagnostic();
    });

    player.addEventListener("play", showWatchUi);
    player.addEventListener("pause", showWatchUi);

    /*
     * Seek Rescue 监听所有进度条来源：
     * - 浏览器原生 controls
     * - GPU 自定义 seek slider
     * - 键盘跳转
     */
    player.addEventListener(
      "seeking",
      handlePlayerSeekingForRescue
    );

    player.addEventListener(
      "timeupdate",
      handlePlayerProgressForRescue
    );

    player.addEventListener(
      "playing",
      handlePlayerProgressForRescue
    );

    player.addEventListener("ended", async () => {
      if (videoPlaylist.length > 1) {
        const next = currentVideoIndex + 1;
        if (next < videoPlaylist.length) {
          await switchVideoByIndex(next, true);
        }
      }
    });

    player.addEventListener("error", () => {
      showError(
        "视频文件已经成功读取，但浏览器无法解码这个视频。\\n\\n" +
        "最兼容的是：MP4 + H.264/AVC + AAC。"
      );
    });
  }


  /*
   * ================================================================
   * MP4 Seek Rescue
   * ================================================================
   *
   * 目的：
   * 某些 MP4 虽然可以顺播，但音频 / 视频 chunk 在文件里的物理位置
   * 相隔很远，Chrome 直接对原 MP4 Seek 时可能长时间等待。
   *
   * 策略：
   * 1. 正常视频继续走原生 <video> + HTTP Range。
   * 2. 只有 Seek 明显卡住时才动态加载 MP4Box.js。
   * 3. MP4Box 读取 moov/sample table，在浏览器内把目标时间附近
   *    的原始 H.264/AAC sample 临时封装成 fragmented MP4。
   * 4. 通过 MediaSource / SourceBuffer 喂给同一个 <video>。
   * 5. 不重新编码，因此不会改变原始视频/音频质量。
   *
   * 当前 Rescue 主要面向“非 fragmented MP4”。
   * MP4Box.js 对 fragmented MP4 seek 仍存在已知边缘问题，
   * 此类文件自动回退到原生播放。
   */

  const SEEK_RESCUE_TIMEOUT_MS = 2600;
  const SEEK_RESCUE_DEBOUNCE_MS = 220;
  const SEEK_RESCUE_INITIAL_AHEAD_SEC = 9;
  const SEEK_RESCUE_REFILL_AHEAD_SEC = 22;
  const SEEK_RESCUE_REFILL_THRESHOLD_SEC = 7;
  const SEEK_RESCUE_RANGE_CHUNK =
    4 * 1024 * 1024;

  const SEEK_RESCUE_STORAGE_KEY =
    "drive_original_player_seek_rescue_v1";

  const MP4BOX_MODULE_URL =
    "https://cdn.jsdelivr.net/npm/mp4box@2.4.1/dist/mp4box.all.mjs";

  let mp4boxModulePromise = null;
  let seekRescueSession = null;
  let seekRescueActivation = null;
  let seekRescueWatchdog = null;
  let seekRescueProbe = null;
  let seekRescueDebounceTimer = null;
  let seekRescueInternalChange = false;
  let seekRescueGeneration = 0;

  function loadMP4BoxModule() {
    if (!mp4boxModulePromise) {
      mp4boxModulePromise =
        import(MP4BOX_MODULE_URL)
          .catch(error => {
            mp4boxModulePromise = null;
            throw error;
          });
    }

    return mp4boxModulePromise;
  }

  function getRememberedSeekRescueIds() {
    try {
      const parsed =
        JSON.parse(
          localStorage.getItem(
            SEEK_RESCUE_STORAGE_KEY
          ) || "[]"
        );

      return new Set(
        Array.isArray(parsed)
          ? parsed
          : []
      );
    } catch (_) {
      return new Set();
    }
  }

  function isSeekRescueRemembered(fileId) {
    if (!fileId) return false;

    return getRememberedSeekRescueIds()
      .has(fileId);
  }

  function rememberSeekRescue(fileId) {
    if (!fileId) return;

    try {
      const ids =
        getRememberedSeekRescueIds();

      ids.add(fileId);

      /*
       * 避免 localStorage 无限增长。
       */
      const compact =
        Array.from(ids)
          .slice(-200);

      localStorage.setItem(
        SEEK_RESCUE_STORAGE_KEY,
        JSON.stringify(compact)
      );
    } catch (_) {}
  }

  function getMediaUrlForFile(file) {
    if (!file || !file.id) {
      return "";
    }

    let mediaUrl =
      "./media/" +
      encodeURIComponent(file.id);

    const resourceKey =
      file.resourceKey || null;

    if (resourceKey) {
      mediaUrl +=
        "?resourceKey=" +
        encodeURIComponent(
          resourceKey
        );
    }

    return mediaUrl;
  }

  function parseContentRangeStart(
    header,
    fallbackStart
  ) {
    if (!header) {
      return fallbackStart;
    }

    const match =
      /^bytes\s+(\d+)-(\d+)\/(\d+|\*)$/i
        .exec(header);

    if (!match) {
      return fallbackStart;
    }

    return Number(match[1]);
  }

  async function fetchSeekRescueRange(
    mediaUrl,
    start,
    end,
    signal
  ) {
    const response =
      await fetch(
        mediaUrl,
        {
          method: "GET",
          headers: {
            "Range":
              `bytes=${start}-${end}`
          },
          cache: "no-store",
          signal
        }
      );

    if (
      response.status !== 206 &&
      !response.ok
    ) {
      throw new Error(
        "Seek Rescue Range 请求失败：HTTP " +
        response.status
      );
    }

    const arrayBuffer =
      await response.arrayBuffer();

    const actualStart =
      parseContentRangeStart(
        response.headers.get(
          "Content-Range"
        ),
        start
      );

    /*
     * MP4Box 要求 ArrayBuffer 带 fileStart 属性。
     */
    arrayBuffer.fileStart =
      actualStart;

    return {
      buffer: arrayBuffer,
      start: actualStart,
      end:
        actualStart +
        arrayBuffer.byteLength -
        1
    };
  }

  async function loadSeekRescueIndex(
    file,
    mediaUrl,
    signal
  ) {
    const MP4Box =
      await loadMP4BoxModule();

    if (
      !MP4Box ||
      typeof MP4Box.createFile !==
        "function"
    ) {
      throw new Error(
        "MP4Box.js 加载失败。"
      );
    }

    const fileSize =
      Number(file.size);

    if (
      !Number.isFinite(fileSize) ||
      fileSize <= 0
    ) {
      throw new Error(
        "无法取得视频文件大小。"
      );
    }

    const parser =
      MP4Box.createFile();

    let readyInfo = null;
    let parserError = null;

    parser.onReady =
      info => {
        readyInfo = info;
      };

    parser.onError =
      error => {
        parserError =
          error instanceof Error
            ? error
            : new Error(
                String(error)
              );
      };

    /*
     * 保存解析 moov 所需的小块。
     * 后续每次 Seek 都用这些 metadata
     * 创建一个干净的新 segmenter，
     * 这样前后乱跳不会受已经消费过的 sample 状态影响。
     */
    const metadataChunks = [];

    let nextStart = 0;
    let sequentialBytes = 0;
    let tailTried = false;

    for (
      let attempt = 0;
      attempt < 18 &&
      !readyInfo &&
      !parserError;
      attempt++
    ) {
      if (
        nextStart >= fileSize
      ) {
        break;
      }

      let start =
        Math.max(
          0,
          Math.floor(nextStart)
        );

      /*
       * 如果前面连续读了 8 MB 还没碰到 moov，
       * 主动尝试文件尾部。
       * 普通 “moov 在末尾” MP4 可以很快解析，
       * 不会把整个大视频扫一遍。
       */
      if (
        sequentialBytes >=
          8 * 1024 * 1024 &&
        !tailTried
      ) {
        start =
          Math.max(
            0,
            fileSize -
              8 * 1024 * 1024
          );

        tailTried = true;
      }

      const end =
        Math.min(
          fileSize - 1,
          start +
            SEEK_RESCUE_RANGE_CHUNK -
            1
        );

      const fetched =
        await fetchSeekRescueRange(
          mediaUrl,
          start,
          end,
          signal
        );

      const saved =
        fetched.buffer.slice(0);

      saved.fileStart =
        fetched.start;

      metadataChunks.push({
        start: fetched.start,
        buffer: saved
      });

      const feed =
        fetched.buffer.slice(0);

      feed.fileStart =
        fetched.start;

      let suggestedNext;

      try {
        suggestedNext =
          parser.appendBuffer(feed);
      } catch (error) {
        parserError = error;
        break;
      }

      if (
        readyInfo ||
        parserError
      ) {
        break;
      }

      if (
        !tailTried &&
        fetched.start <
          8 * 1024 * 1024
      ) {
        sequentialBytes =
          Math.max(
            sequentialBytes,
            fetched.end + 1
          );
      }

      /*
       * MP4Box 能从 mdat box size
       * 推导下一个需要解析的位置时，
       * 允许它直接跳到 moov。
       */
      if (
        Number.isFinite(
          suggestedNext
        ) &&
        suggestedNext >
          fetched.end
      ) {
        nextStart =
          suggestedNext;
      } else {
        nextStart =
          fetched.end + 1;
      }

      /*
       * 尾部已经试过仍然失败时，
       * 回到 MP4Box 建议的位置。
       */
      if (
        tailTried &&
        !readyInfo &&
        Number.isFinite(
          suggestedNext
        ) &&
        suggestedNext >= 0 &&
        suggestedNext < fileSize
      ) {
        nextStart =
          suggestedNext;
      }
    }

    if (parserError) {
      throw parserError;
    }

    if (!readyInfo) {
      throw new Error(
        "无法在合理的数据量内解析 MP4 索引。"
      );
    }

    return {
      MP4Box,
      info: readyInfo,
      metadataChunks
    };
  }

  function getMp4Trak(
    mp4boxFile,
    trackId
  ) {
    const traks =
      mp4boxFile &&
      mp4boxFile.moov &&
      Array.isArray(
        mp4boxFile.moov.traks
      )
        ? mp4boxFile.moov.traks
        : [];

    return (
      traks.find(
        trak =>
          Number(
            trak &&
            trak.tkhd &&
            trak.tkhd.track_id
          ) ===
          Number(trackId)
      ) ||
      null
    );
  }

  function sampleTimeSeconds(
    sample,
    fallbackTimescale
  ) {
    if (!sample) {
      return 0;
    }

    const timescale =
      Number(
        sample.timescale ||
        fallbackTimescale ||
        1
      ) || 1;

    const cts =
      Number(
        sample.cts ??
        sample.dts ??
        0
      );

    return cts / timescale;
  }

  function isMp4VideoFile(file) {
    if (!file) return false;

    if (
      file.mimeType ===
        "video/mp4"
    ) {
      return true;
    }

    return /\.mp4$/i.test(
      file.name || ""
    );
  }

  function selectRescueTracks(info) {
    const tracks =
      Array.isArray(info?.tracks)
        ? info.tracks
        : [];

    const video =
      tracks.find(
        track => !!track.video
      ) || null;

    const audio =
      tracks.find(
        track => !!track.audio
      ) || null;

    return [video, audio]
      .filter(Boolean);
  }

  function getTrackMime(track) {
    const kind =
      track.video
        ? "video"
        : "audio";

    return (
      kind +
      '/mp4; codecs="' +
      track.codec +
      '"'
    );
  }

  function findTrackSampleIndexAtTime(
    samples,
    time,
    timescale,
    useRap
  ) {
    if (
      !samples ||
      !samples.length
    ) {
      return 0;
    }

    let candidate = 0;
    let rapCandidate = 0;

    for (
      let index = 0;
      index < samples.length;
      index++
    ) {
      const sample =
        samples[index];

      const sampleTime =
        sampleTimeSeconds(
          sample,
          timescale
        );

      if (
        sampleTime >
        time
      ) {
        break;
      }

      candidate = index;

      if (
        useRap &&
        (
          sample.is_sync ||
          sample.is_rap
        )
      ) {
        rapCandidate =
          index;
      }
    }

    return useRap
      ? rapCandidate
      : candidate;
  }

  function detectStrongTrackSeparation(
    mp4boxFile,
    info,
    fileSize
  ) {
    try {
      const tracks =
        selectRescueTracks(info);

      const video =
        tracks.find(
          track => !!track.video
        );

      const audio =
        tracks.find(
          track => !!track.audio
        );

      if (!video || !audio) {
        return false;
      }

      const duration =
        Number(info.duration) /
        Number(info.timescale || 1);

      const probeTime =
        Math.max(
          1,
          duration * 0.5
        );

      const videoSamples =
        mp4boxFile
          .getTrackSamplesInfo(
            video.id
          );

      const audioSamples =
        mp4boxFile
          .getTrackSamplesInfo(
            audio.id
          );

      const vi =
        findTrackSampleIndexAtTime(
          videoSamples,
          probeTime,
          video.timescale,
          true
        );

      const ai =
        findTrackSampleIndexAtTime(
          audioSamples,
          probeTime,
          audio.timescale,
          false
        );

      const videoOffset =
        Number(
          videoSamples[vi]?.offset
        );

      const audioOffset =
        Number(
          audioSamples[ai]?.offset
        );

      if (
        !Number.isFinite(videoOffset) ||
        !Number.isFinite(audioOffset)
      ) {
        return false;
      }

      const separation =
        Math.abs(
          videoOffset -
          audioOffset
        );

      /*
       * 32 MB 且至少约文件大小的 5%，
       * 判为明显的轨道物理分离。
       */
      return (
        separation >=
          32 * 1024 * 1024 &&
        separation >=
          fileSize * 0.05
      );
    } catch (error) {
      console.debug(
        "检测 MP4 轨道布局失败：",
        error
      );

      return false;
    }
  }

  function waitForEventOnce(
    target,
    eventName,
    timeout = 10000
  ) {
    return new Promise(
      (resolve, reject) => {
        let timer = null;

        const cleanup = () => {
          if (timer) {
            clearTimeout(timer);
          }

          target.removeEventListener(
            eventName,
            onEvent
          );
        };

        const onEvent =
          event => {
            cleanup();
            resolve(event);
          };

        target.addEventListener(
          eventName,
          onEvent,
          { once: true }
        );

        timer =
          setTimeout(
            () => {
              cleanup();
              reject(
                new Error(
                  "等待 " +
                  eventName +
                  " 超时"
                )
              );
            },
            timeout
          );
      }
    );
  }

  class SeekRescueSession {
    constructor(
      player,
      file,
      mediaUrl
    ) {
      this.player = player;
      this.file = file;
      this.mediaUrl = mediaUrl;

      this.MP4Box = null;
      this.info = null;
      this.metadataChunks = [];

      this.mediaSource = null;
      this.objectUrl = null;

      this.tracks = [];
      this.sourceBuffers =
        new Map();

      this.appendQueues =
        new Map();

      this.currentBox = null;
      this.currentTraks =
        new Map();

      this.currentSamples =
        new Map();

      this.currentGeneration = 0;
      this.currentAbort = null;

      this.fedUntilTime = 0;
      this.actualStartTime = 0;

      this.active = false;
      this.destroyed = false;
      this.refillTimer = null;
      this.strongTrackSeparation =
        false;
    }

    async prepareIndex() {
      const controller =
        new AbortController();

      this.currentAbort =
        controller;

      const index =
        await loadSeekRescueIndex(
          this.file,
          this.mediaUrl,
          controller.signal
        );

      this.MP4Box =
        index.MP4Box;

      this.info =
        index.info;

      this.metadataChunks =
        index.metadataChunks;

      if (
        this.info.isFragmented
      ) {
        throw new Error(
          "当前视频已经是 fragmented MP4，" +
          "本次自动 Seek Rescue 不接管。"
        );
      }

      this.tracks =
        selectRescueTracks(
          this.info
        );

      const videoTrack =
        this.tracks.find(
          track => !!track.video
        );

      if (!videoTrack) {
        throw new Error(
          "MP4 中没有可用的视频轨。"
        );
      }

      for (
        const track of
        this.tracks
      ) {
        const mime =
          getTrackMime(track);

        if (
          !MediaSource
            .isTypeSupported(mime)
        ) {
          throw new Error(
            "浏览器 MSE 不支持：" +
            mime
          );
        }
      }

      /*
       * 用解析索引的 parser 判断是否属于
       * 音视频 chunk 明显分离的 MP4。
       */
      const parser =
        this.MP4Box.createFile();

      let parserInfo = null;

      parser.onReady =
        info => {
          parserInfo = info;
        };

      for (
        const chunk of
        this.metadataChunks
      ) {
        const copy =
          chunk.buffer.slice(0);

        copy.fileStart =
          chunk.start;

        parser.appendBuffer(copy);
      }

      if (parserInfo) {
        this.strongTrackSeparation =
          detectStrongTrackSeparation(
            parser,
            parserInfo,
            Number(this.file.size)
          );
      }
    }

    async openMediaSource() {
      if (
        !("MediaSource" in window)
      ) {
        throw new Error(
          "当前浏览器不支持 MediaSource。"
        );
      }

      const mediaSource =
        new MediaSource();

      this.mediaSource =
        mediaSource;

      this.objectUrl =
        URL.createObjectURL(
          mediaSource
        );

      const sourceOpenPromise =
        waitForEventOnce(
          mediaSource,
          "sourceopen",
          10000
        );

      seekRescueInternalChange =
        true;

      this.player.src =
        this.objectUrl;

      this.player.load();

      try {
        await sourceOpenPromise;
      } finally {
        seekRescueInternalChange =
          false;
      }

      for (
        const track of
        this.tracks
      ) {
        const mime =
          getTrackMime(track);

        const sourceBuffer =
          mediaSource
            .addSourceBuffer(mime);

        sourceBuffer.mode =
          "segments";

        this.sourceBuffers.set(
          track.id,
          sourceBuffer
        );

        this.appendQueues.set(
          track.id,
          []
        );
      }

      const duration =
        Number(this.info.duration) /
        Number(
          this.info.timescale ||
          1
        );

      if (
        Number.isFinite(duration) &&
        duration > 0
      ) {
        try {
          mediaSource.duration =
            duration;
        } catch (_) {}
      }
    }

    queueSourceBuffer(
      trackId,
      buffer,
      generation
    ) {
      if (
        this.destroyed ||
        generation !==
          this.currentGeneration
      ) {
        return Promise.resolve();
      }

      const queue =
        this.appendQueues.get(
          trackId
        );

      const sourceBuffer =
        this.sourceBuffers.get(
          trackId
        );

      if (
        !queue ||
        !sourceBuffer
      ) {
        return Promise.reject(
          new Error(
            "Seek Rescue SourceBuffer 不存在。"
          )
        );
      }

      return new Promise(
        (resolve, reject) => {
          queue.push({
            buffer,
            generation,
            resolve,
            reject
          });

          this.pumpSourceBuffer(
            trackId
          );
        }
      );
    }

    pumpSourceBuffer(trackId) {
      const queue =
        this.appendQueues.get(
          trackId
        );

      const sourceBuffer =
        this.sourceBuffers.get(
          trackId
        );

      if (
        !queue ||
        !sourceBuffer ||
        sourceBuffer.updating ||
        !queue.length ||
        this.destroyed
      ) {
        return;
      }

      /*
       * 丢弃旧 generation 尚未 append 的片段。
       */
      while (
        queue.length &&
        queue[0].generation !==
          this.currentGeneration
      ) {
        const stale =
          queue.shift();

        stale.resolve();
      }

      if (!queue.length) {
        return;
      }

      const item =
        queue.shift();

      const onUpdateEnd = () => {
        cleanup();
        item.resolve();
        this.pumpSourceBuffer(
          trackId
        );
      };

      const onError = () => {
        cleanup();
        item.reject(
          new Error(
            "MSE appendBuffer 失败。"
          )
        );
        this.pumpSourceBuffer(
          trackId
        );
      };

      const cleanup = () => {
        sourceBuffer
          .removeEventListener(
            "updateend",
            onUpdateEnd
          );

        sourceBuffer
          .removeEventListener(
            "error",
            onError
          );
      };

      sourceBuffer
        .addEventListener(
          "updateend",
          onUpdateEnd,
          { once: true }
        );

      sourceBuffer
        .addEventListener(
          "error",
          onError,
          { once: true }
        );

      try {
        sourceBuffer.appendBuffer(
          item.buffer
        );
      } catch (error) {
        cleanup();
        item.reject(error);

        setTimeout(
          () =>
            this.pumpSourceBuffer(
              trackId
            ),
          0
        );
      }
    }

    async waitAllQueuesIdle(
      timeout = 10000
    ) {
      const start =
        performance.now();

      while (
        !this.destroyed &&
        performance.now() -
          start <
          timeout
      ) {
        let busy = false;

        for (
          const track of
          this.tracks
        ) {
          const sb =
            this.sourceBuffers.get(
              track.id
            );

          const queue =
            this.appendQueues.get(
              track.id
            );

          if (
            (sb && sb.updating) ||
            (queue && queue.length)
          ) {
            busy = true;
            break;
          }
        }

        if (!busy) {
          return;
        }

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              35
            )
        );
      }
    }

    clearOldQueuedSegments() {
      for (
        const queue of
        this.appendQueues.values()
      ) {
        while (
          queue.length
        ) {
          const item =
            queue.shift();

          try {
            item.resolve();
          } catch (_) {}
        }
      }
    }

    buildFreshSegmenter(
      targetTime
    ) {
      const generation =
        ++seekRescueGeneration;

      this.currentGeneration =
        generation;

      const box =
        this.MP4Box.createFile();

      let readyInfo = null;
      let parseError = null;

      box.onReady =
        info => {
          readyInfo = info;
        };

      box.onError =
        error => {
          parseError =
            error instanceof Error
              ? error
              : new Error(
                  String(error)
                );
        };

      for (
        const chunk of
        this.metadataChunks
      ) {
        const copy =
          chunk.buffer.slice(0);

        copy.fileStart =
          chunk.start;

        box.appendBuffer(copy);

        if (parseError) {
          throw parseError;
        }
      }

      if (!readyInfo) {
        throw new Error(
          "重新创建 MP4 segmenter 失败。"
        );
      }

      const tracks =
        selectRescueTracks(
          readyInfo
        );

      this.currentBox =
        box;

      this.currentTraks.clear();
      this.currentSamples.clear();

      /*
       * 先配置 segmentation。
       * 约 1 秒一个 fragment，
       * 让 Seek 后第一帧尽快出来。
       */
      for (
        const track of
        tracks
      ) {
        const trak =
          getMp4Trak(
            box,
            track.id
          );

        if (!trak) {
          throw new Error(
            "找不到 MP4 Track " +
            track.id
          );
        }

        this.currentTraks.set(
          track.id,
          trak
        );

        const samples =
          box.getTrackSamplesInfo(
            track.id
          );

        this.currentSamples.set(
          track.id,
          samples
        );

        let nbSamples = 30;

        if (track.audio) {
          /*
           * AAC 常见约 43~47 samples/s，
           * 取 48 作为低延迟片段。
           */
          nbSamples = 48;
        }

        box.setSegmentOptions(
          track.id,
          track.id,
          {
            nbSamples,
            rapAlignement:
              !!track.video,
            normalizeAudioSampleEntriesForMSE:
              true
          }
        );
      }

      const videoTrack =
        tracks.find(
          track => !!track.video
        );

      let actualStart =
        targetTime;

      /*
       * 视频从前一个关键帧开始；
       * 音频从该视频关键帧附近开始。
       */
      if (videoTrack) {
        const videoTrak =
          this.currentTraks.get(
            videoTrack.id
          );

        const result =
          box.seekTrack(
            targetTime,
            true,
            videoTrak
          );

        if (
          result &&
          Number.isFinite(
            result.time
          )
        ) {
          actualStart =
            Math.max(
              0,
              result.time
            );
        }
      }

      for (
        const track of
        tracks
      ) {
        if (!track.audio) {
          continue;
        }

        const trak =
          this.currentTraks.get(
            track.id
          );

        box.seekTrack(
          actualStart,
          false,
          trak
        );
      }

      box.onSegment =
        (
          trackId,
          user,
          buffer,
          sampleNumber
        ) => {
          if (
            generation !==
              this.currentGeneration ||
            this.destroyed
          ) {
            return;
          }

          this.queueSourceBuffer(
            trackId,
            buffer,
            generation
          ).catch(error => {
            console.error(
              "Seek Rescue MSE append 失败：",
              error
            );
          });
        };

      const initSegments =
        box.initializeSegmentation(
          "per-track"
        );

      const initPromises = [];

      for (
        const init of
        initSegments || []
      ) {
        const trackId =
          Number(
            init.id ??
            init.user
          );

        if (
          !Number.isFinite(
            trackId
          )
        ) {
          continue;
        }

        initPromises.push(
          this.queueSourceBuffer(
            trackId,
            init.buffer,
            generation
          )
        );
      }

      box.start();

      this.actualStartTime =
        actualStart;

      return {
        box,
        tracks,
        generation,
        actualStart,
        initPromise:
          Promise.all(
            initPromises
          )
      };
    }

    rangeForTrackWindow(
      track,
      fromTime,
      toTime
    ) {
      const trak =
        this.currentTraks.get(
          track.id
        );

      const samples =
        this.currentSamples.get(
          track.id
        ) || [];

      if (
        !trak ||
        !samples.length
      ) {
        return null;
      }

      let startIndex =
        Number.isFinite(
          Number(trak.nextSample)
        )
          ? Number(
              trak.nextSample
            )
          : findTrackSampleIndexAtTime(
              samples,
              fromTime,
              track.timescale,
              !!track.video
            );

      startIndex =
        Math.max(
          0,
          Math.min(
            samples.length - 1,
            startIndex
          )
        );

      /*
       * 如果 nextSample 还停留在更早位置，
       * 至少向前找到 fromTime 对应的位置。
       */
      while (
        startIndex <
          samples.length - 1 &&
        sampleTimeSeconds(
          samples[startIndex],
          track.timescale
        ) <
          fromTime - 1.5
      ) {
        startIndex++;
      }

      let endIndex =
        startIndex;

      while (
        endIndex <
          samples.length - 1 &&
        sampleTimeSeconds(
          samples[endIndex],
          track.timescale
        ) <
          toTime
      ) {
        endIndex++;
      }

      let minOffset =
        Infinity;

      let maxEnd =
        -Infinity;

      for (
        let index =
          startIndex;
        index <= endIndex;
        index++
      ) {
        const sample =
          samples[index];

        const offset =
          Number(
            sample.offset
          );

        const size =
          Number(
            sample.size
          );

        if (
          !Number.isFinite(offset) ||
          !Number.isFinite(size) ||
          size < 0
        ) {
          continue;
        }

        minOffset =
          Math.min(
            minOffset,
            offset
          );

        maxEnd =
          Math.max(
            maxEnd,
            offset +
              size -
              1
          );
      }

      if (
        !Number.isFinite(
          minOffset
        ) ||
        !Number.isFinite(
          maxEnd
        ) ||
        maxEnd < minOffset
      ) {
        return null;
      }

      return {
        trackId: track.id,
        start:
          Math.max(
            0,
            Math.floor(
              minOffset
            )
          ),
        end:
          Math.min(
            Number(this.file.size) -
              1,
            Math.ceil(
              maxEnd
            )
          ),
        startIndex,
        endIndex
      };
    }

    splitRanges(ranges) {
      const specs = [];

      /*
       * 物理范围可能重叠。
       * 先做简单排序 + 合并，
       * 再切成 4 MB 请求。
       */
      const sorted =
        ranges
          .filter(Boolean)
          .sort(
            (a, b) =>
              a.start -
              b.start
          );

      const merged = [];

      for (
        const range of
        sorted
      ) {
        const last =
          merged[
            merged.length - 1
          ];

        if (
          last &&
          range.start <=
            last.end + 1
        ) {
          last.end =
            Math.max(
              last.end,
              range.end
            );
        } else {
          merged.push({
            start:
              range.start,
            end:
              range.end
          });
        }
      }

      for (
        const range of
        merged
      ) {
        let cursor =
          range.start;

        while (
          cursor <= range.end
        ) {
          const end =
            Math.min(
              range.end,
              cursor +
                SEEK_RESCUE_RANGE_CHUNK -
                1
            );

          specs.push({
            start: cursor,
            end
          });

          cursor =
            end + 1;
        }
      }

      return specs;
    }

    async fetchAndFeedSpecs(
      specs,
      box,
      generation,
      signal
    ) {
      /*
       * 最多同时 4 个 Range。
       * 对“视频轨在 200 MB、音频轨在 430 MB”
       * 这类文件，可以同时取两个物理区域，
       * 不必从中间顺序扫过去。
       */
      const concurrency = 4;
      let cursor = 0;

      const worker =
        async () => {
          while (
            cursor <
              specs.length
          ) {
            const index =
              cursor++;

            const spec =
              specs[index];

            const fetched =
              await fetchSeekRescueRange(
                this.mediaUrl,
                spec.start,
                spec.end,
                signal
              );

            if (
              this.destroyed ||
              generation !==
                this.currentGeneration
            ) {
              return;
            }

            const buffer =
              fetched.buffer;

            buffer.fileStart =
              fetched.start;

            box.appendBuffer(
              buffer
            );
          }
        };

      const workers = [];

      for (
        let index = 0;
        index <
          Math.min(
            concurrency,
            specs.length
          );
        index++
      ) {
        workers.push(
          worker()
        );
      }

      await Promise.all(
        workers
      );
    }

    async feedWindow(
      fromTime,
      toTime,
      generation
    ) {
      if (
        this.destroyed ||
        generation !==
          this.currentGeneration ||
        !this.currentBox
      ) {
        return;
      }

      const ranges =
        this.tracks.map(
          track =>
            this.rangeForTrackWindow(
              track,
              fromTime,
              toTime
            )
        );

      const specs =
        this.splitRanges(ranges);

      if (!specs.length) {
        return;
      }

      const controller =
        this.currentAbort ||
        new AbortController();

      this.currentAbort =
        controller;

      await this.fetchAndFeedSpecs(
        specs,
        this.currentBox,
        generation,
        controller.signal
      );

      if (
        toTime >=
          this.duration - 0.25
      ) {
        try {
          this.currentBox.flush();
        } catch (_) {}
      }

      this.fedUntilTime =
        Math.max(
          this.fedUntilTime,
          toTime
        );
    }

    get duration() {
      if (!this.info) return 0;

      return (
        Number(
          this.info.duration
        ) /
        Number(
          this.info.timescale ||
          1
        )
      );
    }

    isBuffered(
      time,
      margin = 0.15
    ) {
      try {
        const ranges =
          this.player.buffered;

        for (
          let index = 0;
          index <
            ranges.length;
          index++
        ) {
          if (
            time >=
              ranges.start(index) +
                margin &&
            time <=
              ranges.end(index) -
                margin
          ) {
            return true;
          }

          /*
           * 开头/结尾不足 margin 也允许。
           */
          if (
            time >=
              ranges.start(index) &&
            time <=
              ranges.end(index) &&
            (
              time <
                margin ||
              this.duration -
                time <
                margin
            )
          ) {
            return true;
          }
        }
      } catch (_) {}

      return false;
    }

    async waitUntilBuffered(
      time,
      timeout = 12000
    ) {
      const start =
        performance.now();

      while (
        !this.destroyed &&
        performance.now() -
          start <
          timeout
      ) {
        if (
          this.isBuffered(
            time,
            0.05
          )
        ) {
          return true;
        }

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              70
            )
        );
      }

      return false;
    }

    async seekTo(
      targetTime,
      shouldPlay = true,
      initial = false
    ) {
      if (this.destroyed) {
        return;
      }

      const duration =
        this.duration;

      const target =
        Math.max(
          0,
          Math.min(
            Number.isFinite(duration)
              ? duration -
                  0.05
              : targetTime,
            Math.max(
              0,
              targetTime
            )
          )
        );

      if (
        !initial &&
        this.isBuffered(
          target
        )
      ) {
        return;
      }

      if (this.currentAbort) {
        try {
          this.currentAbort.abort();
        } catch (_) {}
      }

      this.currentAbort =
        new AbortController();

      this.clearOldQueuedSegments();

      const built =
        this.buildFreshSegmenter(
          target
        );

      const generation =
        built.generation;

      await built.initPromise;

      const initialEnd =
        Math.min(
          duration,
          target +
            SEEK_RESCUE_INITIAL_AHEAD_SEC
        );

      this.fedUntilTime =
        built.actualStart;

      await this.feedWindow(
        built.actualStart,
        initialEnd,
        generation
      );

      const buffered =
        await this.waitUntilBuffered(
          target,
          14000
        );

      if (!buffered) {
        throw new Error(
          "Seek Rescue 已读取目标片段，" +
          "但浏览器未建立目标时间缓冲。"
        );
      }

      seekRescueInternalChange =
        true;

      try {
        this.player.currentTime =
          target;
      } finally {
        setTimeout(
          () => {
            seekRescueInternalChange =
              false;
          },
          350
        );
      }

      if (shouldPlay) {
        try {
          await this.player.play();
        } catch (_) {}
      }

      this.active = true;

      /*
       * 第一段已经可播后，
       * 后台继续补一段，减少马上再次等待。
       */
      this.feedWindow(
        this.fedUntilTime,
        Math.min(
          duration,
          this.fedUntilTime +
            SEEK_RESCUE_REFILL_AHEAD_SEC
        ),
        generation
      ).catch(error => {
        if (
          error?.name !==
            "AbortError"
        ) {
          console.debug(
            "Seek Rescue 后台预缓冲失败：",
            error
          );
        }
      });

      this.startRefillLoop();
    }

    startRefillLoop() {
      if (this.refillTimer) {
        return;
      }

      this.refillTimer =
        setInterval(
          () => {
            if (
              this.destroyed ||
              !this.active ||
              this.player.paused ||
              !this.currentBox
            ) {
              return;
            }

            const ahead =
              getBufferedAhead(
                this.player
              );

            if (
              ahead >
                SEEK_RESCUE_REFILL_THRESHOLD_SEC
            ) {
              return;
            }

            const generation =
              this.currentGeneration;

            const from =
              this.fedUntilTime;

            const to =
              Math.min(
                this.duration,
                from +
                  SEEK_RESCUE_REFILL_AHEAD_SEC
              );

            if (
              to <=
                from + 0.1
            ) {
              return;
            }

            this.feedWindow(
              from,
              to,
              generation
            ).catch(error => {
              if (
                error?.name !==
                  "AbortError"
              ) {
                console.debug(
                  "Seek Rescue 自动续缓冲失败：",
                  error
                );
              }
            });
          },
          1200
        );
    }

    async activate(
      targetTime,
      shouldPlay
    ) {
      await this.prepareIndex();
      await this.openMediaSource();

      await this.seekTo(
        targetTime,
        shouldPlay,
        true
      );

      this.active = true;
    }

    destroy() {
      this.destroyed = true;
      this.active = false;

      if (this.refillTimer) {
        clearInterval(
          this.refillTimer
        );

        this.refillTimer = null;
      }

      if (this.currentAbort) {
        try {
          this.currentAbort.abort();
        } catch (_) {}

        this.currentAbort = null;
      }

      this.clearOldQueuedSegments();

      if (
        this.objectUrl
      ) {
        try {
          URL.revokeObjectURL(
            this.objectUrl
          );
        } catch (_) {}

        this.objectUrl = null;
      }

      this.currentBox = null;
    }
  }

  function clearSeekRescueWatchdog() {
    if (seekRescueWatchdog) {
      clearTimeout(
        seekRescueWatchdog
      );

      seekRescueWatchdog = null;
    }

    seekRescueProbe = null;
  }

  function destroySeekRescue() {
    clearSeekRescueWatchdog();

    if (
      seekRescueDebounceTimer
    ) {
      clearTimeout(
        seekRescueDebounceTimer
      );

      seekRescueDebounceTimer =
        null;
    }

    if (seekRescueSession) {
      seekRescueSession.destroy();
      seekRescueSession = null;
    }

    seekRescueActivation = null;
    seekRescueInternalChange =
      false;
  }

  async function restoreNativeAfterRescueFailure(
    file,
    targetTime,
    shouldPlay
  ) {
    const player =
      document.getElementById(
        "player"
      );

    if (!player || !file) {
      return;
    }

    const mediaUrl =
      getMediaUrlForFile(file);

    seekRescueInternalChange =
      true;

    player.src =
      mediaUrl;

    player.load();

    const restoreTime =
      () => {
        try {
          player.currentTime =
            Math.max(
              0,
              targetTime
            );
        } catch (_) {}

        if (shouldPlay) {
          player.play()
            .catch(() => {});
        }

        setTimeout(
          () => {
            seekRescueInternalChange =
              false;
          },
          350
        );
      };

    if (
      player.readyState >= 1
    ) {
      restoreTime();
    } else {
      player.addEventListener(
        "loadedmetadata",
        restoreTime,
        { once: true }
      );
    }
  }

  async function activateSeekRescue(
    targetTime,
    reason =
      "Seek timeout"
  ) {
    if (
      seekRescueSession &&
      seekRescueSession.active
    ) {
      return seekRescueSession
        .seekTo(
          targetTime,
          !document
            .getElementById(
              "player"
            )
            .paused
        );
    }

    if (seekRescueActivation) {
      return seekRescueActivation;
    }

    const file =
      videoPlaylist[
        currentVideoIndex
      ];

    const player =
      document.getElementById(
        "player"
      );

    if (
      !file ||
      !player ||
      !isMp4VideoFile(file)
    ) {
      return;
    }

    const shouldPlay =
      !player.paused;

    const mediaUrl =
      getMediaUrlForFile(file);

    seekRescueActivation =
      (async () => {
        setStatus(
          "Seek Rescue · 正在分析 MP4…"
        );

        console.warn(
          "启动 MP4 Seek Rescue：",
          {
            file:
              file.name,
            targetTime,
            reason
          }
        );

        const session =
          new SeekRescueSession(
            player,
            file,
            mediaUrl
          );

        seekRescueSession =
          session;

        try {
          await session.activate(
            targetTime,
            shouldPlay
          );

          /*
           * 只要 Rescue 成功，就记住。
           * 如果进一步确认音视频物理位置明显分离，
           * 日志里会明确标出。
           */
          rememberSeekRescue(
            file.id
          );

          const quality =
            document.getElementById(
              "quality"
            );

          if (
            quality &&
            !quality.textContent
              .includes(
                "Seek Rescue"
              )
          ) {
            quality.textContent +=
              " · Seek Rescue";
          }

          setStatus(
            session
              .strongTrackSeparation
              ? "Original · Seek Rescue（检测到轨道分离）"
              : "Original · Seek Rescue"
          );

          return true;
        } catch (error) {
          console.error(
            "Seek Rescue 启动失败：",
            error
          );

          session.destroy();

          if (
            seekRescueSession ===
              session
          ) {
            seekRescueSession =
              null;
          }

          setStatus(
            "Seek Rescue 失败 · 已回退原生播放"
          );

          await restoreNativeAfterRescueFailure(
            file,
            targetTime,
            shouldPlay
          );

          return false;
        } finally {
          seekRescueActivation =
            null;
        }
      })();

    return seekRescueActivation;
  }

  function scheduleActiveRescueSeek(
    targetTime
  ) {
    if (
      seekRescueDebounceTimer
    ) {
      clearTimeout(
        seekRescueDebounceTimer
      );
    }

    seekRescueDebounceTimer =
      setTimeout(
        () => {
          seekRescueDebounceTimer =
            null;

          if (
            !seekRescueSession ||
            !seekRescueSession.active ||
            seekRescueInternalChange
          ) {
            return;
          }

          const player =
            document.getElementById(
              "player"
            );

          seekRescueSession
            .seekTo(
              targetTime,
              !player.paused
            )
            .catch(error => {
              console.error(
                "Seek Rescue 二次 Seek 失败：",
                error
              );
            });
        },
        SEEK_RESCUE_DEBOUNCE_MS
      );
  }

  function handlePlayerSeekingForRescue() {
    if (
      seekRescueInternalChange
    ) {
      return;
    }

    const player =
      document.getElementById(
        "player"
      );

    const file =
      videoPlaylist[
        currentVideoIndex
      ];

    if (
      !player ||
      !file ||
      !isMp4VideoFile(file)
    ) {
      return;
    }

    const targetTime =
      player.currentTime;

    /*
     * 已经处于 Rescue 时，
     * 后续拖动交给 MSE Rescue 自己补目标片段。
     */
    if (
      seekRescueSession &&
      seekRescueSession.active
    ) {
      scheduleActiveRescueSeek(
        targetTime
      );

      return;
    }

    clearSeekRescueWatchdog();

    seekRescueProbe = {
      fileId:
        file.id,
      targetTime,
      startedAt:
        performance.now(),
      startCurrentTime:
        player.currentTime,
      shouldPlay:
        !player.paused
    };

    /*
     * 以前已经确认需要 Rescue 的 fileId：
     * 不必先卡 2.6 秒。
     * 等拖动动作稳定 220 ms 后直接接管。
     */
    if (
      isSeekRescueRemembered(
        file.id
      )
    ) {
      seekRescueWatchdog =
        setTimeout(
          () => {
            const probe =
              seekRescueProbe;

            if (
              !probe ||
              probe.fileId !==
                currentFileId
            ) {
              return;
            }

            activateSeekRescue(
              player.currentTime,
              "remembered file"
            );
          },
          SEEK_RESCUE_DEBOUNCE_MS
        );

      return;
    }

    seekRescueWatchdog =
      setTimeout(
        () => {
          const probe =
            seekRescueProbe;

          if (
            !probe ||
            probe.fileId !==
              currentFileId ||
            seekRescueInternalChange ||
            (
              seekRescueSession &&
              seekRescueSession.active
            )
          ) {
            return;
          }

          /*
           * 正常播放中的 Seek：
           * 2.6 秒以后如果仍 seeking / 缓冲不足 /
           * 时间没有继续向前走，就启动 Rescue。
           */
          const current =
            player.currentTime;

          const advanced =
            current -
            probe.targetTime;

          const looksStuck =
            player.seeking ||
            player.readyState < 3 ||
            (
              probe.shouldPlay &&
              advanced < 0.20
            );

          if (
            looksStuck
          ) {
            activateSeekRescue(
              probe.targetTime,
              "native seek stalled"
            );
          } else {
            clearSeekRescueWatchdog();
          }
        },
        SEEK_RESCUE_TIMEOUT_MS
      );
  }

  function handlePlayerProgressForRescue() {
    if (
      !seekRescueProbe ||
      seekRescueInternalChange ||
      (
        seekRescueSession &&
        seekRescueSession.active
      )
    ) {
      return;
    }

    const player =
      document.getElementById(
        "player"
      );

    if (!player) return;

    const probe =
      seekRescueProbe;

    /*
     * 用户 Seek 后已经稳定播放超过约 0.35 秒，
     * 判定原生 Seek 成功，不触发 Rescue。
     */
    if (
      !player.seeking &&
      player.readyState >= 3 &&
      (
        !probe.shouldPlay ||
        player.currentTime -
          probe.targetTime >
          0.35
      )
    ) {
      clearSeekRescueWatchdog();
    }
  }

  function getSeekRescueDiagnosticText() {
    if (
      seekRescueSession &&
      seekRescueSession.active
    ) {
      return (
        "已启用 · MP4Box + MSE" +
        (
          seekRescueSession
            .strongTrackSeparation
            ? " · 轨道物理分离"
            : ""
        )
      );
    }

    if (
      isSeekRescueRemembered(
        currentFileId
      )
    ) {
      return "待命 · 此文件已记忆为 Seek Rescue";
    }

    return "待命 · 原生 Seek 优先";
  }

  function parseDriveState() {

    const params = new URLSearchParams(window.location.search);
    const rawState = params.get("state");

    if (!rawState) {
      return null;
    }

    try {

      const state = JSON.parse(rawState);

      if (
        state.action === "open" &&
        Array.isArray(state.ids) &&
        state.ids.length > 0
      ) {

        const id = state.ids[0];

        let resourceKey = null;

        if (
          state.resourceKeys &&
          state.resourceKeys[id]
        ) {
          resourceKey = state.resourceKeys[id];
        }

        return {
          fileId: id,
          resourceKey: resourceKey
        };

      }

    } catch (err) {

      console.error("state 解析失败：", err);

    }

    return null;
  }

  /*
   * 从 Drive API 读取视频
   */

  async function openDriveVideo(accessToken) {
    setStatus("正在读取文件信息…");
    currentAccessToken = accessToken;

    try {
      const metadataUrl =
        "https://www.googleapis.com/drive/v3/files/" +
        encodeURIComponent(currentFileId) +
        "?supportsAllDrives=true&fields=" +
        encodeURIComponent(
          "id,name,mimeType,size,thumbnailLink,resourceKey,parents,driveId,capabilities,videoMediaMetadata"
        );

      const headers = { "Authorization": "Bearer " + accessToken };
      if (currentResourceKey) {
        headers["X-Goog-Drive-Resource-Keys"] = currentFileId + "/" + currentResourceKey;
      }

      const metadataResponse = await fetch(metadataUrl, { headers, cache: "no-store" });
      if (!metadataResponse.ok) {
        const text = await metadataResponse.text();
        throw new Error(
          "无法读取 Drive 文件信息。\\nHTTP " + metadataResponse.status + "\\n" + text
        );
      }

      const openedFile = await metadataResponse.json();
      openedFile.resourceKey = openedFile.resourceKey || currentResourceKey || null;

      if (openedFile.mimeType && openedFile.mimeType.startsWith("image/")) {
        window.location.replace("./gallery/" + window.location.search);
        return;
      }

      if (!isVideoFile(openedFile)) {
        throw new Error("当前文件不是可识别的视频文件。");
      }

      try {
        setStatus("正在定位 " + VIDEO_ROOT_FOLDER_NAME);

        videoRootFolder =
          await findVideoRootFolder(
            openedFile,
            accessToken
          );

        if (videoRootFolder) {
          setStatus(
            "正在读取 " +
            (videoRootFolder.name || VIDEO_ROOT_FOLDER_NAME) +
            " 文件树"
          );

          videoTreeRoot =
            await buildVideoFolderTree(
              videoRootFolder,
              accessToken
            );

          videoPlaylist =
            flattenVideosFromTree(
              videoTreeRoot
            );

          /*
           * 初始不要展开所有子文件夹。
           * 只展开当前从 Drive 打开的目标视频所在路径。
           */
          expandOnlyPathToVideo(
            videoTreeRoot,
            openedFile.id
          );
        } else {
          videoTreeRoot = null;
          videoPlaylist = [openedFile];
        }
      } catch (error) {
        console.warn(
          "读取递归视频文件树失败，退回单视频模式：",
          error
        );

        videoTreeRoot = null;
        videoRootFolder = null;
        videoPlaylist = [openedFile];
      }

      currentVideoIndex =
        videoPlaylist.findIndex(
          file => file.id === openedFile.id
        );

      if (currentVideoIndex < 0) {
        // 当前视频理论上应当位于 1433223 文件树内。
        // 如果 Drive 返回的目录关系异常，仍保证当前视频可播放。
        openedFile._playlistIndex = 0;
        openedFile._folderPath =
          videoRootFolder
            ? videoRootFolder.name
            : "";
        videoPlaylist.unshift(openedFile);
        videoPlaylist.forEach(
          (file, index) =>
            file._playlistIndex = index
        );
        currentVideoIndex = 0;
      }

      document.getElementById("welcome").style.display = "none";
      document.getElementById("playerWrap").style.display = "block";
      document.getElementById("videoListBtn").style.display = (videoTreeRoot || videoPlaylist.length > 1) ? "inline-block" : "none";

      initVideoPlayerEventsOnce();
      renderVideoPlaylist();
      await switchVideoByIndex(currentVideoIndex, true);
    } catch (err) {
      console.error(err);
      setStatus("读取失败");
      showError(err.message || String(err));
    }
  }

// WebGPU 模式下补齐最常用的键盘控制。
document.addEventListener("keydown", event => {
  if (!gpuActive) return;

  const tag =
    event.target && event.target.tagName
      ? event.target.tagName.toLowerCase()
      : "";

  if (tag === "input" || tag === "button") return;

  const player = document.getElementById("player");
  if (!player) return;

  if (event.code === "Space") {
    event.preventDefault();
    gpuTogglePlay();
  } else if (event.key === "ArrowLeft") {
    player.currentTime = Math.max(0, player.currentTime - 5);
  } else if (event.key === "ArrowRight") {
    player.currentTime = Math.min(
      Number.isFinite(player.duration) ? player.duration : Infinity,
      player.currentTime + 5
    );
  }
});

  // 每 30 分钟自动更新一次 Access Token
setInterval(
  refreshWorkerAccessToken,
  30 * 60 * 1000
);

// 页面放后台很久后重新回来时，马上更新
document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      refreshWorkerAccessToken();

      const player = document.getElementById("player");
      if (
        player &&
        player.readyState >= 2 &&
        !smoothDeviceMode &&
        !gpuActive &&
        !gpuInitializing
      ) {
        enableWebGPUEnhancement();
      }
    }
  }
);

// 切回这个窗口时也更新
window.addEventListener(
  "focus",
  refreshWorkerAccessToken
);
