<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>星映 · 目录</title>
  <script src="../assets/android-preload.js"></script>
  <link rel="stylesheet" href="../assets/theme.css?v=starlight-5" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0f1d; color: #e8ecf7; font: 15px/1.5 system-ui, -apple-system, "Noto Sans SC", sans-serif; }
    header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 14px 18px; background: #0b0f1de8; backdrop-filter: blur(10px); border-bottom: 1px solid #1e2740; }
    h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .02em; }
    h1 small { display: block; font-size: 11px; color: #7d8aa8; font-weight: 400; letter-spacing: .18em; }
    .grow { flex: 1 1 220px; }
    input[type="search"] { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid #253055;
      background: #131a2c; color: inherit; font-size: 15px; outline: none; }
    input[type="search"]:focus { border-color: #4b6bff; }
    button { padding: 10px 14px; border-radius: 12px; border: 1px solid #2b3757; background: #172038;
      color: inherit; font-size: 14px; cursor: pointer; }
    button:active { transform: translateY(1px); }
    button.primary { background: #2f4bff; border-color: #2f4bff; }
    main { padding: 16px 18px 90px; }
    #status { color: #93a0bd; font-size: 13px; margin: 0 0 12px; white-space: pre-wrap; }
    #error { color: #ff9aa8; font-size: 13px; margin: 0 0 12px; white-space: pre-wrap; }
    #list { display: grid; gap: 10px; }
    .row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px;
      background: #121a2c; border: 1px solid #1d2740; cursor: pointer; }
    .row:active { background: #18223a; }
    .badge { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
      background: #1b2440; color: #8fa6ff; font-size: 16px; }
    .meta { min-width: 0; flex: 1; }
    .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .path { font-size: 12px; color: #77839f; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .size { flex: 0 0 auto; font-size: 12px; color: #77839f; }
    #empty { color: #77839f; padding: 26px 4px; }
    dialog { border: 0; padding: 0; background: transparent; width: 100%; max-width: 100%; height: 100%; margin: 0; }
    dialog::backdrop { background: #05070f; }
    .stage { position: fixed; inset: 0; display: flex; flex-direction: column; background: #05070f; }
    .stage video { flex: 1; width: 100%; min-height: 0; background: #000; }
    .stage .bar { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid #1b2440; }
    .stage .bar .title { flex: 1; min-width: 0; font-size: 13px; color: #b9c4dc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #playerMsg { color: #ff9aa8; font-size: 13px; padding: 0 16px 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<header>
  <h1><span id="appTitle">星映</span><small id="appSub">VIDEO LIBRARY</small></h1>
  <div class="grow"><input id="search" type="search" placeholder="搜索视频名或目录…" autocomplete="off" /></div>
  <button id="refresh" type="button">刷新</button>
  <button id="connect" type="button" class="primary">连接 Drive</button>
</header>
<main>
  <p id="status">准备中</p>
<p id="error" hidden></p>
  <p id="hint" style="color:#77839f;font-size:12px;margin:0 0 12px">首次使用需登录 Google：请选「应用内置页面」，并同意 Drive 读取权限。若提示「尚未完成 Google 验证流程」，该邮箱需先加入 OAuth 测试用户。</p>
  <div id="list"></div>
  <div id="empty" hidden>没有匹配的视频。换个关键词试试。</div>
</main>
<dialog id="viewer">
  <div class="stage">
    <video id="video" controls playsinline preload="metadata"></video>
    <p id="playerMsg" hidden></p>
    <button id="backToList" type="button" style="position:absolute;top:12px;left:12px;z-index:9">← 返回列表</button>
    <div class="bar">
      <span class="title" id="playingTitle"></span>
      <button id="transcodeBtn" type="button" hidden>转码播放</button>
      <button id="externalBtn" type="button" hidden>用其它播放器打开</button>
      <button id="closePlayer" type="button">关闭</button>
    </div>
  </div>
</dialog>
<script src="root3.js?v=1"></script>
</body>
</html>
